<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link rel="icon" href="/favicon.png">
    <title>Corruption Corp</title>
    <script>
      // Paint the background dark BEFORE React mounts when dark mode is saved,
      // so a refresh in dark mode never flashes the light background first.
      try {
        if (localStorage.getItem('cc-dark') === '1')
          document.documentElement.classList.add('cc-dark')
      } catch (e) {}
    </script>
    <script>
      // App-program deep links (/pinballa) jump straight to the standalone app
      // instead of booting the whole React/3D site just to redirect (App.jsx's
      // parseRoute still handles it as a fallback). Keep the route + target in
      // sync with data/programs/Pinballa/page.txt (`route` / `app` fields).
      // /pinballa/<name> opens a specific published machine (?machine=<name>).
      // Machine Shop machines are private to their account and deliberately
      // have no route.
      try {
        var segs = decodeURIComponent(location.pathname)
          .replace(/^\/+|\/+$/g, '')
          .toLowerCase()
          .split('/')
        if (segs[0] === 'pinballa') {
          if (segs[1]) location.replace('/pinball/index.html?machine=' + encodeURIComponent(segs[1]))
          else location.replace('/pinball/index.html')
        }
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="/assets/index-BqD8YGn2.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DvyfqmzG.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
