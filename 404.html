<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the app is a full-bleed fixed layer (`.app`), so it
         should reach into a notched phone's safe-area rather than sit in a
         letterbox. user-scalable=no because every gesture here is the site's
         own — the 3D menu, the moodboard's pan/zoom, the Grit reader. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" href="/favicon.png">
    <!-- Installable app. Installed, there IS no browser chrome to retract, so
         the viewport is constant by construction — which is the only complete
         answer to the URL bar resizing the page (see `.app` in styles.css for
         what the in-browser case does instead). Deliberately OUTSIDE the seo
         markers: the route plugin rewrites everything between those per route,
         and these are the same for every one. -->
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/cc-any-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Corruption Corp">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- seo:start -->
    <title>Not found — Corruption Corp</title>
    <meta name="description" content="This site is a collection programs, artists and media curated by Corruption Corp" />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://corruptioncorp.net/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Corruption Corp" />
    <meta property="og:title" content="Not found — Corruption Corp" />
    <meta property="og:description" content="This site is a collection programs, artists and media curated by Corruption Corp" />
    <meta property="og:url" content="https://corruptioncorp.net/" />
    <meta property="og:image" content="https://corruptioncorp.net/share/corruption-corp.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Not found — Corruption Corp" />
    <meta name="twitter:description" content="This site is a collection programs, artists and media curated by Corruption Corp" />
    <meta name="twitter:image" content="https://corruptioncorp.net/share/corruption-corp.png" />
    <meta name="theme-color" content="#e8e8e8" />
    <!-- seo:end -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Corruption Corp",
        "url": "https://corruptioncorp.net/",
        "logo": "https://corruptioncorp.net/hud/cclogo.png",
        "sameAs": [
          "https://instagram.com/corruptioncorporation",
          "https://x.com/corruptioncorpp",
          "https://youtube.com/@corruptioncorporation"
        ]
      }
    </script>
    <script>
      // Register the service worker. It exists only to make the app
      // INSTALLABLE (Chrome requires one that answers offline) — see
      // data/site/sw.js, which is deliberately network-first so a deploy is
      // never hidden behind a stale cache. Failure is not worth reporting: it
      // costs the install prompt, nothing else.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {})
        })
      }
    </script>
    <script>
      // Paint the background dark BEFORE React mounts when dark mode is saved,
      // so a refresh in dark mode never flashes the light background first.
      try {
        if (localStorage.getItem('cc-dark') === '1')
          document.documentElement.classList.add('cc-dark')
      } catch (e) {}
    </script>
    <script>
      // /pinballa/<name> opens a specific published machine. The bare /pinballa
      // no longer needs anything here: the build writes the Pinballa app's own
      // html at /pinballa/index.html, so that URL loads the app directly and
      // STAYS /pinballa (it used to bounce to /pinball/index.html). Only the
      // per-machine form still lands on the site shell — via 404.html, since
      // published machines are Firestore data and can't be enumerated at build
      // time — so it's rewritten onto the same clean path.
      // Machine Shop machines are private to their account and have no route.
      try {
        var segs = decodeURIComponent(location.pathname)
          .replace(/^\/+|\/+$/g, '')
          .toLowerCase()
          .split('/')
        if (segs[0] === 'pinballa' && segs[1]) {
          location.replace('/pinballa/?machine=' + encodeURIComponent(segs[1]))
        }
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="/assets/index-C9s0JLxw.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CyuPfyrN.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
