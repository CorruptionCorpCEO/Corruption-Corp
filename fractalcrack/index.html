   here is captured on #tlTrack rather than on a lane, so a rebuild mid-drag
   loses nothing. */
function tlRender(){
  if(!tlOpen) return;                    // drawn fresh whenever it opens
  const ks = tlLaneKeys();
  const frag = document.createDocumentFragment();
  tlLaneEls = {};
  if(!ks.length) frag.appendChild(tlLaneEl(null));
  ks.forEach(k => { const el = tlLaneEl(k); tlLaneEls[k] = el; frag.appendChild(el); });
  tlRows.textContent = "";
  tlRows.appendChild(frag);
  tlHotK = undefined; tlSyncFocus();
}
/* Scroll a lane into view inside the list (never the page): the sticky ruler
   covers the top of the scrollport, so "in view" starts below it. */
function tlReveal(k){
  const el = tlLaneEls[k];
  if(!el) return;
  const rh = tlTrack.firstElementChild.firstElementChild.offsetHeight;   // the ruler row
  const top = el.offsetTop - rh, bottom = el.offsetTop + el.offsetHeight;
  if(top < tlTrack.scrollTop) tlTrack.scrollTop = top;
  else if(bottom > tlTrack.scrollTop + tlTrack.clientHeight) tlTrack.scrollTop = bottom - tlTrack.clientHeight;
}

/* Seconds along the top — the loop runs 60 frames to the second, so the
   notches are every TL_FPS frames. Every second gets one while they are at
   least 4px apart; the numbered ones are spaced so their labels never touch. */
function tlBuildRuler(){
  tlTicks.textContent = "";
  const w = tlTrackW;
  if(!w) return;
  const secs = tlLen / TL_FPS, pps = w / secs;
  const label = [1, 2, 5, 10, 15, 30, 60, 120, 300].find(s => s * pps >= 30) || 600;
  const minor = pps >= 4 ? 1 : label;
  const frag = document.createDocumentFragment();
  for(let s = 0; s <= secs + TL_EPS; s += minor){
    const pct = (s / secs * 100) + "%";
    const major = s % label === 0;
    const tick = document.createElement("div");
    tick.className = "tl-tick" + (major ? " major" : "");
    tick.style.left = pct;
    frag.appendChild(tick);
    if(major){
      const num = document.createElement("div");
      num.className = "tl-num";
      num.style.left = pct;
      num.textContent = s + "s";
      frag.appendChild(num);
    }
  }
  tlTicks.appendChild(frag);
}

/* Every frame while the editor is open, so it only writes what changed. */
function tlDrawHead(){
  if(!tlOpen) return;
  const px = Math.round(Math.min(1, tlTime / tlLen) * tlTrackW * 2) / 2;
  if(px !== tlHeadPx){
    tlHeadPx = px;
    tlHead.style.transform = tlCap.style.transform = "translateX(" + px + "px)";
  }
  const txt = tlFmtT(tlTime);
  if(txt !== tlClockTxt){ tlClockTxt = txt; tlClock.textContent = txt; }
}
function tlMeasure(){
  const w = tlHeadLayer.clientWidth;
  if(w === tlTrackW) return;
  tlTrackW = w;
  tlBuildRuler();
  tlHeadPx = -1;
  tlDrawHead();
}

/* Where the dock's top edge is, in px up from the bottom of the screen, as
   --tl-top — what the legend stacks itself on (see its rule). Measured from
   layout, not getBoundingClientRect, because mid-ride the rect is somewhere
   in a transition and the number wanted is where it is going. */
let tlLift = 0, tlTopPx = -1;
function tlSyncTop(){
  const b = parseFloat(getComputedStyle(tlDock).bottom) || 0;
  const top = Math.round(b + tlDock.offsetHeight + tlLift);
  if(top === tlTopPx) return;
  tlTopPx = top;
  hud.style.setProperty("--tl-top", top + "px");
}
/* Called by placeSheet with how far the pull bar has risen. Only the phone
   layout has a sheet to ride. */
function tlRide(lift){
  tlLift = SHEET_MQ.matches ? lift : 0;
  tlDock.style.transform = tlLift ? "translateY(" + (-tlLift) + "px)" : "";
  tlSyncTop();
}

let tlMsgTimer = null;
function tlNote(s){
  tlMsg.textContent = s;
  tlMsg.classList.add("show");
  clearTimeout(tlMsgTimer);
  tlMsgTimer = setTimeout(() => tlMsg.classList.remove("show"), 2600);
}

/* ---------- open / play ---------- */
function tlSetOpen(v){
  tlOpen = v;
  hud.classList.toggle("tl-open", v);
  tlToggle.setAttribute("aria-expanded", String(v));
  if(v){
    tlRender();
    tlTrackW = 0; tlMeasure();           // display:none until now, so never measured
    tlSyncClear();
    tlClockTxt = ""; tlDrawHead();
    if(tlActiveK) tlReveal(tlActiveK);
  } else {
    tlPointerIn = false;
    tlDisarmClear();
    /* Done editing: let it play. A playhead left parked behind a closed
       editor just looks like an animation that has stopped working. */
    if(!tlRunning) tlSetRunning(true);
  }
  tlSyncTop();
  tlRefreshHint();
  wake();
}

/* After a POINTER press, hand focus back to the page, so that Space goes on
   meaning play/pause (the window handler only answers with focus on the
   body) instead of pressing the same little button again. A keyboard press
   (detail 0) keeps its focus. */
const tlUnfocus = e => { if(e.detail > 0 && e.currentTarget.blur) e.currentTarget.blur(); };

tlToggle.addEventListener("click", e => { tlUnfocus(e); tlSetOpen(!tlOpen); });

tlPlay.addEventListener("click", e => {
  tlUnfocus(e);
  if(tlRunning){
    tlSetRunning(false);
    tlSeek(Math.round(tlTime));          // parks on a whole frame, like a click does
  } else {
    tlSetRunning(true);
  }
});

/* ---------- length, typed in frames ----------
   Committed on Enter or on leaving the box; Escape puts it back. It cannot be
   made shorter than the last key — that key would sit somewhere the playhead
   never goes — so a shorter number stops at the key and says so, rather than
   silently throwing keys away over a typo. */
/* CRENZO's digits are ~1.4em each, so the box is its digits wide and no more. */
function tlSizeLen(){ tlLenIn.style.width = (Math.max(2, tlLenIn.value.length) * 1.45) + "em"; }
function tlSetLen(L){
  tlLen = L;
  tlLenIn.value = String(L);
  tlSizeLen();
  if(tlTime > tlLen) tlTime %= tlLen;
  tlBuildRuler(); tlRender();
  tlHeadPx = -1; tlDrawHead();
}
function tlCommitLen(){
  let n = parseInt(tlLenIn.value.replace(/[^\d]/g, ""), 10);
  if(!isFinite(n)){ tlLenIn.value = String(tlLen); tlSizeLen(); return; }
  n = Math.max(TL_MIN_LEN, Math.min(TL_MAX_LEN, n));
  const last = Math.ceil(tlLastKey() - TL_EPS);
  if(n < last){ n = last; tlNote("a key sits at frame " + last); }
  if(n !== tlLen) tlSetLen(n);
  else { tlLenIn.value = String(n); tlSizeLen(); }
}
tlLenIn.addEventListener("input", tlSizeLen);
tlLenIn.addEventListener("keydown", e => {
  e.stopPropagation();                   // Space, R and Escape mean other things out there
  if(e.key === "Enter"){ e.preventDefault(); tlLenIn.blur(); }
  else if(e.key === "Escape"){ e.preventDefault(); tlLenIn.value = String(tlLen); tlLenIn.blur(); }
  else if(e.key === "ArrowUp" || e.key === "ArrowDown"){
    e.preventDefault();
    const by = (e.shiftKey ? TL_FPS : 1) * (e.key === "ArrowUp" ? 1 : -1);
    tlLenIn.value = String((parseInt(tlLenIn.value, 10) || tlLen) + by);
    tlCommitLen();
  }
});
/* Typing holds the hud up (see wake): the keys pressed in here never reach
   the window's wake listener, and a phone's on-screen keyboard sends none. */
tlLenIn.addEventListener("focus", () => { tlTyping = true; wake(); tlLenIn.select(); });
tlLenIn.addEventListener("blur", () => { tlTyping = false; tlCommitLen(); wake(); });

/* ---------- clear all, two-step ---------- */
let tlArmedAt = 0, tlArmTimer = null;
function tlDisarmClear(){
  tlArmedAt = 0;
  clearTimeout(tlArmTimer);
  tlClear.classList.remove("armed");
  tlClear.setAttribute("aria-label", "Clear all keyframes");
}
function tlSyncClear(){
  const any = tlHasKeys();
  tlClear.disabled = !any;
  if(!any) tlDisarmClear();
}
tlClear.addEventListener("click", e => {
  tlUnfocus(e);
  if(!tlArmedAt){
    tlArmedAt = Date.now();
    tlClear.classList.add("armed");
    tlClear.setAttribute("aria-label", "Press again to clear all keyframes");
    tlArmTimer = setTimeout(tlDisarmClear, TL_ARM_MS);
    return;
  }
  /* The exit plate's floor: two presses inside one double-click are one
     mis-hit, not a decision. */
  if(Date.now() - tlArmedAt < TL_ARM_MIN_MS) return;
  tracks = {};
  tlSyncClear(); tlRender(); tlRefreshHint();
  tlNote("keyframes cleared");
});

/* One knob's keys, from its lane's own delete. The knob keeps whatever value
   it is showing; if it is the knob last pressed, its lane stays as the draft. */
function tlClearKnob(k){
  if(!tracks[k]) return;
  delete tracks[k];
  tlRender(); tlSyncClear(); tlRefreshHint();
  tlNote(TL_KEYABLE[k].def.label + " cleared");
}

/* ---------- the lanes ---------- */
/* The lines' shared column, in viewport px — every line spans the same x
   range as #tlHeadLayer, so one rect serves all of them. */
function tlGeom(){
  const r = tlHeadLayer.getBoundingClientRect();
  return {left:r.left, w:r.width || 1};
}
function tlHitKey(k, x, w){
  const ks = k && tracks[k];
  if(!ks) return null;
  let best = null, bestD = TL_HIT + 0.001;
  ks.forEach(q => {
    const d = Math.abs(q.t / tlLen * w - x);
    if(d < bestD){ bestD = d; best = q; }
  });
  return best;
}
/* Where a frame on the line settles: onto a key within reach in ANY lane (so
   a key can be landed on exactly and edited, or lined up with another knob's,
   not missed by a pixel), else onto a whole second, else a whole frame. */
function tlSnap(t, w, skip){
  const ppf = w / tlLen;
  let best = null, bestD = TL_HIT + 0.001;
  for(const k in tracks) tracks[k].forEach(q => {
    if(q === skip) return;
    const d = Math.abs(q.t - t) * ppf;
    if(d < bestD){ bestD = d; best = q.t; }
  });
  if(best !== null) return best;
  const s = Math.round(t / TL_FPS) * TL_FPS;
  if(Math.abs(s - t) * ppf <= TL_SNAP_S) return s;
  return Math.round(t);
}
function tlRemoveKey(k, q){
  const ks = tracks[k];
  if(!ks) return;
  const i = ks.indexOf(q);
  if(i >= 0) ks.splice(i, 1);
  if(!ks.length) delete tracks[k];
  tlRender(); tlSyncClear(); tlApply(); tlRefreshHint();
  tlNote("keyframe removed");
}

/* Pointer handling for the whole list, on the scroller itself: lanes are
   rebuilt under a drag (a moved key re-sorts, a deleted one goes), and a
   capture held by an element that has just been replaced is a capture lost.
     mouse/pen on a line — straight away: park + seek (or grab the key under
       it), then drag to scrub or to move that key; off its line to delete it.
     touch on a line — nothing until it moves or lifts: a lift is a tap (seek),
       a mostly-VERTICAL move scrolls the list, anything else scrubs. Deciding
       late is what keeps "scroll the lanes" from also yanking the playhead.
       A touch that lands on a key grabs it at once, as a mouse does.
     the name — a press there is the button's own click (select that knob);
       on touch a vertical swipe starting there scrolls instead, and the click
       it would end in is swallowed.
     the delete — its own click, left entirely alone. */
let tlLastPointer = "mouse";
let tlSwallowClick = false;
tlTrack.addEventListener("pointerdown", e => {
  tlLastPointer = e.pointerType;
  tlSwallowClick = false;
  if(tlGesture || (e.pointerType === "mouse" && e.button !== 0)) return;
  const tg = e.target;
  if(tg.closest(".tl-del")) return;
  const touch = e.pointerType === "touch";
  const onLab = !!tg.closest(".tl-lab");
  if(onLab && !touch) return;
  const lane = tg.closest(".tl-lane");
  const k = (lane && lane.dataset.k) || null;
  const g0 = tlGeom();
  const x = e.clientX - g0.left;
  const q = onLab ? null : tlHitKey(k, x, g0.w);
  tlGesture = {id:e.pointerId, x0:e.clientX, y0:e.clientY, left:g0.left, w:g0.w,
               k, q, t0: q ? q.t : 0, onLab, scroll0: tlTrack.scrollTop,
               mode: q ? "key" : (touch ? "maybe" : "scrub"), moved:false, doomed:false};
  /* Not on a name: there the capture would retarget the click that selects
     its knob. A touch is held by the name implicitly anyway, and its moves
     still bubble up here. */
  if(!onLab){ try{ tlTrack.setPointerCapture(e.pointerId); }catch(_){} }
  dragCount++; wake();                    // held up for the length of the gesture
  if(!onLab) e.preventDefault();
  if(q){ tlSetRunning(false); tlSeek(q.t); }
  else if(!touch){ tlSetRunning(false); tlSeek(tlClampT(tlSnap(x / g0.w * tlLen, g0.w))); }
});
tlTrack.addEventListener("pointermove", e => {
  const g = tlGesture;
  if(!g || e.pointerId !== g.id) return;
  const dx = e.clientX - g.x0, dy = e.clientY - g.y0;
  if(!g.moved && Math.abs(dx) < TL_SLOP && Math.abs(dy) < TL_SLOP) return;
  g.moved = true;
  if(g.mode === "maybe"){
    const scrollable = tlTrack.scrollHeight > tlTrack.clientHeight + 1;
    g.mode = (Math.abs(dy) > Math.abs(dx) && scrollable) ? "scroll" : (g.onLab ? "none" : "scrub");
    if(g.mode === "scrub") tlSetRunning(false);
  }
  if(g.mode === "scroll"){ tlTrack.scrollTop = g.scroll0 - dy; return; }
  if(g.mode === "scrub"){
    tlSeek(tlClampT(tlSnap((e.clientX - g.left) / g.w * tlLen, g.w)));
    return;
  }
  if(g.mode !== "key") return;
  /* A grabbed key follows the pointer along its line. Pulled far enough off
     it, above or below, it goes back to where it was and turns faint: let go
     there and it is deleted, come back and it is not. */
  g.doomed = Math.abs(dy) > TL_DOOM;
  const t = g.doomed ? g.t0 : tlClampT(tlSnap(g.t0 + dx / g.w * tlLen, g.w, g.q));
  g.q.t = t;
  tracks[g.k].sort(byT);
  tlRender();
  tlSeek(t);
});
function tlEndGesture(e, cancelled){
  const g = tlGesture;
  if(!g || e.pointerId !== g.id) return;
  tlGesture = null;
  dragCount = Math.max(0, dragCount - 1);
  try{ tlTrack.releasePointerCapture(e.pointerId); }catch(_){}
  if(g.onLab && g.moved) tlSwallowClick = true;     // that was a swipe, not a press
  if(g.mode === "maybe" && !g.moved && !g.onLab && !cancelled){
    // A touch that never moved: a tap on the line.
    tlSetRunning(false);
    tlSeek(tlClampT(tlSnap((g.x0 - g.left) / g.w * tlLen, g.w)));
  }
  if(g.mode === "key" && g.moved && tracks[g.k]){
    if(cancelled){                        // the system took the gesture: put it back
      g.q.t = g.t0;
      tracks[g.k].sort(byT);
      tlRender(); tlSeek(g.t0);
    } else if(g.doomed){
      tlRemoveKey(g.k, g.q);
    } else {
      // Dropped onto another key of the same knob: the one carried there wins.
      const ks = tracks[g.k];
      for(let i = ks.length - 1; i >= 0; i--)
        if(ks[i] !== g.q && Math.abs(ks[i].t - g.q.t) < TL_EPS) ks.splice(i, 1);
      tlRender(); tlApply();
    }
  }
  wake();
}
tlTrack.addEventListener("pointerup", e => tlEndGesture(e, false));
tlTrack.addEventListener("pointercancel", e => tlEndGesture(e, true));

/* The name selects its knob (and so points the timeline at it); the × clears
   that knob's keys. Delegated, because the lanes are rebuilt all the time. */
tlRows.addEventListener("click", e => {
  const lane = e.target.closest(".tl-lane");
  const k = lane && lane.dataset.k;
  if(!k) return;
  const btn = e.target.closest("button");
  if(btn && e.detail > 0) btn.blur();
  if(e.target.closest(".tl-del")){ tlClearKnob(k); return; }
  if(e.target.closest(".tl-lab")){
    if(tlSwallowClick){ tlSwallowClick = false; return; }
    select(TL_KEYABLE[k]);
  }
});

/* Right-click deletes the key under the pointer — a mouse shortcut for the
   drag-off. Some phones raise this same event for a long press, where it
   would delete a key for holding a finger still, so touch only has the drag. */
tlTrack.addEventListener("contextmenu", e => {
  e.preventDefault();
  if(tlLastPointer === "touch") return;
  const lane = e.target.closest(".tl-lane");
  const k = lane && lane.dataset.k;
  const g0 = tlGeom();
  const q = tlHitKey(k, e.clientX - g0.left, g0.w);
  if(q) tlRemoveKey(k, q);
});

/* Keyboard, with the list focused: arrows step a frame (a second with Shift),
   Home/End jump to the ends, Delete removes the glowing lane's key at the
   playhead. */
tlTrack.addEventListener("keydown", e => {
  if(e.target !== tlTrack) return;        // a name or a × has its own keys
  let t = null;
  const by = e.shiftKey ? TL_FPS : 1;
  if(e.key === "ArrowLeft" || e.key === "ArrowDown") t = tlTime - by;
  else if(e.key === "ArrowRight" || e.key === "ArrowUp") t = tlTime + by;
  else if(e.key === "Home") t = 0;
  else if(e.key === "End") t = tlLen;
  else if(e.key === "Delete"){
    e.preventDefault();
    const ks = tlHotK && tracks[tlHotK];
    const q = ks && ks.find(x => Math.abs(x.t - tlTime) < TL_EPS);
    if(q) tlRemoveKey(tlHotK, q);
    return;
  }
  else return;
  e.preventDefault();
  tlSetRunning(false);
  tlSeek(tlClampT(Math.round(t)));
});

/* A mouse resting on the panel holds the hud up (see wake). Touch fires
   enter/leave around every tap, so it would only ever flicker this. */
tlPanel.addEventListener("pointerenter", e => {
  if(e.pointerType === "touch") return;
  tlPointerIn = true; wake();
});
tlPanel.addEventListener("pointerleave", () => {
  if(!tlPointerIn) return;
  tlPointerIn = false; wake();
});

/* ---------- preset files ----------
   Markdown, so a preset reads as itself anywhere it is pasted or opened —
   a chat, a gist, a text editor — and a person can write or tweak one by
   hand. The TABLES are the data: import reads the rows, not a hidden blob
   beside them, so editing the table is editing the preset. A row is
   recognised by any cell naming a knob (its id or its label), its value is
   the last cell, and in the Keyframes section its frame is the first.
   Pickers are written by name ("mirror"), and read by name or number.
   Keyframes are grouped by lane, in lane order, so a round trip brings the
   lanes back in the order they were made. The first version of this wrote
   SECONDS ("3.25s", "length: 10s"); anything with an s on it still reads as
   seconds, so those files still load. */
const tlNum = v => String(parseFloat(v.toPrecision(7)));
function tlFmtV(c, v){
  if(c.def.t === "sel"){ const o = optionsOf(c); return o[v] !== undefined ? o[v] : String(v); }
  return tlNum(v);
}
function tlPresetText(){
  const L = [
    "# Fractal Crack preset",
    "",
    "A look and a keyframe timeline for [Fractal Crack](https://corruptioncorp.net/fractalcrack/).",
    "To load it, open the timeline (the square button, bottom left), press **Import** and choose this file.",
    "",
    "- length: " + tlLen + " frames (" + TL_FPS + " a second)",
    "",
    "## Knobs",
    "",
    "Where the look starts. A knob with keyframes follows them instead.",
    "",
    "| knob | id | value |",
    "| --- | --- | --- |"
  ];
  TL_ORDER.forEach(k => {
    const c = TL_KEYABLE[k];
    L.push("| " + c.def.label + " | " + k + " | " + tlFmtV(c, P[k]) + " |");
  });
  L.push("", "## Keyframes", "");
  const lanes = Object.keys(tracks);
  if(!lanes.length){
    L.push("None — this preset is just the look.");
  } else {
    L.push("One lane per knob, in the order below. Straight lines between keys; the two pickers hold until their next key. The timeline loops.",
           "",
           "| frame | knob | id | value |",
           "| --- | --- | --- | --- |");
    lanes.forEach(k => {
      const c = TL_KEYABLE[k];
      tracks[k].forEach(q => L.push("| " + tlNum(q.t) + " | " + c.def.label + " | " + k + " | " + tlFmtV(c, q.v) + " |"));
    });
  }
  return L.join("\n") + "\n";
}

const tlPlain = s => s.replace(/[`*]/g, "").trim().toLowerCase();
/* "300", "300f", "300 frames" are frames; "5s", "5 sec" are seconds. */
function tlParseFrames(s){
  const m = /^([\d.]+)\s*([a-z]*)/.exec(tlPlain(s));
  if(!m) return NaN;
  const n = parseFloat(m[1]);
  return m[2].charAt(0) === "s" ? n * TL_FPS : n;
}
function tlParseV(c, s){
  s = tlPlain(s);
  if(c.def.t === "sel"){
    const i = optionsOf(c).indexOf(s);
    if(i >= 0) return i;
  }
  const n = parseFloat(s);
  return isFinite(n) ? n : null;
}
function tlParse(text){
  const out = {len:0, knobs:{}, keys:[]};
  let section = "knobs";
  text.split(/\r?\n/).forEach(raw => {
    const line = raw.trim();
    const h = /^#{1,6}\s+(.*)$/.exec(line);
    if(h){
      const s = h[1].toLowerCase();
      if(s.indexOf("key") >= 0) section = "keys";
      else if(s.indexOf("knob") >= 0) section = "knobs";
      return;
    }
    const len = /^[-*]?\s*length\s*[:=]\s*(.+)$/i.exec(line);
    if(len){ out.len = tlParseFrames(len[1]); return; }
    if(line.charAt(0) !== "|") return;
    const cellsT = line.replace(/^\|/, "").replace(/\|$/, "").split("|");
    let k = null;
    for(const s of cellsT){ const m = TL_NAMES[tlPlain(s)]; if(m){ k = m; break; } }
    if(!k) return;                        // a header row, a divider, or not ours
    const v = tlParseV(TL_KEYABLE[k], cellsT[cellsT.length - 1]);
    if(v === null) return;
    if(section === "keys"){
      const t = tlParseFrames(cellsT[0]);
      if(isFinite(t) && t >= 0) out.keys.push({k, t, v});
    } else {
      out.knobs[k] = v;
    }
  });
  return out;
}
/* Returns how many keyframes it loaded, or null if nothing in the file was a
   knob it knows. */
function tlLoad(text){
  const d = tlParse(text);
  const named = Object.keys(d.knobs);
  if(!named.length && !d.keys.length) return null;
  /* A file with a Knobs table is a whole look: whatever it leaves out goes
     back to its default rather than keeping what happened to be on screen, so
     one file looks the same wherever it is opened. A file of keyframes alone
     (hand-written, say) leaves the rest of the knobs where they are. */
  if(named.length){
    TL_ORDER.forEach(k => { P[k] = tlCoerce(TL_KEYABLE[k], k in d.knobs ? d.knobs[k] : DEFAULTS[k]); });
  }
  tracks = {};                            // lanes in the order the file first names them
  d.keys.forEach(r => {
    const t = Math.min(TL_MAX_LEN, Math.round(r.t));
    const v = tlCoerce(TL_KEYABLE[r.k], r.v);
    const ks = tracks[r.k] || (tracks[r.k] = []);
    const at = ks.find(q => Math.abs(q.t - t) < TL_EPS);
    if(at) at.v = v; else ks.push({t, v});
  });
  for(const k in tracks) tracks[k].sort(byT);
  const want = d.len > 0 ? Math.round(d.len) : tlLen;
  tlSetLen(Math.max(TL_MIN_LEN, Math.min(TL_MAX_LEN, Math.max(want, Math.ceil(tlLastKey() - TL_EPS)))));
  refreshKnobs();
  scheduleAlloc();                       // Delay may have changed the ring's depth
  tlSyncClear();
  tlRestart();
  return d.keys.length;
}

function tlStamp(){
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes());
}
function tlDownload(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  tlNote("exported");
}
tlExport.addEventListener("click", e => {
  tlUnfocus(e);
  const name = "fractal-crack-" + tlStamp() + ".md";
  const blob = new Blob([tlPresetText()], {type:"text/markdown"});
  /* On a phone the share sheet is "save it" and "send it to someone" in one
     place, where a download tends to vanish into a folder nobody opens. It
     has to be called straight from the tap (it needs the gesture), and
     wherever it will not take the file — or on a desktop, where a download is
     the expected thing — the file downloads instead. */
  if(COARSE && navigator.share && navigator.canShare){
    let file = null;
    try{
      file = new File([blob], name, {type:"text/markdown"});
      if(!navigator.canShare({files:[file]})) file = null;
    }catch(_){ file = null; }
    if(file){
      navigator.share({files:[file], title:"Fractal Crack preset"}).then(
        () => tlNote("shared"),
        err => { if(!err || err.name !== "AbortError") tlDownload(blob, name); });
      return;
    }
  }
  tlDownload(blob, name);
});

tlImport.addEventListener("click", e => { tlUnfocus(e); tlFile.click(); });
tlFile.addEventListener("change", () => {
  const f = tlFile.files && tlFile.files[0];
  if(!f) return;
  if(f.size > 256 * 1024){ tlNote("too big to be a preset"); tlFile.value = ""; return; }
  // FileReader rather than file.text(), which older Safari does not have.
  const fr = new FileReader();
  fr.onload = () => {
    const n = tlLoad(String(fr.result || ""));
    tlNote(n === null ? "not a fractal crack preset"
                      : "imported · " + n + " keyframe" + (n === 1 ? "" : "s"));
  };
  fr.onerror = () => tlNote("couldn't read that file");
  fr.readAsText(f);
  tlFile.value = "";                     // so choosing the same file again still fires
});

/* The lines' width sets the ruler's spacing and the playhead's travel (and
   changes when a seventh lane brings the scrollbar in); the dock's height sets
   where the legend stacks. */
if(window.ResizeObserver){
  new ResizeObserver(() => { if(tlOpen) tlMeasure(); }).observe(tlHeadLayer);
  new ResizeObserver(() => tlSyncTop()).observe(tlDock);
  /* The list's window shrinks when the phone's knob sheet opens (six lanes
     down to three) — keep the knob in hand's lane in it. */
  let tlListH = -1;
  new ResizeObserver(() => {
    if(!tlOpen || tlTrack.clientHeight === tlListH) return;
    tlListH = tlTrack.clientHeight;
    if(tlActiveK) tlReveal(tlActiveK);
  }).observe(tlTrack);
}
window.addEventListener("resize", () => { if(tlOpen) tlMeasure(); tlSyncTop(); });
tlSizeLen();
tlSyncTop();

/* ---------- owner gate ----------
   The timeline editor is for the site's owners only. This app has no Firebase
   of its own, but it shares the site's ORIGIN, and Firebase Auth persists per
   origin — so whoever is signed in on corruptioncorp.net is signed in here.
   Auth is loaded on demand from Google's CDN (same SDK version and config as
   the site's src/firebase.js) AFTER the page is up, so visitors pay nothing
   on the critical path. The account's email is compared by SHA-256 against
   the same two digests src/accountData.js ships (keep them in step — see
   CLAUDE.md, "The owner accounts"); the address itself never appears here.
   UI gating only: there is nothing privileged behind it to protect. */
const TL_ADMIN_SHA256 = [
  "2ac91c1187b9c06118f5afd6f8505f531d921319ecd6b8ad77ad291b11cc9c09", // personal
  "244a23a8951288834e686a7ce38bf3ab3e372ffe448b408d681c074eeb855fc4"  // brand
];
const TL_FB = "https://www.gstatic.com/firebasejs/12.15.0/";
const TL_FB_CONFIG = {
  apiKey: "AIzaSyCt62QC8ktwAAIQ1hLVMz0F-_vHQU2Qi7o",
  authDomain: "gen-lang-client-0197721509.firebaseapp.com",
  projectId: "gen-lang-client-0197721509",
  appId: "1:159490676088:web:87afe27b355205f9aa648d"
};
/* Plain-JS SHA-256: crypto.subtle is ABSENT on plain http (the LAN dev
   origin), the same trap accountData.js documents. */
function tlSha256(str){
  const b = new TextEncoder().encode(str), K = [], H = [];
  const f = x => (x - Math.floor(x)) * 4294967296 | 0;
  for(let n = 2, c = 0; c < 64; n++){
    let p = true; for(let d = 2; d * d <= n; d++) if(n % d === 0){ p = false; break; }
    if(p){ if(c < 8) H[c] = f(Math.sqrt(n)); K[c++] = f(Math.cbrt(n)); }
  }
  const l = b.length, words = new Uint32Array(((l + 8 >> 6) + 1) * 16);
  for(let i = 0; i < l; i++) words[i >> 2] |= b[i] << (24 - (i & 3) * 8);
  words[l >> 2] |= 0x80 << (24 - (l & 3) * 8);
  words[words.length - 1] = l * 8;
  const r = (x, n) => x >>> n | x << (32 - n), w = new Array(64);
  for(let j = 0; j < words.length; j += 16){
    let [a, bb, c, d, e, g, h, k] = H;
    for(let i = 0; i < 64; i++){
      if(i < 16) w[i] = words[j + i];
      else { const x = w[i-15], y = w[i-2];
        w[i] = (w[i-16] + (r(x,7) ^ r(x,18) ^ x >>> 3) + w[i-7] + (r(y,17) ^ r(y,19) ^ y >>> 10)) | 0; }
      const t1 = (k + (r(e,6) ^ r(e,11) ^ r(e,25)) + (e & g ^ ~e & h) + K[i] + w[i]) | 0;
      const t2 = ((r(a,2) ^ r(a,13) ^ r(a,22)) + (a & bb ^ a & c ^ bb & c)) | 0;
      k = h; h = g; g = e; e = (d + t1) | 0; d = c; c = bb; bb = a; a = (t1 + t2) | 0;
    }
    H[0] += a; H[1] += bb; H[2] += c; H[3] += d; H[4] += e; H[5] += g; H[6] += h; H[7] += k;
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, "0")).join("");
}
function tlSetAdmin(on){
  if(hud.classList.contains("tl-admin") === on) return;
  hud.classList.toggle("tl-admin", on);
  if(!on && tlOpen) tlSetOpen(false);
  tlSyncTop();
}
async function tlCheckOwner(){
  try{
    const [{ initializeApp }, { getAuth, onAuthStateChanged }] = await Promise.all([
      import(TL_FB + "firebase-app.js"), import(TL_FB + "firebase-auth.js")]);
    const auth = getAuth(initializeApp(TL_FB_CONFIG));
    onAuthStateChanged(auth, u => {
      // An anonymous session (the graffiti wall's) is not an account.
      const email = u && !u.isAnonymous && u.email ? u.email.trim().toLowerCase() : "";
      tlSetAdmin(!!email && TL_ADMIN_SHA256.indexOf(tlSha256(email)) >= 0);
    });
  }catch(_){ /* offline or blocked: the editor simply stays hidden */ }
}
setTimeout(tlCheckOwner, 1500);

/* ------------------------------------------------------------------ */
/*  Double-click defences                                              */
/*                                                                     */
/*  The stylesheet already opts the hud out of selection; these cover   */
/*  what CSS cannot — a dblclick's own default action, which is what    */
/*  drags an <img> into a "selected" state on some engines, and any     */
/*  selection the browser starts anyway. Bubble phase, so a control's   */
/*  own dblclick handler (a knob's reset-to-default) still runs first.  */
/*  The legend's type-a-value box is the one piece of real text in      */
/*  here, so it is exempt from both.                                   */
/* ------------------------------------------------------------------ */
const notTypingIn = e => e.target !== lgValueInput && e.target.id !== "tlLen";
hud.addEventListener("dblclick", e => { if(notTypingIn(e)) e.preventDefault(); });
hud.addEventListener("selectstart", e => { if(notTypingIn(e)) e.preventDefault(); });

/* ------------------------------------------------------------------ */
/*  Keys & resize                                                      */
/* ------------------------------------------------------------------ */
window.addEventListener("keydown", e => {
  /* Checked before the focus guard below: photo mode has no visible control to
     put focus on, so it must answer wherever focus happens to be — the hud is
     invisible but its buttons are still tabbable. The one exception is the
     legend's value box, where Backspace is what deletes a digit.
     preventDefault also covers the browsers that still treat a bare Backspace
     as "go back". */
  if(photoMode && e.key === "Backspace" && e.target !== lgValueInput){
    e.preventDefault(); exitPhoto(); return;
  }
  if(e.target !== document.body) return;
  if(e.code === "Space"){ e.preventDefault(); setPlaying(!playing); }
  else if(e.key === "r" || e.key === "R") doAction("reset");
  else if(e.key === "Escape") select(null);
});

let allocTimer = null;
function scheduleAlloc(){ clearTimeout(allocTimer); allocTimer = setTimeout(allocate, 120); }
window.addEventListener("resize", scheduleAlloc);

/* ------------------------------------------------------------------ */
/*  Boot splash — same shape as the Corruption Corp site's own splash and    */
/*  Pinballa's take on it, but this one waits for EVERY asset rather than    */
/*  racing them against a cutoff. Pinballa's version drops its splash after  */
/*  SPLASH_MAX_WAIT whether or not the art is in, which on a slow connection */
/*  is exactly the pop-and-reflow the splash exists to hide; here the fade   */
/*  waits on all of it — every <img> in the document (splash logo, hud logo, */
/*  every console icon, knob base and pointer) plus CRENZO itself.           */
/*                                                                          */
/*  Two deliberate exceptions to "everything":                              */
/*  - Broken assets resolve rather than reject (error counts as settled), so */
/*    one 404 can't strand the boot.                                        */
/*  - It does NOT wait on document.fonts.ready, which settles only once     */
/*    EVERY requested font has — including any the page never renders in.   */
/*    (That used to be a Google-hosted IBM Plex Mono fallback, which is no   */
/*    longer requested at all; see the head. Waiting on the one face that    */
/*    IS used, by name, is what the fonts.load below does instead.)         */
/*                                                                          */
/*  The 8s timer in the inline script after <body> is the only ceiling left, */
/*  and it's a true last resort: a request that never settles at all.        */
/* ------------------------------------------------------------------ */
function hideSplashWhenDressed(){
  const splash = document.getElementById("fc-splash");
  if(!splash) return;

  const waits = [];
  for(const im of document.querySelectorAll("img[src]")){
    if(im.complete) continue;               // decoded already (or already failed)
    waits.push(new Promise(res => {
      im.addEventListener("load", res, {once:true});
      im.addEventListener("error", res, {once:true});
    }));
  }
  if(document.fonts) waits.push(document.fonts.load('1em CRENZO').catch(() => {}));

  Promise.all(waits).then(() => {
    // One painted frame with everything in place, so the fade reveals the
    // finished console instead of the frame it was assembled on. rAF is
    // dead in a background tab, so skip the wait there.
    const reveal = () => {
      splash.classList.add("splash-hide");
      setTimeout(() => splash.remove(), 800);
    };
    if(document.hidden) reveal();
    else requestAnimationFrame(() => requestAnimationFrame(reveal));
  });
}

/* ------------------------------------------------------------------ */
/*  Boot                                                               */
/* ------------------------------------------------------------------ */
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
allocate();
refreshKnobs();
setPlaying(!reduce);
requestAnimationFrame(frame);
hideSplashWhenDressed();

})();
