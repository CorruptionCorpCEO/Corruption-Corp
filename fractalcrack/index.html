<!--
  This is Fractal Crack's app copy, served directly at corruptioncorp.net/fractalcrack
  (see data/programs/FractalCrack/page.txt and data/site/README.txt). Its asset
  paths are root-absolute (/fractalcrack/assets/...) rather than relative,
  because the route it's served from (/fractalcrack, no trailing slash) would
  otherwise resolve a relative "assets/..." against the site ROOT, not this
  folder — same reason Pinballa's own build bases its assets at /pinball/.
  The standalone dev copy (originally D:\Claude\Fractal Crack) keeps plain
  relative paths, since it's served from its own root.
-->
<!doctype html>
<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fractal Crack</title>

     no seo:start/end markers here, unlike the site shell — so this head is
     the actual search result / share card. Mirrors Pinballa's own head. -->

<meta property="og:url" content="https://corruptioncorp.net/fractalcrack/" />

<!-- CRENZO is the only font this hud ever renders in, and it is ours and
     same-origin — so it is preloaded (a webfont is otherwise not discovered
     until the stylesheet has been parsed AND something needing it has been
     laid out) and nothing else is fetched at all.

     There used to be a Google-hosted IBM Plex Mono here as the fallback, which
     cost two cross-origin handshakes and a RENDER-BLOCKING stylesheet on every
     visit to pay for a face that only renders if CRENZO fails. The stack below
     falls back to the platform's own monospace instead, which costs nothing
     and is already on the machine. (The splash deliberately never waited on
     document.fonts.ready for the same reason — see hideSplashWhenDressed.) -->
<link rel="preload" href="/fractalcrack/assets/fonts/CRENZO.ttf" as="font" type="font/ttf" crossorigin>
<style>
@font-face{
  font-family:"CRENZO";
  src:url("/fractalcrack/assets/fonts/CRENZO.ttf") format("truetype");
  font-display:swap;
}
/* ---------- boot splash ----------
   Same functionality as the Corruption Corp site's own splash and Pinballa's
   take on it (logo + spinner, 0.7s fade) — on this app's own black chrome
   instead of the site's white, matching Fractal Crack's own background.
   Inline in the main stylesheet, before anything else, so it paints on the
   very first frame while the console art, the webfont and the first WebGL
   frame are still loading in; the script fades it out once all three are
   actually ready (see hideSplashWhenDressed), with the inline script right
   after <body> as a safety net if that never fires. */
#fc-splash{
  position:fixed; inset:0;
  z-index:5000;
  background:#000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(28px, 5vh, 56px);
  transition:opacity .7s ease;
}
#fc-splash.splash-hide{
  opacity:0;
  pointer-events:none;
}
#fc-splash img{
  width:min(60vw, 420px);
  max-height:40vh;
  object-fit:contain;
}
.fc-splash-loader{
  width:clamp(34px, 6vh, 52px);
  height:clamp(34px, 6vh, 52px);
  border-radius:50%;
  border:4px solid rgba(255,255,255,.12);
  border-top-color:rgba(255,255,255,.65);
  animation:fcSplashSpin .8s linear infinite;
}
@keyframes fcSplashSpin{
  to{ transform:rotate(360deg); }
}
:root{
  /* Desktop/landscape console sizing. --gap is derived, so it scales with the
     cells rather than needing its own bump. The portrait media query pins its
     own --cell on #knobPanel so the phone sheet keeps the size it was tuned
     at — this larger value is for the roomier layout only.
     The vh term matters: the console's tallest column is 7 cells (Signal),
     so its height is what runs out first. Sizing on vw alone looks right on
     a 16:9 monitor and overflows the bottom of a short, wide window. */
  --cell: clamp(46px, min(5.4vw, 8.4vh), 88px);
  --gap: calc(var(--cell) * 0.13);
  /* The console's own footprint, derived rather than measured so the legend
     can be pinned to exactly the same width and stacked directly on top of
     it (see the desktop placement block). 6 columns = Controls + the five
     knob groups; 7 rows = the tallest of those columns, Signal's header plus
     its six knobs. Keep both in step with GROUPS if a knob is ever added. */
  --console-w: calc(6 * var(--cell) + 5 * var(--gap));
  --console-h: calc(7 * var(--cell) + 6 * var(--gap));
  --hud-fade: .45s ease;
  /* The CC exit plate's own footprint, so the console can clear it by name
     rather than by a magic number that has to be re-derived every time the
     plate changes size. The numbers are Pinballa's: its mark renders at 61x37
     inside 8px/10px of padding and a 1px border, so this is the same control
     at the same visible size, in a box that isn't stretched by a neighbour. */
  --cc-exit-w: 83px;
  --cc-exit-h: 55px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%; overscroll-behavior:none}

/* ---------- double-click / long-press defences ----------
   Nothing in the hud is text, and every control is artwork. A double-click on
   one used to hand the browser a selection anyway: a highlight box flashing
   over the console art, and on some engines an <img> left "selected" until you
   clicked somewhere else. So the whole layer opts out of selection, images opt
   out of the drag ghost and the long-press save/copy callout, and the one
   thing that IS text — the legend's type-a-value box — opts back in. See also
   the dblclick/selectstart guards in the script. */
.hud,
.hud *{
  -webkit-user-select:none;
  user-select:none;
}
#legend .lg-value-edit{
  -webkit-user-select:text;
  user-select:text;
}
img{
  -webkit-user-drag:none;
  -webkit-touch-callout:none;
}
body{
  margin:0;
  background:#000;
  color:#e8ecf2;
  font-family:"CRENZO",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  overflow:hidden;
}

/* ---------- viewport ---------- */
#gl{
  position:fixed; inset:0;
  width:100%; height:100%;
  display:block;
  z-index:0;
  touch-action:none;       /* the app owns pan/zoom on the canvas, not the browser */
}

/* ---------- hud shell ---------- */
.hud{
  position:fixed; inset:0;
  z-index:10;
  pointer-events:none;
  opacity:1;
  transition:opacity var(--hud-fade);
}
.hud.idle{opacity:0}
.hud > *{pointer-events:auto}
/* faded out means gone — an invisible console must not eat canvas clicks */
.hud.idle, .hud.idle *{pointer-events:none}

/* ---------- top bar (logo + console) ---------- */
/* display:contents by default — this wrapper has no box of its own here, so
   #logo and #console position themselves exactly as if they were still
   direct children of .hud (which is what they were before this wrapper
   existed). Only the portrait media query below turns it into a real flex
   row, to vertically centre the two against each other. */
#topBar{ display:contents }

/* ---------- back to Corruption Corp ----------
   The same control Pinballa carries, in the same two-step shape: this app
   fills the tab, so following the link is a one-way trip out of it and an
   accidental press is expensive. The first press swaps the mark for EXIT?,
   the second navigates (see the script). A real <a href="/"> so it
   middle-clicks, long-presses and previews like any other link.

   Plate colours are Pinballa's — black line art on a light plate — which is
   also the only readable option here: cclogo.png is black, and this app's
   chrome is black.

   WHERE it sits: the console's own bottom-right corner, in the block of empty
   grid under the Seed and Display columns. Those two are five cells tall in a
   box that is seven (Signal is the long one), so there is always a 2x2 hole of
   cells there — 103px square at the smallest --cell this layout allows, which
   is room to spare for an 83x55 plate. Derived from --console-h/--gap rather
   than measured, for exactly the reason #legend is: no element can be
   positioned against another element's box in CSS, and these are the numbers
   the console is built from. Keep them in step with GROUPS.

   It is also LAST inside #topBar, and both it and #console are positioned with
   z-index auto — so DOM order is what paints it in front of the knob grid.
   Moving it earlier in the markup would put it behind. */
#ccExit{
  position:absolute;
  /* Base layout: the console hangs from top:16px, so the hole is that far down
     plus the console's height, less the plate's own. */
  top:calc(16px + var(--console-h) - var(--cc-exit-h));
  right:18px;
  width:var(--cc-exit-w); height:var(--cc-exit-h);
  display:flex; align-items:center; justify-content:center;
  padding:8px 10px;
  border:1px solid rgba(0,0,0,.45);
  border-radius:8px;
  background:#f2f2f2;
  color:#111;
  text-decoration:none;
  cursor:pointer;
  transition:background .15s ease, border-color .15s ease;
}
@media (hover:hover) and (pointer:fine){
  #ccExit:hover{ background:#fff; border-color:#000 }
}
#ccExit:focus-visible{outline:2px solid #fff; outline-offset:3px}
#ccExit img{
  /* cclogo.png is wide line art on transparent; 37px tall is what Pinballa
     draws it at, so cap the height and let the aspect give the width. */
  max-width:100%; max-height:37px;
  width:auto; height:auto;
  object-fit:contain;
  pointer-events:none;
}
/* Armed: the mark is replaced by the word IN THE SAME BOX, so the plate never
   changes size between the two states. */
#ccExit .cc-confirm{
  display:none;
  font-family:inherit;
  font-size:15px; font-weight:700; letter-spacing:.06em;
  color:inherit;
}
#ccExit.confirming img{display:none}
#ccExit.confirming .cc-confirm{display:block}

/* ---------- logo ---------- */
#logo{
  position:absolute; top:18px; left:20px;
  width:25vw;               /* one quarter of the viewport */
  min-width:120px;
  height:auto;
  user-select:none;
  -webkit-user-drag:none;
  filter:drop-shadow(0 3px 14px rgba(0,0,0,.75));
}

/* ---------- console ---------- */
#console{
  position:absolute; top:16px; right:18px;
  display:flex;
  gap:var(--gap);
  align-items:flex-start;
}
.col{
  display:flex; flex-direction:column;
  gap:var(--gap);
}
/* wraps every group EXCEPT controls (that's #controlsBar itself, a .col) —
   same flex row the columns sat in directly before this wrapper existed, so
   desktop/landscape looks identical; only the portrait media query below
   turns this into the slide-up knob sheet. */
#knobPanel{
  display:flex;
  gap:var(--gap);
}

.cell{
  position:relative;
  width:var(--cell); height:var(--cell);
  flex-shrink:0;            /* a circle must never get squeezed into an oval
                                by a flex row that's short on space — the
                                mobile controls/knob rows both scroll instead */
  display:block;
  border:0; padding:0; margin:0;
  background:transparent;
  cursor:pointer;
  border-radius:50%;
  filter:drop-shadow(0 2px 8px rgba(0,0,0,.65));
  touch-action:none;       /* a knob's own drag must not scroll an ancestor */
}
.cell.hdr{cursor:default}
.cell img{
  position:absolute; inset:0;
  width:100%; height:100%;
  pointer-events:none;
  -webkit-user-drag:none;
}
.cell .glyph{
  position:absolute;
  left:19%; top:19%; width:62%; height:62%;
  pointer-events:none;
}
.cell .hand{
  transform-origin:50% 50%;
  will-change:transform;
}
/* selection ring */
.cell::after{
  content:"";
  position:absolute; inset:-5%;
  border-radius:50%;
  border:2px solid #fff;
  opacity:0;
  transition:opacity .12s;
  pointer-events:none;
  box-shadow:0 0 10px rgba(255,255,255,.5);
}
.cell.sel::after{opacity:1}
.cell:focus-visible{outline:2px solid #fff; outline-offset:3px}

/* group recolouring — the sprites ship red, greys are untouched by hue-rotate */
.g-controls .tint{filter:grayscale(1) brightness(1.06)}
.g-camera   .tint{filter:hue-rotate(240deg)}
.g-signal   .tint{filter:hue-rotate(40deg)}
.g-feedback .tint{filter:none}
.g-seed     .tint{filter:hue-rotate(131deg)}
.g-display  .tint{filter:hue-rotate(282deg)}

/* ---------- legend ---------- */
#legend{
  position:absolute; left:22px; bottom:22px;
  min-width:210px; max-width:330px;
  background:#fff;
  border:1px solid var(--accent,#6b7280);
  border-left-width:3px;
  border-radius:8px;
  padding:11px 14px 12px;
  /* NO backdrop-filter. There was a blur(8px) here, behind an OPAQUE white
     fill — invisible by construction, but the compositor still has to resolve
     it, and its backdrop is a WebGL canvas that changes every single frame. So
     it was a full-screen blur recomputed 60 times a second, for nothing, the
     whole time the legend was on screen — which is exactly while you are
     turning a knob and watching the result. */
  opacity:0;
  transform:translateY(6px);
  transition:opacity .14s, transform .14s;
}
#legend.show{opacity:1; transform:translateY(0)}
#legend .lg-group{
  font-size:9.5px; letter-spacing:.24em; text-transform:uppercase;
  color:var(--accent,#9aa3af);
  margin-bottom:3px;
  padding-right:22px;
}
#legend .lg-title{
  font-size:14px; font-weight:600; color:#000; line-height:1.2;
  padding-right:22px;
}
#lgClose{
  position:absolute; top:7px; right:8px;
  width:20px; height:20px;
  display:grid; place-items:center;
  padding:0; border-radius:5px;
  border:1px solid rgba(0,0,0,.14);
  background:transparent;
  color:#6b7280;
  font-family:inherit; font-size:14px; line-height:1;
  cursor:pointer;
  transition:color .12s, border-color .12s, background .12s;
}
@media (hover:hover) and (pointer:fine){
  #lgClose:hover{
    color:#000;
    border-color:var(--accent,#000);
    background:rgba(0,0,0,.06);
  }
}
#lgClose[hidden]{display:none}
#legend .lg-value{
  margin-top:7px;
  font-size:21px; font-weight:500;
  color:var(--accent,#000);
  font-variant-numeric:tabular-nums;
}
#legend .lg-value.editable{
  cursor:pointer;
  border-bottom:1px dashed var(--accent,#000);
  width:fit-content;
}
#legend .lg-value-edit{
  display:block;
  margin:7px 0 0;
  width:100%;
  font-family:inherit;
  font-size:21px; font-weight:500;
  color:var(--accent,#000);
  font-variant-numeric:tabular-nums;
  background:rgba(0,0,0,.05);
  border:0; border-bottom:1px solid var(--accent,#000);
  border-radius:2px;
  padding:0 2px;
  outline:none;
}
#legend .lg-opts{
  margin-top:8px; display:flex; flex-wrap:wrap; gap:4px;
}
/* Unselected/selected read against #legend's WHITE fill (see above) — the
   selected pill fills with the group's own accent colour rather than white,
   so its label (kept white-on-accent) is never white-on-white. */
#legend .lg-opts button{
  font-family:inherit;
  font-size:10px; letter-spacing:.05em; text-transform:uppercase;
  padding:4px 8px; border-radius:4px;
  border:1px solid rgba(0,0,0,.18);
  background:transparent;
  color:#4a5160;
  cursor:pointer;
  transition:border-color .12s, color .12s, background .12s;
}
@media (hover:hover) and (pointer:fine){
  #legend .lg-opts button:hover{
    border-color:var(--accent,#000);
    color:#1a1d24;
  }
}
#legend .lg-opts button.on{
  border-color:var(--accent,#333);
  color:#fff;
  background:var(--accent,#333);
}
#legend .lg-lock{
  margin-top:8px; font-size:9.5px; letter-spacing:.16em;
  text-transform:uppercase; color:#6f7683;
}

.nogl{
  position:fixed; inset:0; display:grid; place-items:center;
  padding:40px; text-align:center; color:#8b93a1; z-index:20;
}

/* ---------- photo mode prompt ----------
   Deliberately a SIBLING of .hud, not a child: photo mode's whole job is to
   take the hud away, and .hud.idle also kills pointer-events on everything
   inside it. It shows for a second on entering and fades out; the hud does not
   come back until Escape (see enterPhoto/exitPhoto). Never interactive — the
   only way out is the key. */
#photoHint{
  position:fixed; top:5.5vh; left:50%;
  transform:translateX(-50%);
  z-index:11;
  padding:0 16px;
  max-width:100vw;
  font-size:13px; letter-spacing:.18em; text-transform:uppercase;
  color:#8b909a;
  text-shadow:0 2px 12px rgba(0,0,0,.85);
  white-space:nowrap;
  pointer-events:none;
  opacity:0;
  transition:opacity .55s ease;
}
#photoHint.show{
  opacity:1;
  transition:opacity .16s ease;
}

/* ---------- touch hit pads ----------
   The drawn control is a circle of --cell with about --gap of nothing between
   it and its neighbour, and border-radius clips hit testing as well as paint —
   so on a phone a tap in the space between two knobs, or on a knob's own
   clipped corner, landed on the row and did nothing at all. Every cell grows
   an invisible SQUARE pad that overlaps its neighbours', leaving no dead space
   in a row; hit testing counts a pseudo-element as part of the element that
   owns it, so the button's own box, its artwork and the selection ring are all
   untouched. Mouse pointers keep the exact circle they can see.

   --hit is also what the portrait sheet pads its rows by, so the pads are not
   clipped away by those rows' own overflow — keep the two in step. */
@media (pointer:coarse){
  .cell{ --hit:7px }
  .cell::before{
    content:"";
    position:absolute;
    inset:calc(var(--hit) * -1);
    border-radius:8px;
  }
}

/* ---------- desktop placement ----------
   Console in the bottom-right corner with the legend stacked directly above
   it, both pinned to the same --console-w so they read as one panel. The
   legend's `bottom` clears the console's own height rather than measuring
   it, which is why --console-h exists.

   The min-height is not decoration: this stacks two boxes that used to live
   in opposite corners into one, so it needs roughly 500px of headroom. A
   landscape PHONE matches (orientation:landscape) but has nowhere near that
   — it keeps the base corner layout instead, which is also what "when
   horizontal, maintain the current hud" asked for. Below this block's
   threshold nothing overrides the base rules, so that fallback is automatic. */
@media (min-width:901px) and (min-height:640px){
  #console{
    top:auto; bottom:18px;
    width:var(--console-w);
    /* still flex-start: the top row (play + the five group headers) is a
       meaningful row of its own, and bottom-aligning would break it up. */
  }
  /* The console is bottom-anchored here, so its empty corner is simply the
     screen's — same 18px inset, no derivation needed. */
  #ccExit{
    top:auto; bottom:18px; right:18px;
  }
  #legend{
    left:auto; right:18px;
    bottom:calc(18px + var(--console-h) + var(--gap));
    width:var(--console-w);
    min-width:0;
    max-width:none;
  }
}

/* ---------- mobile portrait ----------
   Landscape (including landscape phones/tablets) is untouched — everything
   below is scoped to portrait so "when horizontal, maintain the current hud"
   holds exactly. Layout, not behaviour: the same GROUPS/cells/knobs render
   here, just reflowed — Controls (play/reset/inject/random/upload) stays a
   permanent top-right strip, and Camera/Signal/Feedback/Seed/Display move
   into a slide-up sheet toggled by tapping the logo, so the fractal itself
   keeps most of a narrow screen by default. */
@media (max-width:900px) and (orientation:portrait){
  /* #topBar becomes a real flex row here (it's display:contents everywhere
     else — see the base rule) spanning the same left:20px/right:18px inset
     the two used to carry independently, so logo and console still start
     and end in the same places. align-items:center is the actual point of
     this: #logo and #console are wildly different heights (the logo scales
     with its own aspect ratio; the controls block is just its own two rows
     of icons), so lining up their TOPS the way independent absolute
     positioning did left them visually unbalanced. Centering them against
     each other reads as one coherent row instead. */
  #topBar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    position:absolute;
    top:16px; left:20px; right:18px;
  }
  /* The exit plate joins the row as a flex item instead of positioning itself.
     It is LAST in the markup, so that puts it at the right-hand end — the same
     corner it takes on every other viewport — and it keeps its full size,
     because the whole point is that it reads as the same button Pinballa has.
     The logo is what gives up width when three boxes won't fit (below). */
  #ccExit{
    position:static;
    flex:0 0 auto;
  }
  /* Both boxes are "half the screen width" — #logo trimmed by half a 12px
     gap so it doesn't butt straight up against #console once both are
     flex items sharing #topBar's width instead of independently inset. */
  #logo{
    position:static;
    /* Roughly half the screen, but SHRINKABLE — the controls block is a fixed
       number of cells and the exit plate is a fixed size, so the logo is the
       only one of the three that can give, and on a 320px phone it has to. */
    flex:0 1 auto;
    width:calc(50vw - 56px);
    min-width:0;
    cursor:pointer;
  }
  #console{ flex:0 0 auto }
  /* No forced width here any more — #controlsBar is only 3 cells wide now
     (see below), so #console just shrink-wraps around it; #topBar's
     justify-content:space-between keeps it flush against the right edge
     instead of the right:18px it used to carry on its own. */
  #console{
    position:static;
  }
  /* Controls: two rows instead of a scrolling strip — 3 across the top,
     Play + Reset on their own row underneath, both rows flush right. The
     width is sized for exactly 3 cells (a 4th would still fit the half-
     screen box from #logo, which would wrap it 4-and-1 instead); nth-child
     reorders Play/Reset after Inject/Random/Upload without touching the
     DOM, which is what the desktop column still reads top-to-bottom. */
  #controlsBar{
    --cell: 36px;
    background:transparent;
    flex-direction:row;
    flex-wrap:wrap;
    justify-content:flex-end;
    width:calc(3 * var(--cell) + 2 * var(--gap) + 4px);
  }
  #controlsBar .cell:nth-child(1){ order:4 }   /* play  -> row 2 */
  #controlsBar .cell:nth-child(2){ order:5 }   /* reset -> row 2 */
  #controlsBar .cell:nth-child(3){ order:1 }   /* inject */
  #controlsBar .cell:nth-child(4){ order:2 }   /* random */
  #controlsBar .cell:nth-child(5){ order:3 }   /* upload */
  /* Knobs: a bottom sheet, fixed to the viewport regardless of where it sits
     in the DOM (no ancestor here has a transform, so position:fixed anchors
     to the real viewport). Hidden below the fold by default; .knobs-open
     (toggled by the logo, see the script) slides it up "in front of" the
     bottom of the canvas rather than pushing anything. */
  #knobPanel{
    /* Pinned to what the sheet was tuned at — :root's --cell is the bigger
       desktop/landscape size and would blow the rows out on a phone. */
    --cell: 42px;
    position:fixed; left:0; right:0; bottom:0; top:auto;
    flex-direction:column;
    align-items:stretch;
    /* No gap: each row carries --hit of vertical padding instead (below), so
       adjacent rows' hit pads meet exactly and nothing between them is dead.
       Row pitch is unchanged — the 14px that was here moved into the rows. */
    gap:0;
    margin:0;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    max-height:62vh;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    touch-action:pan-y;
    background:#fff;
    border-top-left-radius:16px;
    border-top-right-radius:16px;
    box-shadow:0 -8px 28px rgba(0,0,0,.55);
    transform:translateY(105%);
    transition:transform .3s ease;
    z-index:6;
  }
  .hud.knobs-open #knobPanel{ transform:translateY(0) }
  /* Each group becomes its own horizontally-scrollable row: header icon
     first (unchanged from desktop), its knobs trailing after it. */
  #knobPanel .col{
    flex-direction:row;
    align-items:center;
    width:100%;
    overflow-x:auto;
    overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    touch-action:pan-x;
    /* A scroll container clips at its PADDING box, so without this the hit
       pads above/below each cell would be clipped straight back off. Keep in
       step with --hit. */
    padding:7px 0;
  }
  /* .cell::after / :focus-visible are a WHITE ring — right everywhere else
     (dark canvas showing through), invisible against #knobPanel's white
     fill. Cells living in the sheet get a dark ring instead; #controlsBar's
     cells still sit over the canvas, so they're untouched. */
  #knobPanel .cell::after{
    border-color:#000;
    box-shadow:0 0 8px rgba(0,0,0,.35);
  }
  #knobPanel .cell:focus-visible{ outline-color:#000 }
  /* Legend stays vertically centred in the viewport at all times in portrait
     — sheet open or closed — rather than pinned to its usual bottom-left
     corner, so it's never reading a value through, or hidden under, the
     sheet. z-index puts it above #knobPanel (6) for the case where centred
     lands inside the sheet's own area while open. Width is clamped so it
     can't run off a narrow screen the way a fixed 330px max-width can on a
     small phone. */
  #legend{
    top:50%; bottom:auto; right:22px;
    max-width:min(330px, calc(100vw - 44px));
    z-index:7;
    transition:opacity .14s, transform .14s;
    transform:translateY(calc(-50% + 6px));
  }
  #legend.show{ transform:translateY(-50%) }
}

@media (prefers-reduced-motion:reduce){
  .hud,#legend,.cell::after,#fc-splash,#photoHint,#ccExit{transition:none}
  .fc-splash-loader{animation:none}
}
@media (prefers-reduced-motion:reduce) and (max-width:900px) and (orientation:portrait){
  #knobPanel{transition:none}
}
</style>

<script>
(function(){
"use strict";

const cvs = document.getElementById("gl");
/* Context attributes are a real part of the frame budget here, not boilerplate:
   - powerPreference: on a laptop with two GPUs the browser picks the INTEGRATED
     one unless asked otherwise, and this is a full-screen fragment-bound toy —
     that choice alone is the difference between 60 fps and half of it.
   - alpha:false — the canvas is opaque (every shader writes a=1). Without this
     the compositor blends the whole thing over the page on every frame.
   - depth/stencil: never used. They are per-pixel attachments on the default
     framebuffer; not asking for them saves the memory and the bandwidth. */
const gl = cvs.getContext("webgl2", {
  antialias:false,
  preserveDrawingBuffer:false,
  alpha:false,
  depth:false,
  stencil:false,
  powerPreference:"high-performance"
});
if(!gl){
  document.body.insertAdjacentHTML("beforeend",
    '<div class="nogl">This needs WebGL2, which this browser did not provide.</div>');
  // Nothing below this line runs, so hideSplashWhenDressed() never gets
  // defined — drop the splash right here instead of leaving it to the 8s
  // safety net, which would sit on top of the message above for no reason.
  const splash = document.getElementById("fc-splash");
  if(splash) splash.classList.add("splash-hide");
  return;
}

/* ------------------------------------------------------------------ */
/*  Parameters                                                          */
/* ------------------------------------------------------------------ */
/* Defaults are the instrument at rest: every optional effect sits at zero, and
   only the knobs the feedback loop cannot run without carry a working value.
   Those three exceptions are zoom (at 1.000 nothing recurses, so there is no
   fractal at all), gain (an analog loop needs sub-unity gain or the sharpener
   runs it up to white), and the seed (with nothing injected the loop starves
   and fades to black). */
const P = {
  // camera — zoom drives the recursion; the rest are offsets, off at 0
  zoom:1.012, rot:0, panX:0, panY:0, warp:0,
  // signal — trims rest at neutral (1.000 / 0), gain and sharpness excepted
  bright:0, contrast:1.0, sat:1.0, hue:0, decay:0.9985, sharp:0.35,
  // feedback — all character, none of it on until asked for
  bleed:0, delayFrames:0, delayMix:0, edge:3,
  kaleido:0, mirrorX:0, invert:0,
  // seed — shape/amount/size keep the loop alive; drift is an effect, off
  seedShape:2, seedAmt:0.25, seedSize:0.045, seedDrift:0,
  // display — post effects off; iters and res are quality, not effects
  bloom:0, scan:0, iters:1, res:0.70
};
const DEFAULTS = Object.assign({}, P);
const EDGES  = ["mirror","wrap","clamp","black"];
const SHAPES = ["none","dot","ring","bar","noise"];
const CUSTOM_INDEX = 5;

/* One place decides "this is a touch device". Read once: a pointer does not
   become fine because the window was resized, and the two things that key off
   it — the render target's memory budget and which way out of photo mode is
   advertised — are both chosen once. Anything that must follow the live
   viewport is a media query instead (the knob sheet, the hit pads). */
const COARSE = window.matchMedia("(pointer: coarse)").matches;

/* ------------------------------------------------------------------ */
/*  Shaders                                                            */
/* ------------------------------------------------------------------ */
const VERT = `#version 300 es
in vec2 a; out vec2 v;
void main(){ v = a*0.5+0.5; gl_Position = vec4(a,0.0,1.0); }`;

const COMMON = `
vec2 mirrorRepeat(vec2 p){
  p = mod(p, 2.0);
  p = mix(p, 2.0 - p, step(1.0, p));
  return p;
}
float hash(vec2 p){
  p = fract(p*vec2(123.34,456.21));
  p += dot(p, p+45.32);
  return fract(p.x*p.y);
}
vec3 hueRotate(vec3 c, float a){
  const mat3 toYIQ = mat3(0.299,0.596,0.211, 0.587,-0.274,-0.523, 0.114,-0.322,0.312);
  const mat3 toRGB = mat3(1.0,1.0,1.0, 0.956,-0.272,-1.106, 0.621,-0.647,1.703);
  vec3 yiq = toYIQ*c;
  float cs=cos(a), sn=sin(a);
  yiq.yz = mat2(cs,-sn,sn,cs)*yiq.yz;
  return toRGB*yiq;
}`;

const FRAG_SEED = `#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform float uTime; uniform float uAspect;
${COMMON}
void main(){
  vec2 p = v - 0.5; p.x *= uAspect;
  float r = length(p);
  vec3 c = 0.5 + 0.5*cos(vec3(0.0,2.1,4.2) + r*11.0 - uTime*0.6);
  c *= smoothstep(0.62, 0.0, r);
  c += 0.04*hash(v*57.0 + uTime);
  o = vec4(c, 1.0);
}`;

const FRAG_FEEDBACK = `#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform sampler2D uPrev, uDelay, uCustom;
uniform vec2 uCenter, uPx;
uniform float uTime, uAspect;
uniform float uZoom, uRot, uWarp;
uniform vec2 uPan;
uniform float uBright, uContrast, uSat, uHue, uGain, uSharp;
uniform float uBleed, uDelayMix;
uniform int uEdge, uKaleido, uMirrorX, uInvert;
uniform int uSeedShape, uHasCustom;
uniform float uSeedAmt, uSeedSize;
uniform vec2 uSeedPos;
${COMMON}
vec2 fold(vec2 p){
  if(uEdge==0) return mirrorRepeat(p);
  if(uEdge==1) return fract(p);
  if(uEdge==2) return clamp(p, 0.0, 1.0);
  return p;
}
vec3 samp(sampler2D t, vec2 p){
  if(uEdge==3 && (p.x<0.0||p.x>1.0||p.y<0.0||p.y>1.0)) return vec3(0.0);
  return texture(t, fold(p)).rgb;
}
/* analog gear compresses as it approaches white instead of clipping flat */
vec3 softClip(vec3 x){
  const float k = 0.72;
  vec3 over = k + (1.0-k)*tanh(max(x-k, 0.0)/(1.0-k));
  return clamp(mix(x, over, step(k, x)), 0.0, 1.0);
}
void main(){
  vec2 p = v - uCenter;
  p.x *= uAspect;

  /* Rotational repeat only — no mirror fold. Mirroring with
     abs(ang - seg*0.5) is not idempotent: anything already inside the wedge
     comes back as seg*0.5 - ang, so re-applying it every pass flips the frame
     between two mirrored states and flickers at half the frame rate.
     mod() on its own is idempotent, so the loop settles. */
  if(uKaleido > 0){
    float ang = atan(p.y, p.x);
    float rad = length(p);
    float seg = 6.2831853 / float(uKaleido);
    ang = mod(ang, seg);
    p = vec2(cos(ang), sin(ang)) * rad;
  }
  if(uMirrorX == 1) p.x = abs(p.x);

  float c = cos(uRot), s = sin(uRot);
  p = mat2(c,-s,s,c) * p;

  float r2 = dot(p,p);
  p *= 1.0 + uWarp*r2;

  p /= uZoom;
  p.x /= uAspect;
  p += uCenter + uPan;

  /* Chroma bleed samples the three channels at three different offsets — but
     at bleed 0 (the default, and most of the time) those are the same point,
     so this was paying for three dependent texture fetches to fetch one thing.
     uBleed is a uniform, so the branch is the same for every pixel in the draw
     and costs nothing to take. */
  vec3 col;
  if(uBleed > 0.00002){
    vec2 dir = p - (uCenter + uPan);
    col.r = samp(uPrev, p + dir*uBleed).r;
    col.g = samp(uPrev, p).g;
    col.b = samp(uPrev, p - dir*uBleed).b;
  } else {
    col = samp(uPrev, p);
  }

  /* the screen's sharpness control: an unsharp mask, re-applied every loop.
     This is what keeps regenerating fine detail instead of blurring away. */
  if(uSharp > 0.001){
    vec3 blur = samp(uPrev, p + vec2(uPx.x,0.0)*2.5)
              + samp(uPrev, p - vec2(uPx.x,0.0)*2.5)
              + samp(uPrev, p + vec2(0.0,uPx.y)*2.5)
              + samp(uPrev, p - vec2(0.0,uPx.y)*2.5);
    /* limit the boosted detail, or it compounds into a full-scale checkerboard */
    vec3 hf = tanh((col - blur*0.25) * 6.0) / 6.0;
    col += hf * uSharp * 0.9;
  }

  /* Video delay line. Crossfade with the older frame — a screen blend here
     would add energy on every pass and run the whole loop up to white. */
  if(uDelayMix > 0.0001){
    col = mix(col, samp(uDelay, v), uDelayMix);
  }

  col *= uGain;
  col = (col - 0.5) * uContrast + 0.5 + uBright;
  float l = dot(col, vec3(0.299,0.587,0.114));
  col = mix(vec3(l), col, uSat);
  col = hueRotate(col, uHue);
  if(uInvert == 1) col = 1.0 - col;

  if(uSeedShape > 0 && uSeedAmt > 0.0001){
    vec2 sp = v - uSeedPos; sp.x *= uAspect;
    float sz = max(uSeedSize, 0.002);
    float m = 0.0;
    vec3 sc = 0.5 + 0.5*cos(uTime*vec3(1.0,1.3,1.7) + vec3(0.0,2.1,4.2));
    if(uSeedShape == 1) m = smoothstep(sz, 0.0, length(sp));
    else if(uSeedShape == 2){ float d = abs(length(sp) - sz*2.0); m = smoothstep(sz*0.25, 0.0, d); }
    else if(uSeedShape == 3) m = smoothstep(sz, 0.0, abs(sp.y)) * step(abs(sp.x), sz*5.0);
    else if(uSeedShape == 4) m = step(0.985, hash(floor(v*260.0) + floor(uTime*20.0)));
    else if(uSeedShape == 5 && uHasCustom == 1){
      /* uploaded png, mapped into a box of the seed size */
      vec2 q = sp/(sz*5.0)*0.5 + 0.5;
      if(q.x >= 0.0 && q.x <= 1.0 && q.y >= 0.0 && q.y <= 1.0){
        vec4 tx = texture(uCustom, vec2(q.x, 1.0 - q.y));
        m = tx.a;
        sc = tx.rgb;
      }
    }
    /* Crossfade rather than add: an added seed would drive the loop to
       seedAmt/(1-gain) and pin the frame at white. */
    col = mix(col, sc, clamp(m * uSeedAmt, 0.0, 1.0));
  }

  o = vec4(softClip(max(col, 0.0)), 1.0);
}`;

/* Straight passthrough, used only when the ring is rebuilt: it carries the
   picture from the old buffers into the new ones (scaled by the sampler's own
   LINEAR filter) so that resizing the window, moving Resolution or Delay, or
   the adaptive quality below does not throw the frame away and start again
   from noise. */
const FRAG_COPY = `#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform sampler2D uTex;
void main(){ o = vec4(texture(uTex, v).rgb, 1.0); }`;

const FRAG_DISPLAY = `#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform sampler2D uTex;
uniform vec2 uPx;
uniform float uBloom, uScan, uLines;
void main(){
  vec3 c = texture(uTex, v).rgb;
  if(uBloom > 0.001){
    vec3 b = vec3(0.0);
    b += texture(uTex, v + vec2( 1.5, 0.0)*uPx).rgb;
    b += texture(uTex, v + vec2(-1.5, 0.0)*uPx).rgb;
    b += texture(uTex, v + vec2( 0.0, 1.5)*uPx).rgb;
    b += texture(uTex, v + vec2( 0.0,-1.5)*uPx).rgb;
    b += texture(uTex, v + vec2( 1.2, 1.2)*uPx).rgb;
    b += texture(uTex, v + vec2(-1.2, 1.2)*uPx).rgb;
    b += texture(uTex, v + vec2( 1.2,-1.2)*uPx).rgb;
    b += texture(uTex, v + vec2(-1.2,-1.2)*uPx).rgb;
    vec3 hi = max(b/8.0 - 0.45, 0.0);
    c += hi * uBloom * 1.7;
  }
  float sl = 0.5 + 0.5*sin(v.y * uLines * 3.14159265);
  c *= mix(1.0, 0.82 + 0.18*sl, uScan);
  float vg = smoothstep(1.15, 0.35, length(v - 0.5));
  c *= mix(1.0, vg, 0.45);
  c = pow(max(c, 0.0), vec3(0.92));
  o = vec4(c, 1.0);
}`;

/* ------------------------------------------------------------------ */
/*  GL helpers                                                         */
/* ------------------------------------------------------------------ */
function compile(type, src){
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if(!gl.getShaderParameter(sh, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(sh));
  return sh;
}
function program(fsrc){
  const pr = gl.createProgram();
  gl.attachShader(pr, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(pr, compile(gl.FRAGMENT_SHADER, fsrc));
  gl.bindAttribLocation(pr, 0, "a");
  gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr, gl.LINK_STATUS))
    throw new Error(gl.getProgramInfoLog(pr));
  return pr;
}

const progSeed = program(FRAG_SEED);
const progFb   = program(FRAG_FEEDBACK);
const progDisp = program(FRAG_DISPLAY);
const progCopy = program(FRAG_COPY);

const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

function uni(pr, name){ return gl.getUniformLocation(pr, name); }
const U = {
  seed:{ time:uni(progSeed,"uTime"), aspect:uni(progSeed,"uAspect") },
  fb:{},
  disp:{ tex:uni(progDisp,"uTex"), px:uni(progDisp,"uPx"), bloom:uni(progDisp,"uBloom"), scan:uni(progDisp,"uScan"), lines:uni(progDisp,"uLines") },
  copy:{ tex:uni(progCopy,"uTex") }
};
["uPrev","uDelay","uCustom","uCenter","uPx","uTime","uAspect","uZoom","uRot","uWarp","uPan",
 "uBright","uContrast","uSat","uHue","uGain","uSharp","uBleed","uDelayMix","uEdge","uKaleido",
 "uMirrorX","uInvert","uSeedShape","uHasCustom","uSeedAmt","uSeedSize","uSeedPos"]
  .forEach(n => U.fb[n] = uni(progFb, n));

/* ---------- ring of framebuffers (ping-pong + delay history) ---------- */
/* RING_MAX is what the Delay knob's ceiling needs: fourteen frames of history
   plus the one being read and the one being written. The ring is only ever
   allocated as deep as the CURRENT delay setting needs, though — every slot is
   a full render target, so sixteen of them at 1280 is ~47 MB of GPU memory,
   while at rest (delay off, which is the default) two of them is ~6 MB. On a
   phone that difference is the difference between running and having the
   driver evict something mid-frame. */
const RING_MAX = 16;
let ring = [];
let W = 0, H = 0, head = 0;
function ringNeed(){ return Math.max(2, Math.min(RING_MAX, (P.delayFrames|0) + 2)); }

/* Stand-in for the custom-shape sampler while nothing has been uploaded.
   It must not be a ring texture: sampling the framebuffer we are drawing
   into is a feedback loop, and that draw comes back as garbage. */
const emptyTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, emptyTex);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE,
              new Uint8Array([0,0,0,0]));
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

function makeTarget(w, h){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  return {tex, fbo};
}

/* Straight blit of one ring texture into another, at whatever size the
   destination is — the sampler's own LINEAR filter does the scaling. */
function copyInto(dst, srcTex, w, h){
  gl.useProgram(progCopy);
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fbo);
  gl.viewport(0, 0, w, h);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, srcTex);
  gl.uniform1i(U.copy.tex, 0);
  drawQuad();
}

/* ------------------------------------------------------------------ */
/*  Adaptive quality                                                   */
/*                                                                     */
/*  The feedback loop is pinned to 60 Hz, so "smooth" means one step    */
/*  landing per display frame. A device that cannot manage that at full */
/*  resolution has only two ways to fail — fall behind wall clock, or   */
/*  stutter — and neither is acceptable, so it takes the third: ask the */
/*  GPU for fewer pixels until it keeps up, and hand them back once     */
/*  there is headroom again. The picture survives the change (see       */
/*  allocate below), so this is invisible apart from the softening.     */
/*                                                                     */
/*  It is a MULTIPLIER on the Resolution knob, not a replacement for    */
/*  it: turning that knob is the user saying what they want, so doing   */
/*  so resets this back to full and lets it re-measure from there.      */
/* ------------------------------------------------------------------ */
const QUALITY = [1, 0.85, 0.72, 0.6, 0.5];
let qi = 0;                        // index into QUALITY; 0 is "all of it"
const SAMPLE_FRAMES = 60;          // one measurement window, about a second
const SLOW_MS = 20;                // worse than ~50 fps: not keeping up
const FAST_MS = 17.2;              // better than ~58 fps: room to give back
const RECOVER_WINDOWS = 8;         // ...sustained this long before giving it
const SETTLE_MS = 1500;            // a rebuild is itself a hitch; don't read it
const STALL_MS = 100;              // longer than this is a stall, not a frame
let samples = 0, sampleSum = 0, goodWindows = 0;
let lastDownAvg = 0;
let adaptOff = false;
let settleUntil = 0;

function resetAdaptive(){
  qi = 0; samples = 0; sampleSum = 0; goodWindows = 0;
  lastDownAvg = 0; adaptOff = false;
}

function tune(avg){
  if(avg > SLOW_MS && qi < QUALITY.length - 1){
    /* Did the last reduction actually buy anything? If it did not, this is not
       a GPU short of time — it is a display that simply does not run at 60 Hz
       (a 50 Hz panel, a power-saving mode, a throttled background window).
       Fewer pixels cannot fix that, so put them back and stop trying, rather
       than grinding all the way down to the floor for nothing. */
    if(lastDownAvg && avg > lastDownAvg * 0.95){
      qi = Math.max(0, qi - 1);
      adaptOff = true;
      allocate();
      return;
    }
    lastDownAvg = avg;
    qi++;
    goodWindows = 0;
    allocate();
  } else if(avg < FAST_MS){
    lastDownAvg = 0;
    if(qi > 0 && ++goodWindows >= RECOVER_WINDOWS){
      goodWindows = 0;
      qi--;
      allocate();
    }
  } else {
    goodWindows = 0;                // in the dead band: leave it where it is
  }
}

function allocate(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const scale = P.res * QUALITY[qi];
  let w = Math.max(2, Math.round(window.innerWidth  * dpr * scale));
  let h = Math.max(2, Math.round(window.innerHeight * dpr * scale));
  /* A phone cannot show 1280 of anything and is holding the browser and the
     rest of the page in the same GPU budget, so a coarse pointer caps lower. */
  const cap = COARSE ? 960 : 1280;
  const m = Math.max(w, h);
  if(m > cap){ w = Math.max(2, Math.round(w * cap/m)); h = Math.max(2, Math.round(h * cap/m)); }
  const n = ringNeed();
  if(w === W && h === H && n === ring.length) return;

  const old = ring, oldN = old.length, oldHead = head;
  const next = [];
  for(let i = 0; i < n; i++) next.push(makeTarget(w, h));
  /* Drop every binding before drawing into the new targets — and before the
     old ones are deleted out from under a live one. */
  for(let u = 0; u < 3; u++){
    gl.activeTexture(gl.TEXTURE0 + u);
    gl.bindTexture(gl.TEXTURE_2D, null);
  }

  ring = next; W = w; H = h;
  cvs.width = w; cvs.height = h;

  if(oldN){
    /* Carry the picture across instead of reseeding it. Resizing the window,
       or moving Resolution or Delay, used to throw the frame away and start
       again from noise — and adaptive quality would have done that on its own,
       unasked, mid-session. Slot n-1 gets the newest frame, n-2 the one before
       it and so on, because that is what step() and present() read relative to
       head, which restarts at 0. Where the new ring is DEEPER than the old
       one the oldest frame is repeated into the rest, so a delay line that has
       just been lengthened reads a held frame rather than noise. */
    for(let k = 0; k < n; k++){
      const j = Math.min(k, oldN - 1);
      copyInto(next[n - 1 - k], old[(oldHead + oldN - 1 - j) % oldN].tex, w, h);
    }
    head = 0;
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, null);
  } else {
    head = 0;
    seedAll();
  }

  old.forEach(t => { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fbo); });
  dirty = true;
  settleUntil = performance.now() + SETTLE_MS;
}

/* ---------- state ---------- */
let playing = true;
/* Paused, the loop computes nothing — so the only things that can change what
   is ON SCREEN are the display shader's own knobs (bloom, scanlines) and the
   canvas being resized. Without this, pausing to look at a frame still cost a
   full-screen fragment pass sixty times a second, bloom's nine texture fetches
   per pixel included: real battery, for an image that is not moving. Set
   generously — the cost of a redundant present is one frame, the cost of a
   missed one is a stale picture. */
let dirty = true;
let gen = 0;
const center = {x:0.5, y:0.5};      // vanishing point, fixed at frame centre
const seedPos = {x:0.5, y:0.5};     // where the seed lands this frame
const seedAnchor = {x:0.5, y:0.5};  // where the user put it
let pulse = 0;                      // decaying one shot
let drawHold = 0;                   // sustained while the right button is down
let customTex = null, hasCustom = 0;
const startT = performance.now();

function drawQuad(){ gl.drawArrays(gl.TRIANGLES, 0, 3); }

function seedInto(idx){
  gl.useProgram(progSeed);
  gl.bindFramebuffer(gl.FRAMEBUFFER, ring[idx].fbo);
  gl.viewport(0, 0, W, H);
  gl.uniform1f(U.seed.time, (performance.now()-startT)/1000);
  gl.uniform1f(U.seed.aspect, W/H);
  drawQuad();
}
function seedAll(){
  /* Drop any ring textures still bound from the last step. Seeding draws into
     those same framebuffers, and leaving them bound reads as a feedback loop. */
  for(let u = 0; u < 3; u++){
    gl.activeTexture(gl.TEXTURE0 + u);
    gl.bindTexture(gl.TEXTURE_2D, null);
  }
  for(let i=0;i<ring.length;i++) seedInto(i);
  gen = 0;
  dirty = true;
}

/* ---------- feedback step ---------- */
function step(t){
  const N = ring.length;            // the ring is sized to the delay in use
  const prevIdx  = (head + N - 1) % N;
  const dF = Math.min(P.delayFrames|0, N - 2);
  const delayIdx = (head + N - 1 - dF) % N;

  gl.useProgram(progFb);
  gl.bindFramebuffer(gl.FRAMEBUFFER, ring[head].fbo);
  gl.viewport(0, 0, W, H);

  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, ring[prevIdx].tex);
  gl.uniform1i(U.fb.uPrev, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, ring[delayIdx].tex);
  gl.uniform1i(U.fb.uDelay, 1);
  gl.activeTexture(gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_2D, customTex || emptyTex);
  gl.uniform1i(U.fb.uCustom, 2);

  /* The seed stays where it was placed. Seed motion orbits it from there,
     so at zero drift it does not move at all. */
  const d = P.seedDrift;
  seedPos.x = seedAnchor.x + Math.sin(t*0.7) * 0.30 * d;
  seedPos.y = seedAnchor.y + Math.cos(t*0.53) * 0.30 * d;

  gl.uniform2f(U.fb.uCenter, center.x, 1.0 - center.y);
  gl.uniform2f(U.fb.uPx, 1/W, 1/H);
  gl.uniform1f(U.fb.uTime, t);
  gl.uniform1f(U.fb.uAspect, W/H);
  gl.uniform1f(U.fb.uZoom, P.zoom);
  gl.uniform1f(U.fb.uRot, P.rot * Math.PI/180);
  gl.uniform1f(U.fb.uWarp, P.warp);
  gl.uniform2f(U.fb.uPan, P.panX, -P.panY);
  gl.uniform1f(U.fb.uBright, P.bright);
  gl.uniform1f(U.fb.uContrast, P.contrast);
  gl.uniform1f(U.fb.uSat, P.sat);
  gl.uniform1f(U.fb.uHue, P.hue * Math.PI/180);
  gl.uniform1f(U.fb.uGain, P.decay);
  gl.uniform1f(U.fb.uSharp, P.sharp);
  gl.uniform1f(U.fb.uBleed, P.bleed);
  gl.uniform1f(U.fb.uDelayMix, dF > 0 ? P.delayMix : 0.0);
  gl.uniform1i(U.fb.uEdge, P.edge|0);
  gl.uniform1i(U.fb.uKaleido, P.kaleido|0);
  gl.uniform1i(U.fb.uMirrorX, P.mirrorX|0);
  gl.uniform1i(U.fb.uInvert, P.invert|0);
  gl.uniform1i(U.fb.uSeedShape, P.seedShape|0);
  gl.uniform1i(U.fb.uHasCustom, hasCustom);
  gl.uniform1f(U.fb.uSeedAmt, P.seedAmt + pulse + drawHold);
  gl.uniform1f(U.fb.uSeedSize, P.seedSize);
  gl.uniform2f(U.fb.uSeedPos, seedPos.x, 1.0 - seedPos.y);

  drawQuad();

  head = (head + 1) % N;
  gen++;
  pulse *= 0.80;
}

function present(){
  const outIdx = (head + ring.length - 1) % ring.length;
  gl.useProgram(progDisp);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, cvs.width, cvs.height);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, ring[outIdx].tex);
  gl.uniform1i(U.disp.tex, 0);
  gl.uniform2f(U.disp.px, 1/W, 1/H);
  gl.uniform1f(U.disp.bloom, P.bloom);
  gl.uniform1f(U.disp.scan, P.scan);
  gl.uniform1f(U.disp.lines, H);
  drawQuad();
}

/* ---------- main loop ---------- */
/* The real rig runs at video rate, so the loop is pinned to 60 Hz —
   otherwise a 144 Hz display would burn through generations 2.4x faster. */
const STEP_MS = 1000/60;
let last = performance.now(), acc = 0;
function frame(now){
  requestAnimationFrame(frame);
  const raw = now - last; last = now;
  let dt = Math.min(raw, 250);
  /* Snap a near-60 Hz frame to exactly one step. A display that calls itself
     60 Hz actually delivers 16.60-16.75 ms, and rAF adds its own jitter on top
     — a bare accumulator turns that into a 1,1,0,1,1,0 step pattern. The
     average rate is right and the picture still advances unevenly, and uneven
     is exactly what reads as dropped frames. Only JITTER is absorbed (+-12%),
     never a real difference in refresh rate: a 50 Hz display still goes
     through the accumulator and still runs at wall-clock speed. */
  if(dt > STEP_MS * 0.88 && dt < STEP_MS * 1.12) dt = STEP_MS;
  const t = (now - startT) / 1000;
  let stepped = 0;
  if(playing){
    acc += dt;
    const n = Math.max(1, P.iters|0);
    /* Two caps, not one. Ticks bound how far the loop will chase a late frame;
       PASSES bounds the GPU work it can spend doing so, because Loops/frame
       multiplies every tick — under the old tick-only guard, iters 3 could
       fire twelve full-screen passes inside one frame, which guaranteed the
       next frame was late as well. That is the spiral this stops; sustained
       slowness is answered by dropping quality instead (see tune). */
    let ticks = 0, passes = 0;
    while(acc >= STEP_MS && ticks < 4 && passes + n <= 8){
      for(let i = 0; i < n; i++) step(t);
      passes += n; ticks++; stepped++;
      acc -= STEP_MS;
    }
    if(acc > STEP_MS*4) acc = 0;
    /* Measure only while the loop is actually working, only once a rebuild has
       settled, and never across a stall — a tab coming back to the front is
       not a frame rate. */
    if(!adaptOff && now >= settleUntil && raw < STALL_MS){
      sampleSum += raw; samples++;
      if(samples >= SAMPLE_FRAMES){
        const avg = sampleSum / samples;
        samples = 0; sampleSum = 0;
        tune(avg);
      }
    }
  }
  /* Draw only when there is something new to draw: a step ran, or something
     outside the loop marked the frame dirty (a display knob, a resize, a tab
     coming back to the front). The loop is deliberately pinned to 60 Hz, so on
     a 144 Hz display more than half of these frames used to re-present an
     image identical to the one already on screen — and while PAUSED, all of
     them did. */
  if(stepped || dirty){ present(); dirty = false; }
}
/* A tab coming back to the front has been composited by someone else in the
   meantime; redraw once rather than trusting what is left on the canvas. */
document.addEventListener("visibilitychange", () => { if(!document.hidden) dirty = true; });
