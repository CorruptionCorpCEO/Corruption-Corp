  This is Fractal Crack's app copy, served directly at corruptioncorp.net/fractalcrack
  (see data/programs/FractalCrack/page.txt and data/site/README.txt). Its asset
  paths are root-absolute (/fractalcrack/assets/...) rather than relative,
  because the route it's served from (/fractalcrack, no trailing slash) would
  otherwise resolve a relative "assets/..." against the site ROOT, not this
  folder — same reason Pinballa's own build bases its assets at /pinball/.
  The standalone dev copy (originally D:\Claude\Fractal Crack) keeps plain
  relative paths, since it's served from its own root.
-->

<!-- CRENZO is the only font this hud ever renders in, and it is ours and
     same-origin — so it is preloaded (a webfont is otherwise not discovered
     until the stylesheet has been parsed AND something needing it has been
     laid out) and nothing else is fetched at all.

     There used to be a Google-hosted IBM Plex Mono here as the fallback, which
     cost two cross-origin handshakes and a RENDER-BLOCKING stylesheet on every
     visit to pay for a face that only renders if CRENZO fails. The stack below
     falls back to the platform's own monospace instead, which costs nothing
     and is already on the machine. (The splash deliberately never waited on
     document.fonts.ready for the same reason — see hideSplashWhenDressed.) -->
<link rel="preload" href="/fractalcrack/assets/fonts/CRENZO.ttf" as="font" type="font/ttf" crossorigin>
<style>
@font-face{
  font-family:"CRENZO";
  src:url("/fractalcrack/assets/fonts/CRENZO.ttf") format("truetype");
  font-display:swap;
}
/* ---------- boot splash ----------
   Same functionality as the Corruption Corp site's own splash and Pinballa's
   take on it (logo + spinner, 0.7s fade) — on this app's own black chrome
   instead of the site's white, matching Fractal Crack's own background.
   Inline in the main stylesheet, before anything else, so it paints on the
   very first frame while the console art, the webfont and the first WebGL
   frame are still loading in; the script fades it out once all three are
   actually ready (see hideSplashWhenDressed), with the inline script right
   after <body> as a safety net if that never fires. */
#fc-splash{
  position:fixed; inset:0;
  z-index:5000;
  background:#000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(28px, 5vh, 56px);
  transition:opacity .7s ease;
}
#fc-splash.splash-hide{
  opacity:0;
  pointer-events:none;
}
#fc-splash img{
  width:min(60vw, 420px);
  max-height:40vh;
  object-fit:contain;
}
.fc-splash-loader{
  width:clamp(34px, 6vh, 52px);
  height:clamp(34px, 6vh, 52px);
  border-radius:50%;
  border:4px solid rgba(255,255,255,.12);
  border-top-color:rgba(255,255,255,.65);
  animation:fcSplashSpin .8s linear infinite;
}
@keyframes fcSplashSpin{
  to{ transform:rotate(360deg); }
}
:root{
  /* Desktop/landscape console sizing. --gap is derived, so it scales with the
     cells rather than needing its own bump. The portrait media query pins its
     own --cell on #knobPanel so the phone sheet keeps the size it was tuned
     at — this larger value is for the roomier layout only.
     The vh term matters: the console's tallest column is 7 cells (Signal),
     so its height is what runs out first. Sizing on vw alone looks right on
     a 16:9 monitor and overflows the bottom of a short, wide window. */
  --cell: clamp(46px, min(5.4vw, 8.4vh), 88px);
  --gap: calc(var(--cell) * 0.13);
  /* The console's own footprint, derived rather than measured so the legend
     can be pinned to exactly the same width and stacked directly on top of
     it (see the desktop placement block). 6 columns = Controls + the five
     knob groups; 7 rows = the tallest of those columns, Signal's header plus
     its six knobs. Keep both in step with GROUPS if a knob is ever added. */
  --console-w: calc(6 * var(--cell) + 5 * var(--gap));
  --console-h: calc(7 * var(--cell) + 6 * var(--gap));
  --hud-fade: .45s ease;
  /* The CC exit plate's own footprint. Its WIDTH is two knobs — the hole it
     sits in is the Seed and Display columns, so this spans them exactly and
     its edges line up with the grid above it. The height then follows from
     the plate's 96:62 aspect, which is what it was drawn at; keep the ratio
     if the width ever changes, or the CC mark stops filling the box. */
  --cc-exit-w: calc(2 * var(--cell) + var(--gap));
  --cc-exit-h: calc(var(--cc-exit-w) * 62 / 96);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%; overscroll-behavior:none}

/* ---------- double-click / long-press defences ----------
   Nothing in the hud is text, and every control is artwork. A double-click on
   one used to hand the browser a selection anyway: a highlight box flashing
   over the console art, and on some engines an <img> left "selected" until you
   clicked somewhere else. So the whole layer opts out of selection, images opt
   out of the drag ghost and the long-press save/copy callout, and the one
   thing that IS text — the legend's type-a-value box — opts back in. See also
   the dblclick/selectstart guards in the script. */
.hud,
.hud *{
  -webkit-user-select:none;
  user-select:none;
}
#legend .lg-value-edit{
  -webkit-user-select:text;
  user-select:text;
}
img{
  -webkit-user-drag:none;
  -webkit-touch-callout:none;
}
body{
  margin:0;
  background:#000;
  color:#e8ecf2;
  font-family:"CRENZO",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  overflow:hidden;
}

/* ---------- viewport ---------- */
#gl{
  position:fixed; inset:0;
  width:100%; height:100%;
  display:block;
  z-index:0;
  touch-action:none;       /* the app owns pan/zoom on the canvas, not the browser */
}

/* ---------- hud shell ---------- */
.hud{
  position:fixed; inset:0;
  z-index:10;
  pointer-events:none;
  opacity:1;
  transition:opacity var(--hud-fade);
}
.hud.idle{opacity:0}
.hud > *{pointer-events:auto}
/* faded out means gone — an invisible console must not eat canvas clicks */
.hud.idle, .hud.idle *{pointer-events:none}

/* ---------- top bar (logo + console) ---------- */
/* display:contents by default — this wrapper has no box of its own here, so
   #logo and #console position themselves exactly as if they were still
   direct children of .hud (which is what they were before this wrapper
   existed). Only the portrait media query below turns it into a real flex
   row, to vertically centre the two against each other. */
#topBar{ display:contents }

/* ---------- back to Corruption Corp ----------
   The same control Pinballa carries, in the same two-step shape: this app
   fills the tab, so following the link is a one-way trip out of it and an
   accidental press is expensive. The first press swaps the mark for EXIT?,
   the second navigates (see the script). A real <a href="/"> so it
   middle-clicks, long-presses and previews like any other link.

   Plate colours are Pinballa's — black line art on a light plate — which is
   also the only readable option here: cclogo.png is black, and this app's
   chrome is black.

   WHERE it sits: the console's own bottom-right corner, in the block of empty
   grid under the Seed and Display columns. Those two are five cells tall in a
   box that is seven (Signal is the long one), so there is always a 2x2 hole of
   cells there — 103px square at the smallest --cell this layout allows, which
   is room to spare for an 83x55 plate. Derived from --console-h/--gap rather
   than measured, for exactly the reason #legend is: no element can be
   positioned against another element's box in CSS, and these are the numbers
   the console is built from. Keep them in step with GROUPS.

   It is also LAST inside #topBar, and both it and #console are positioned with
   z-index auto — so DOM order is what paints it in front of the knob grid.
   Moving it earlier in the markup would put it behind. */
#ccExit{
  position:absolute;
  /* Base layout: the console hangs from top:16px, so the hole is that far down
     plus the console's height, less the plate's own. */
  top:calc(16px + var(--console-h) - var(--cc-exit-h));
  right:18px;
  /* Exactly the hole: two cells plus the gap between them, so the plate's
     left edge lands on the Seed column's and its right edge on Display's. It
     therefore can't spill left under the Feedback column, whose sixth cell
     (Kaleidoscope) IS occupied unlike Seed's and Display's. */
  width:var(--cc-exit-w);
  height:var(--cc-exit-h);
  display:flex; align-items:center; justify-content:center;
  /* Proportional, or the mark would run to the border on a big screen and
     swim in space on a small one — the plate spans a knob pair, so it grows
     with --cell across a 46-88px range. */
  padding:calc(var(--cc-exit-h) * 0.1) calc(var(--cc-exit-w) * 0.085);
  /* The ring the control buttons wear. Theirs is painted into
     blank-circle-red.png and greyed by `.g-controls .tint`, so the colour was
     MEASURED rather than guessed: that art drawn through the same
     `grayscale(1) brightness(1.06)` at this plate's size gives a ~5px band
     running #303030 to #838383, averaging #505050. A solid 2px line at that
     average carries the same weight as the soft ring. The drop-shadow is the
     .cell one verbatim — everything else in the hud sits on that shadow, and
     without it the plate reads as pasted on top of the console rather than as
     part of it. */
  border:2px solid #505050;
  border-radius:8px;
  background:#f2f2f2;
  color:#111;
  text-decoration:none;
  cursor:pointer;
  filter:drop-shadow(0 2px 8px rgba(0,0,0,.65));
  transition:background .15s ease, border-color .15s ease;
}
@media (hover:hover) and (pointer:fine){
  #ccExit:hover{ background:#fff; border-color:#000 }
}
#ccExit:focus-visible{outline:2px solid #fff; outline-offset:3px}
#ccExit img{
  /* cclogo.png is wide line art on transparent. It fills the content box and
     `contain` keeps its aspect, so whichever of the two the plate runs out of
     first is what sizes the mark — no second number to keep in step when the
     plate is capped against a small hole. */
  max-width:100%; max-height:100%;
  width:auto; height:auto;
  object-fit:contain;
  pointer-events:none;
}
/* Armed: the mark is replaced by the word IN THE SAME BOX, so the plate never
   changes size between the two states. */
#ccExit .cc-confirm{
  display:none;
  font-family:inherit;
  /* Sized off the plate's WIDTH, because width is what constrains it — the old
     0.3-of-the-HEIGHT ran "EXIT?" 157px wide inside a 115px content box, i.e.
     21px over each edge, which is why it read as filling the button end to end.
     Note that adding padding to THIS element could never have fixed that: it is
     a centred flex item, so its own padding is invisible until the text
     overflows, and by then it is already too late. The plate's 8.5% horizontal
     padding was there the whole time.
     Measured for CRENZO at letter-spacing .06em: "EXIT?" renders about 5.7x the
     font size, and the content box is about 0.8x the plate width, so 0.11x
     leaves the text at roughly 78% of the box with real space either side. Any
     change to the face or the wording wants that ratio re-measured. */
  font-size:clamp(11px, calc(var(--cc-exit-w) * 0.11), 24px);
  font-weight:700; letter-spacing:.06em;
  color:inherit;
}
#ccExit.confirming img{display:none}
#ccExit.confirming .cc-confirm{display:block}

/* ---------- logo ---------- */
#logo{
  position:absolute; top:18px; left:20px;
  width:25vw;               /* one quarter of the viewport */
  min-width:120px;
  height:auto;
  user-select:none;
  -webkit-user-drag:none;
  filter:drop-shadow(0 3px 14px rgba(0,0,0,.75));
}

/* ---------- console ---------- */
#console{
  position:absolute; top:16px; right:18px;
  display:flex;
  gap:var(--gap);
  align-items:flex-start;
}
.col{
  display:flex; flex-direction:column;
  gap:var(--gap);
}
/* wraps every group EXCEPT controls (that's #controlsBar itself, a .col) —
   same flex row the columns sat in directly before this wrapper existed, so
   desktop/landscape looks identical; only the portrait media query below
   turns this into the slide-up knob sheet. */
#knobPanel{
  display:flex;
  gap:var(--gap);
}

.cell{
  position:relative;
  width:var(--cell); height:var(--cell);
  flex-shrink:0;            /* a circle must never get squeezed into an oval
                                by a flex row that's short on space — the
                                mobile controls/knob rows both scroll instead */
  display:block;
  border:0; padding:0; margin:0;
  background:transparent;
  cursor:pointer;
  border-radius:50%;
  filter:drop-shadow(0 2px 8px rgba(0,0,0,.65));
  touch-action:none;       /* a knob's own drag must not scroll an ancestor */
}
.cell.hdr{cursor:default}
.cell img{
  position:absolute; inset:0;
  width:100%; height:100%;
  pointer-events:none;
  -webkit-user-drag:none;
}
.cell .glyph{
  position:absolute;
  left:19%; top:19%; width:62%; height:62%;
  pointer-events:none;
}
/* NO will-change here, and that is the point. Every .cell carries a
   drop-shadow filter, and a composited child forces its ancestor's filter to
   be composited too: the shadow stops being pixels rasterised once with the
   cell and becomes a render surface the compositor re-applies EVERY FRAME —
   and every frame the WebGL canvas underneath changes, so every frame is
   redrawn. That was twenty-nine offscreen blur passes a frame whenever the
   console was up, on top of the fragment work the loop actually needs;
   invisible on a desktop GPU, a real slice of an older phone's. Uncomposited,
   the shadows are cached with the cells, and turning a knob repaints that one
   cell — which refreshKnobs already limits to the hands that moved. */
.cell .hand{
  transform-origin:50% 50%;
}
/* selection ring */
.cell::after{
  content:"";
  position:absolute; inset:-5%;
  border-radius:50%;
  border:2px solid #fff;
  opacity:0;
  transition:opacity .12s;
  pointer-events:none;
  box-shadow:0 0 10px rgba(255,255,255,.5);
}
.cell.sel::after{opacity:1}
.cell:focus-visible{outline:2px solid #fff; outline-offset:3px}

/* group recolouring — the sprites ship red, greys are untouched by hue-rotate */
.g-controls .tint{filter:grayscale(1) brightness(1.06)}
.g-camera   .tint{filter:hue-rotate(240deg)}
.g-signal   .tint{filter:hue-rotate(40deg)}
.g-feedback .tint{filter:none}
.g-seed     .tint{filter:hue-rotate(131deg)}
.g-display  .tint{filter:hue-rotate(282deg)}

/* ---------- legend ---------- */
/* Base layout: bottom-left, stacked directly above the timeline dock, which
   owns the corner now. --tl-top is where the dock's top edge sits (measured
   by the script — the panel's height is its content's), so the legend clears
   the square button when the editor is shut and the whole panel when it is
   open. The desktop and portrait layouts put the legend elsewhere and
   override this. */
#legend{
  position:absolute; left:22px; bottom:calc(var(--tl-top, 12px) + 10px);
  min-width:210px; max-width:330px;
  background:#fff;
  border:1px solid var(--accent,#6b7280);
  border-left-width:3px;
  border-radius:8px;
  padding:11px 14px 12px;
  /* NO backdrop-filter. There was a blur(8px) here, behind an OPAQUE white
     fill — invisible by construction, but the compositor still has to resolve
     it, and its backdrop is a WebGL canvas that changes every single frame. So
     it was a full-screen blur recomputed 60 times a second, for nothing, the
     whole time the legend was on screen — which is exactly while you are
     turning a knob and watching the result. */
  opacity:0;
  transform:translateY(6px);
  transition:opacity .14s, transform .14s;
}
#legend.show{opacity:1; transform:translateY(0)}
#legend .lg-group{
  font-size:9.5px; letter-spacing:.24em; text-transform:uppercase;
  color:var(--accent,#9aa3af);
  margin-bottom:3px;
  padding-right:22px;
}
#legend .lg-title{
  font-size:14px; font-weight:600; color:#000; line-height:1.2;
  padding-right:22px;
}
#lgClose{
  position:absolute; top:7px; right:8px;
  width:20px; height:20px;
  display:grid; place-items:center;
  padding:0; border-radius:5px;
  border:1px solid rgba(0,0,0,.14);
  background:transparent;
  color:#6b7280;
  font-family:inherit; font-size:14px; line-height:1;
  cursor:pointer;
  transition:color .12s, border-color .12s, background .12s;
}
@media (hover:hover) and (pointer:fine){
  #lgClose:hover{
    color:#000;
    border-color:var(--accent,#000);
    background:rgba(0,0,0,.06);
  }
}
#lgClose[hidden]{display:none}
#legend .lg-value{
  margin-top:7px;
  font-size:21px; font-weight:500;
  color:var(--accent,#000);
  font-variant-numeric:tabular-nums;
}
#legend .lg-value.editable{
  cursor:pointer;
  border-bottom:1px dashed var(--accent,#000);
  width:fit-content;
}
#legend .lg-value-edit{
  display:block;
  margin:7px 0 0;
  width:100%;
  font-family:inherit;
  font-size:21px; font-weight:500;
  color:var(--accent,#000);
  font-variant-numeric:tabular-nums;
  background:rgba(0,0,0,.05);
  border:0; border-bottom:1px solid var(--accent,#000);
  border-radius:2px;
  padding:0 2px;
  outline:none;
}
#legend .lg-opts{
  margin-top:8px; display:flex; flex-wrap:wrap; gap:4px;
}
/* Unselected/selected read against #legend's WHITE fill (see above) — the
   selected pill fills with the group's own accent colour rather than white,
   so its label (kept white-on-accent) is never white-on-white. */
#legend .lg-opts button{
  font-family:inherit;
  font-size:10px; letter-spacing:.05em; text-transform:uppercase;
  padding:4px 8px; border-radius:4px;
  border:1px solid rgba(0,0,0,.18);
  background:transparent;
  color:#4a5160;
  cursor:pointer;
  transition:border-color .12s, color .12s, background .12s;
}
@media (hover:hover) and (pointer:fine){
  #legend .lg-opts button:hover{
    border-color:var(--accent,#000);
    color:#1a1d24;
  }
}
#legend .lg-opts button.on{
  border-color:var(--accent,#333);
  color:#fff;
  background:var(--accent,#333);
}
#legend .lg-lock{
  margin-top:8px; font-size:9.5px; letter-spacing:.16em;
  text-transform:uppercase; color:#6f7683;
}
/* What the timeline will do with this knob: "keying at 3.25s" while the
   editor is parked on a time, "animated" when keyframes are driving it. */
#legend .lg-tl{ margin-top:4px; color:var(--accent,#6f7683) }
#legend .lg-tl:empty{ display:none }

.nogl{
  position:fixed; inset:0; display:grid; place-items:center;
  padding:40px; text-align:center; color:#8b93a1; z-index:20;
}

/* ---------- photo mode prompt ----------
   Deliberately a SIBLING of .hud, not a child: photo mode's whole job is to
   take the hud away, and .hud.idle also kills pointer-events on everything
   inside it. It shows for a second on entering and fades out; the hud does not
   come back until Escape (see enterPhoto/exitPhoto). Never interactive — the
   only way out is the key. */
#photoHint{
  position:fixed; top:5.5vh; left:50%;
  transform:translateX(-50%);
  z-index:11;
  padding:0 16px;
  max-width:100vw;
  font-size:13px; letter-spacing:.18em; text-transform:uppercase;
  color:#8b909a;
  text-shadow:0 2px 12px rgba(0,0,0,.85);
  white-space:nowrap;
  pointer-events:none;
  opacity:0;
  transition:opacity .55s ease;
}
#photoHint.show{
  opacity:1;
  transition:opacity .16s ease;
}

/* ---------- keyframe timeline ----------
   The bottom-left corner: a square toggle, and beside it (above it, on a
   phone held upright) the editor panel. See "Keyframe timeline" in the script
   for how it plays and keys.

   The DOCK itself never takes a pointer — on a phone it spans the screen's
   width, and an invisible box that wide would swallow every touch on the
   canvas under it. Its two children take pointers instead, and only while the
   hud is up: an id selector outranks `.hud.idle *`, so this is written as
   `:not(.idle)` rather than letting a faded-out button stay clickable.

   Shadows are box-shadows, not the drop-shadow FILTER the cells wear. The
   playhead moves every frame, and a filtered ancestor of a changing child is
   a surface the compositor re-renders every frame — the same trap the note
   on .cell .hand describes. On a rectangle the two look the same. */
#tlDock{
  --tl-btn:clamp(36px, calc(var(--cell) * 0.62), 48px);
  position:absolute;
  /* Spans from the corner to the knobs: the console sits 18px in from the
     right and is --console-w wide, and the dock stops one knob-gap short of
     it, so the panel reads as the next column over rather than as a box
     parked beside the grid. */
  left:22px; bottom:22px;
  right:calc(18px + var(--console-w) + var(--gap));
  display:flex;
  align-items:flex-end;
  gap:10px;
  pointer-events:none;
}
.hud:not(.idle) #tlToggle,
.hud:not(.idle) #tlPanel{ pointer-events:auto }
/* Owners only: the dock stays out of the page until the script has matched
   the signed-in account against the owner digests (see "Owner gate"). */
.hud:not(.tl-admin) #tlDock{ display:none }

/* The square toggle — the exit plate's clothes (light plate, #505050 ring),
   inverted while the editor is open so the state reads at a glance. */
#tlToggle{
  flex:0 0 auto;
  width:var(--tl-btn); height:var(--tl-btn);
  display:grid; place-items:center;
  padding:0;
  border:2px solid #505050;
  border-radius:8px;
  background:#f2f2f2;
  color:#111;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.65);
  transition:background .15s ease, border-color .15s ease, color .15s ease;
}
#tlToggle svg{ width:64%; height:64%; display:block; pointer-events:none }
@media (hover:hover) and (pointer:fine){
  #tlToggle:hover{ background:#fff; border-color:#000 }
  .hud.tl-open #tlToggle:hover{ background:#000; border-color:#fff }
}
.hud.tl-open #tlToggle{ background:#111; color:#f2f2f2; border-color:#f2f2f2 }

#tlPanel{
  display:none;
  /* Takes whatever the dock leaves after the toggle — i.e. everything up to
     the knobs. The floor is explicit because everything in the track is
     positioned, so its min-content width is zero: on a window too narrow to
     hold it, a panel without one would collapse to nothing rather than run
     under the console. */
  flex:1 1 auto;
  min-width:230px;
  /* The lanes' columns (see "the lanes" below): name, line, delete. */
  --tl-lab:116px; --tl-del:20px; --tl-lgap:8px;
  --tl-lane-h:24px; --tl-ruler-h:17px;
  --tl-row-h:var(--tl-lane-h);            /* a lane's real height (taller stacked) */
  /* The lanes change shape with the PANEL's width, not the viewport's — see
     the @container rule below. */
  container:tlpanel / inline-size;
  padding:8px 12px 10px;
  /* Opaque, unlike the first cut's 86%: the ruler is sticky over lanes that
     scroll under it and has to be the same ground as the panel it sits on. */
  background:#0a0a0a;
  border:2px solid #505050;
  border-radius:8px;
  box-shadow:0 2px 8px rgba(0,0,0,.65);
  color:#e8ecf2;
}
.hud.tl-open #tlPanel{ display:block; animation:tlIn .16s ease }
@keyframes tlIn{
  from{ opacity:0; transform:translateY(6px) }
  to{ opacity:1; transform:none }
}

.tl-head{ display:flex; align-items:center; gap:6px; margin-bottom:6px }
/* "240 / 600 f": the playhead, then the loop's length — typed, in frames
   (the loop's own, 60 a second). One unit for both numbers, and no LEN box:
   CRENZO's digits are wide (a "0" is ~1.4em), and a labelled box of its own
   pushed the header off a phone. */
.tl-time{
  flex:0 1 auto; min-width:0;
  display:inline-flex; align-items:center; gap:5px;
  font-size:11px; letter-spacing:.04em;
  color:#e8ecf2;
}
#tlClock{ font-variant-numeric:tabular-nums; white-space:nowrap }
.tl-sep{ color:#6b7280 }
.tl-unit{ font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:#8b909a }
/* Import/export results and the like, in the header's spare middle. */
#tlMsg{
  flex:1 1 auto; min-width:0;
  font-size:9px; letter-spacing:.14em; text-transform:uppercase;
  color:#8b909a;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  opacity:0;
  transition:opacity .4s ease;
}
#tlMsg.show{ opacity:1; transition-duration:.12s }

.tl-b{
  height:24px; min-width:24px;
  padding:0 8px;
  display:inline-flex; align-items:center; justify-content:center;
  flex:0 0 auto;
  border:1px solid #505050;
  border-radius:5px;
  background:transparent;
  color:#c9ced6;
  font-family:inherit;
  font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  line-height:1;
  cursor:pointer;
  transition:border-color .12s, color .12s, background .12s;
}
.tl-b.tl-icon{ width:24px; padding:0 }
.tl-b svg{ width:12px; height:12px; display:block; fill:currentColor; pointer-events:none }
@media (hover:hover) and (pointer:fine){
  .tl-b:hover:not(:disabled){ border-color:#f2f2f2; color:#fff }
}
.tl-b:disabled{ opacity:.32; cursor:default }
#tlToggle:focus-visible,
.tl-b:focus-visible,
.tl-lab:focus-visible,
.tl-del:focus-visible,
#tlTrack:focus-visible{ outline:2px solid #fff; outline-offset:2px }

.tl-b .tl-i-play{ display:none }
.hud.tl-parked .tl-b .tl-i-play{ display:block }
.hud.tl-parked .tl-b .tl-i-pause{ display:none }

/* The length box. Sized to its digits by the script (tlSizeLen), since a
   fixed width is either wasted on "600" or too narrow for "36000". It is the
   one bit of real text in the hud besides the legend's value box, so it opts
   back into selection. */
#tlLen{
  box-sizing:content-box;
  width:4.35em;
  height:20px;
  padding:0 5px; margin:0;
  border:1px solid #505050;
  border-radius:4px;
  outline:none;
  background:transparent;
  color:#e8ecf2;
  font:inherit;
  text-align:right;
  font-variant-numeric:tabular-nums;
  cursor:text;
  -webkit-user-select:text; user-select:text;
  transition:border-color .12s;
}
#tlLen:focus{ border-color:#f2f2f2 }

/* Clear-all, two-step: a plain black bomb on the one LIGHT plate in the
   panel; the first press turns it into a "?" (and the plate dark), and only
   the second one clears — the same shape as the exit plate. */
#tlClear{ background:#f2f2f2; border-color:#f2f2f2; color:#000 }
#tlClear svg{ width:16px; height:16px }
#tlClear .tl-q{ display:none; font-size:14px; font-weight:700; letter-spacing:0 }
@media (hover:hover) and (pointer:fine){
  #tlClear:hover:not(:disabled){ background:#fff; border-color:#fff; color:#000 }
}
#tlClear.armed,
#tlClear.armed:hover:not(:disabled){ background:#000; border-color:#f2f2f2; color:#fff }
#tlClear.armed svg{ display:none }
#tlClear.armed .tl-q{ display:inline }

/* ---- the lanes ----
   One per automated knob (see "Keyframe timeline" in the script for when
   they appear): its name in its colour, then its line, then its delete. The
   ruler and the playhead are built on the SAME three columns (--tl-lab, the
   line, --tl-del, --tl-lgap apart), so every line, the notches above them and
   the playhead all share one x range without anything being measured.

   #tlTrack is the scroller: past six lanes it stops growing and scrolls. The
   ruler is sticky inside it rather than outside, so a scrollbar narrowing the
   lanes narrows the ruler with them and the notches stay over the lines. */
#tlTrack{
  position:relative;
  max-height:calc(var(--tl-ruler-h) + 6 * var(--tl-row-h));
  /* ...and never so tall the panel (and the legend stacked on it) runs off a
     short window: at least two lanes, then whatever the height allows. */
  max-height:min(calc(var(--tl-ruler-h) + 6 * var(--tl-row-h)),
                 max(calc(var(--tl-ruler-h) + 2 * var(--tl-row-h)), calc(100vh - 290px)));
  max-height:min(calc(var(--tl-ruler-h) + 6 * var(--tl-row-h)),
                 max(calc(var(--tl-ruler-h) + 2 * var(--tl-row-h)), calc(100svh - 290px)));
  overflow-x:hidden; overflow-y:auto;
  overscroll-behavior:contain;
  /* Every gesture in here is the script's: scrub, grab, and on touch the
     vertical scroll too (see the track's pointer handlers). */
  touch-action:none;
  cursor:pointer;
  scrollbar-width:thin;
  scrollbar-color:#505050 transparent;
}
#tlTrack::-webkit-scrollbar{ width:6px }
#tlTrack::-webkit-scrollbar-thumb{ background:#505050; border-radius:3px }
#tlInner{ position:relative }
.tl-rulerrow{
  position:sticky; top:0; z-index:2;
  display:flex; gap:var(--tl-lgap);
  height:var(--tl-ruler-h);
  background:#0a0a0a;                    /* the panel's ground: lanes scroll under it */
}
.tl-rl-lab{ flex:0 0 var(--tl-lab) }
.tl-rl-del{ flex:0 0 var(--tl-del) }
#tlRuler{ position:relative; flex:1 1 auto; min-width:0 }
.tl-tick{
  position:absolute; bottom:1px;
  width:1px; height:3px; margin-left:-.5px;
  background:#5c6270;
}
.tl-tick.major{ height:6px; background:#9aa0aa }
.tl-num{
  position:absolute; top:0;
  transform:translateX(-50%);
  font-size:9px; line-height:9px; letter-spacing:.04em;
  color:#8b909a;
  white-space:nowrap;
}
/* The playhead's head, riding the ruler's bottom edge. Its stem is
   #tlHead, down in the lanes; tlDrawHead moves both by the same amount. */
#tlCap{ position:absolute; left:0; bottom:0; width:0; height:0 }
#tlCap::after{
  content:"";
  position:absolute; left:-5px; top:-5px;
  border:5px solid transparent;
  border-top:6px solid #fff;
  border-bottom:0;
}

.tl-lane{
  display:flex; align-items:center; gap:var(--tl-lgap);
  height:var(--tl-row-h);
}
/* The knob's name, in the knob's colour — and a button: pressing it selects
   that knob, so a lane can always be traced back to the dial it belongs to. */
.tl-lab{
  flex:0 0 var(--tl-lab); min-width:0;
  height:100%;
  display:flex; align-items:center;
  padding:0; margin:0;
  border:0; background:none;
  color:var(--k);
  font-family:inherit; font-size:9px; line-height:1.15; letter-spacing:.02em;
  text-align:left;
  cursor:pointer;
}
/* Two lines at most. CRENZO is wide — "Kaleidoscope" alone is 111px at this
   size — so the column is sized to hold the longest WORD, and a two-word name
   ("Edge behaviour") takes the second line rather than an ellipsis. */
.tl-lab > span{
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;
  overflow:hidden;
}
@media (hover:hover) and (pointer:fine){
  .tl-lab:hover{ text-decoration:underline; text-underline-offset:3px }
}
/* The draft lane — the knob last pressed, nothing keyed on it yet. */
.tl-lane.draft .tl-lab{ opacity:.6 }
.tl-lane.neutral .tl-lab{ color:#6b7280; cursor:default; text-decoration:none }
/* The line itself: plain white, its OUTLINE the knob's group colour (the
   hud's ring grey on the stand-in lane). A box-shadow ring rather than a
   border, so the line keeps its size whatever the ring is doing. The lane
   of the knob in hand — the one the legend shows, else the one last
   pressed — glows. */
.tl-line{
  position:relative;
  flex:1 1 auto; min-width:0;
  height:6px;
  background:#fff;
  border-radius:3px;
  box-shadow:0 0 0 2px var(--k);
  transition:box-shadow .18s ease;
}
.tl-lane.hot .tl-line{ box-shadow:0 0 0 2px var(--k), 0 0 12px 1px var(--kg) }
.tl-key{
  position:absolute; top:50%;
  width:9px; height:9px; margin:-4.5px 0 0 -4.5px;
  background:var(--k);
  border:1.5px solid #0a0a0a;
  border-radius:1.5px;
  transform:rotate(45deg);
  transition:opacity .12s;
}
.tl-lane.hot .tl-key{ width:11px; height:11px; margin:-5.5px 0 0 -5.5px; border-color:#fff }
.tl-key.doomed{ opacity:.15 }
.tl-del{
  flex:0 0 var(--tl-del);
  height:min(20px, 100%);
  display:grid; place-items:center;
  padding:0; margin:0;
  border:1px solid #505050;
  border-radius:4px;
  background:transparent;
  color:#8b909a;
  font-family:inherit; font-size:13px; line-height:1;
  cursor:pointer;
  transition:border-color .12s, color .12s;
}
@media (hover:hover) and (pointer:fine){
  .tl-del:hover{ border-color:#f2f2f2; color:#fff }
}
/* Nothing to clear on a draft or the stand-in: the button keeps its room so
   the lines stay lined up, it just is not there. */
.tl-lane.draft .tl-del,
.tl-lane.neutral .tl-del{ visibility:hidden }

/* The stem: over every lane's line, inset to the same column, so it spans
   all of them wherever the list is scrolled to. */
#tlHeadLayer{
  position:absolute; top:var(--tl-ruler-h); bottom:0;
  left:calc(var(--tl-lab) + var(--tl-lgap));
  right:calc(var(--tl-del) + var(--tl-lgap));
  z-index:1;
  pointer-events:none;
}
#tlHead{
  position:absolute; left:-1px; top:0; bottom:0;
  width:2px;
  background:#fff;
  box-shadow:0 0 0 1px rgba(0,0,0,.55);
}

.tl-foot{ display:flex; gap:6px; margin-top:8px }
.tl-foot .tl-b{ flex:1 1 0; height:26px }

@media (pointer:coarse){
  .tl-b{ height:30px; min-width:30px }
  .tl-b.tl-icon{ width:30px }
  #tlLen{ height:26px; font-size:12px }
  .tl-foot .tl-b{ height:32px }
  #tlPanel{ --tl-del:28px; --tl-lane-h:30px }
  .tl-del{ height:min(24px, 100%); font-size:15px }
}

/* A NARROW panel — a phone either way up, a small window — stacks each name
   over its line instead of beside it, so the line keeps the width. Keyed to
   the panel's own width, not a media query: the panel is whatever the dock
   leaves between the toggle and the knobs, and that is not a function of any
   one viewport number. The ruler and the playhead read the same --tl-lab, so
   a 6px one still lines them up with the lines (and leaves the "0s" room to
   centre on the line's start). */
@container tlpanel (max-width: 440px){
  #tlTrack{ --tl-lab:6px; --tl-row-h:calc(var(--tl-lane-h) + 4px) }
  .tl-lane{
    display:grid;
    grid-template-columns:minmax(0, 1fr) var(--tl-del);
    grid-template-rows:12px minmax(0, 1fr);
    column-gap:var(--tl-lgap);
    align-items:center;
  }
  /* Only as wide as the name: the rest of that row is line — a press there
     seeks, like one on the line itself, rather than selecting the knob. */
  .tl-lab{
    grid-column:1; grid-row:1;
    justify-self:start;
    max-width:calc(100% - var(--tl-lab) - var(--tl-lgap));
    height:12px;
    margin-left:calc(var(--tl-lab) + var(--tl-lgap));
  }
  .tl-lab > span{ -webkit-line-clamp:1; word-break:break-all }
  .tl-line{ grid-column:1; grid-row:2; margin-left:calc(var(--tl-lab) + var(--tl-lgap)) }
  .tl-del{ grid-column:2; grid-row:1 / span 2 }
}

/* ---------- touch hit pads ----------
   The drawn control is a circle of --cell with about --gap of nothing between
   it and its neighbour, and border-radius clips hit testing as well as paint —
   so on a phone a tap in the space between two knobs, or on a knob's own
   clipped corner, landed on the row and did nothing at all. Every cell grows
   an invisible SQUARE pad that overlaps its neighbours', leaving no dead space
   in a row; hit testing counts a pseudo-element as part of the element that
   owns it, so the button's own box, its artwork and the selection ring are all
   untouched. Mouse pointers keep the exact circle they can see.

   --hit is also what the portrait sheet pads its rows by, so the pads are not
   clipped away by those rows' own overflow — keep the two in step. */
@media (pointer:coarse){
  .cell{ --hit:7px }
  .cell::before{
    content:"";
    position:absolute;
    inset:calc(var(--hit) * -1);
    border-radius:8px;
  }
}

/* ---------- desktop placement ----------
   Console in the bottom-right corner with the legend stacked directly above
   it, both pinned to the same --console-w so they read as one panel. The
   legend's `bottom` clears the console's own height rather than measuring
   it, which is why --console-h exists.

   The min-height is not decoration: this stacks two boxes that used to live
   in opposite corners into one, so it needs roughly 500px of headroom. A
   landscape PHONE matches (orientation:landscape) but has nowhere near that
   — it keeps the base corner layout instead, which is also what "when
   horizontal, maintain the current hud" asked for. Below this block's
   threshold nothing overrides the base rules, so that fallback is automatic. */
@media (min-width:901px) and (min-height:640px){
  #console{
    top:auto; bottom:18px;
    width:var(--console-w);
    /* still flex-start: the top row (play + the five group headers) is a
       meaningful row of its own, and bottom-aligning would break it up. */
  }
  /* The console is bottom-anchored here, so its empty corner is simply the
     screen's — same 18px inset, no derivation needed. */
  #ccExit{
    top:auto; bottom:18px; right:18px;
  }
  #legend{
    left:auto; right:18px;
    bottom:calc(18px + var(--console-h) + var(--gap));
    width:var(--console-w);
    min-width:0;
    max-width:none;
  }
  /* Same 18px inset as the console in the opposite corner (the right edge,
     up to the knobs, is the base rule's). */
  #tlDock{ left:18px; bottom:18px }
}

/* ---------- mobile portrait ----------
   Landscape (including landscape phones/tablets) is untouched — everything
   below is scoped to portrait so "when horizontal, maintain the current hud"
   holds exactly. Layout, not behaviour: the same GROUPS/cells/knobs render
   here, just reflowed — Controls (play/reset/inject/random/upload) is a
   permanent vertical strip down the LEFT edge under the logo, and
   Camera/Signal/Feedback/Seed/Display move into a slide-up sheet toggled by
   tapping the logo, so the fractal itself keeps most of a narrow screen by
   default. */
@media (max-width:900px) and (orientation:portrait){
  /* #topBar becomes a real flex row here (it's display:contents everywhere
     else — see the base rule) spanning the same left:20px/right:18px inset
     the two used to carry independently, so logo and console still start
     and end in the same places. align-items:center is the actual point of
     this: #logo and #console are wildly different heights (the logo scales
     with its own aspect ratio; the controls block is just its own two rows
     of icons), so lining up their TOPS the way independent absolute
     positioning did left them visually unbalanced. Centering them against
     each other reads as one coherent row instead. */
  /* #topBar becomes a real flex row here (it's display:contents everywhere
     else — see the base rule) spanning the same left:20px/right:18px inset
     its children used to carry independently, so they still start and end in
     the same places. It WRAPS: the logo and the exit plate share the first
     line, and the controls strip takes a line of its own underneath, which is
     what puts it "just below the logo" without anything having to measure the
     logo's height (it scales with its own aspect ratio, so that height is not
     a number anything else can know). The one gap does both axes, so the
     spacing above the strip is the same as the one beside the logo. */
  #topBar{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    position:absolute;
    top:16px; left:20px; right:18px;
  }
  /* Line 1, right-hand end. The plate is LAST in the markup, which is what
     puts it there — but the controls sit BETWEEN them in the DOM, so `order`
     is what pulls it back up onto the logo's line. */
  #ccExit{
    position:static;
    order:2;
    /* Shrinkable, unlike the console. Two fixed boxes plus a logo do not fit
       a 320px phone, and of the two that CAN give, the logo giving first is
       the worse trade — it is the only way to reach the knobs here, so it
       keeps a floor (below) and the plate yields to it. `contain` on the mark
       means shrinking the plate just draws the logo smaller, not squashed. */
    flex:0 1 auto;
    min-width:72px;
  }
  /* Line 1, left. Roomier than it used to be: the controls have moved off
     this line, so the logo only shares it with the plate. The min-width is a
     touch target — this is the knob sheet's toggle, and it was collapsing to
     48x33 at 320px; past that point the exit plate gives way instead. */
  #logo{
    position:static;
    order:1;
    flex:0 1 auto;
    width:calc(50vw - 25px);
    min-width:64px;
    cursor:pointer;
  }
  /* Line 2, on its own: a 100% basis is what forces the wrap, so the strip
     always starts a new line however wide the logo and plate end up. */
  #console{
    position:static;
    order:3;
    flex:0 0 100%;
  }
  /* Controls: ONE vertical column down the left edge, in DOM order
     (play, reset, inject, random, upload) — the same order the desktop column
     reads top to bottom, so no nth-child reshuffling any more. */
  #controlsBar{
    --cell: 36px;
    background:transparent;
    flex-direction:column;
    align-items:flex-start;
    width:auto;
  }
  /* Knobs: a bottom sheet, fixed to the viewport regardless of where it sits
     in the DOM (no ancestor here has a transform, so position:fixed anchors
     to the real viewport). Hidden below the fold by default; .knobs-open
     (toggled by the logo, see the script) slides it up "in front of" the
     bottom of the canvas rather than pushing anything. */
  #knobPanel{
    /* Pinned to what the sheet was tuned at — :root's --cell is the bigger
       desktop/landscape size and would blow the rows out on a phone. */
    --cell: 42px;
    position:fixed; left:0; right:0; bottom:0; top:auto;
    flex-direction:column;
    align-items:stretch;
    /* No gap: each row carries --hit of vertical padding instead (below), so
       adjacent rows' hit pads meet exactly and nothing between them is dead.
       Row pitch is unchanged — the 14px that was here moved into the rows. */
    gap:0;
    margin:0;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    max-height:62vh;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    touch-action:pan-y;
    background:#fff;
    border-top-left-radius:16px;
    border-top-right-radius:16px;
    box-shadow:0 -8px 28px rgba(0,0,0,.55);
    transform:translateY(105%);
    transition:transform .3s ease;
    z-index:6;
  }
  .hud.knobs-open #knobPanel{ transform:translateY(0) }
  /* The pull bar. Pinned to the viewport's bottom edge, it rides the sheet's
     top edge as the sheet opens: its translate is the sheet's height times the
     open fraction (--sheet-h is measured by the script). While a finger is on
     it the script writes both transforms inline and .knobs-dragging drops the
     transitions, so the sheet tracks the finger 1:1. */
  #knobHandle{
    display:flex; align-items:center; justify-content:center;
    position:fixed; left:0; right:0; bottom:0;
    height:calc(34px + env(safe-area-inset-bottom, 0px));
    padding-bottom:env(safe-area-inset-bottom, 0px);
    box-sizing:border-box;
    background:#fff;
    border-top-left-radius:16px;
    border-top-right-radius:16px;
    box-shadow:0 -4px 16px rgba(0,0,0,.4);
    touch-action:none;
    cursor:grab;
    transition:transform .3s ease, border-radius .3s ease, box-shadow .3s ease;
    z-index:7;
  }
  #knobHandle::before{
    content:""; width:44px; height:5px; border-radius:3px; background:#505050;
  }
  .hud.knobs-open #knobHandle{ box-shadow:none }
  .hud.knobs-dragging #knobPanel,
  .hud.knobs-dragging #knobHandle{ transition:none }
  /* Open, the bar sits over the top of the sheet — this padding is the room
     it takes, so it never covers the first row. */
  #knobPanel{ padding-top:calc(34px + env(safe-area-inset-bottom, 0px) + 6px) }
  /* Each group becomes its own horizontally-scrollable row: header icon
     first (unchanged from desktop), its knobs trailing after it. */
  #knobPanel .col{
    flex-direction:row;
    align-items:center;
    width:100%;
    overflow-x:auto;
    overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    touch-action:pan-x;
    /* A scroll container clips at its PADDING box, so without this the hit
       pads above/below each cell would be clipped straight back off. Keep in
       step with --hit. */
    padding:7px 0;
  }
  /* .cell::after / :focus-visible are a WHITE ring — right everywhere else
     (dark canvas showing through), invisible against #knobPanel's white
     fill. Cells living in the sheet get a dark ring instead; #controlsBar's
     cells still sit over the canvas, so they're untouched. */
  #knobPanel .cell::after{
    border-color:#000;
    box-shadow:0 0 8px rgba(0,0,0,.35);
  }
  #knobPanel .cell:focus-visible{ outline-color:#000 }
  /* Legend stays vertically centred in the viewport at all times in portrait
     — sheet open or closed — rather than pinned to its usual bottom-left
     corner, so it's never reading a value through, or hidden under, the
     sheet. z-index puts it above #knobPanel (6) for the case where centred
     lands inside the sheet's own area while open. Width is clamped so it
     can't run off a narrow screen the way a fixed 330px max-width can on a
     small phone. */
  #legend{
    top:50%; bottom:auto; right:22px;
    max-width:min(330px, calc(100vw - 44px));
    z-index:7;
    transition:opacity .14s, transform .14s;
    transform:translateY(calc(-50% + 6px));
  }
  #legend.show{ transform:translateY(-50%) }

  /* The dock sits on the pull bar, and RIDES the sheet: the script moves it
     by the same amount it moves the bar (tlRide), so an open sheet carries the
     timeline up on its top edge instead of covering it — you can watch the
     outline and the keys land while turning the knobs below. The toggle is
     the controls strip's width, and the panel starts where the strip ends,
     so while the sheet is up the panel clears the strip entirely; the toggle
     itself would land on the strip there, so it steps aside until the sheet
     goes back down. */
  #tlDock{
    --tl-btn:36px;
    left:20px; right:18px;
    bottom:calc(34px + env(safe-area-inset-bottom, 0px) + 12px);
    z-index:7;
    transition:transform .3s ease;
  }
  .hud.knobs-dragging #tlDock{ transition:none }
  #tlPanel{ min-width:0 }
  .hud.knobs-open #tlToggle{ visibility:hidden }
  /* Riding an open sheet, the panel has the sheet's height under it and the
     top bar above it; three lanes, fewer on a short phone, then it scrolls. */
  .hud.knobs-open #tlTrack{
    max-height:min(calc(var(--tl-ruler-h) + 3 * var(--tl-row-h)),
                   max(calc(var(--tl-ruler-h) + var(--tl-row-h)), calc(100vh - 600px)));
    max-height:min(calc(var(--tl-ruler-h) + 3 * var(--tl-row-h)),
                   max(calc(var(--tl-ruler-h) + var(--tl-row-h)), calc(100svh - 600px)));
  }
  /* Centred, the legend would land in the middle of the open editor. With it
     open, it stacks on top instead, in the panel's own column (20px inset +
     the 36px toggle + the 10px gap) so it stays off the controls strip. */
  .hud.tl-open #legend{
    top:auto; left:66px; right:18px;
    bottom:calc(var(--tl-top, 0px) + 10px);
    transform:translateY(6px);
  }
  .hud.tl-open #legend.show{ transform:translateY(0) }
}

@media (prefers-reduced-motion:reduce){
  .hud,#legend,.cell::after,#fc-splash,#photoHint,#ccExit,#tlToggle,.tl-line,#tlMsg{transition:none}
  .fc-splash-loader,.hud.tl-open #tlPanel{animation:none}
}
@media (prefers-reduced-motion:reduce) and (max-width:900px) and (orientation:portrait){
  #knobPanel,#knobHandle,#tlDock{transition:none}
}
/* The pull bar only exists where the sheet does (the portrait block shows it
   with .hud #knobHandle, which outranks this). */
#knobHandle{display:none}
@media (max-width:900px) and (orientation:portrait){
  .hud #knobHandle{display:flex}
}
</style>
