/* ------------------------------------------------------------------ */
/*  Console build                                                      */
/* ------------------------------------------------------------------ */
const controlsBarEl = document.getElementById("controlsBar"); // the Controls group itself (it's a .col already, in the markup)
const knobPanelEl = document.getElementById("knobPanel");     // everything else: Camera/Signal/Feedback/Seed/Display
const cells = [];               // every interactive control
let selected = null;            // cell object, or null
let hovered  = null;
let dragCount = 0;              // knobs mid-adjustment; holds the hud open

const SWEEP = 270;              // -135deg .. +135deg

function angleFor(c){
  let t;
  if(c.def.t === "sel"){
    const n = optionsOf(c).length;
    t = n > 1 ? P[c.def.k] / (n - 1) : 0.5;
  } else {
    const d = c.def;
    t = (P[d.k] - d.min) / (d.max - d.min);
  }
  return -SWEEP/2 + Math.max(0, Math.min(1, t)) * SWEEP;
}
function optionsOf(c){
  const o = c.def.options;
  return (c.def.k === "seedShape" && hasCustom) ? o.concat(["custom"]) : o;
}

function img(src, cls){
  const e = document.createElement("img");
  e.src = "/fractalcrack/assets/" + src;
  e.alt = "";
  if(cls) e.className = cls;
  return e;
}

GROUPS.forEach(g => {
  // Controls IS #controlsBar (see the markup) — everyone else gets a fresh
  // .col appended into #knobPanel, same as every group used to get appended
  // straight into #console.
  const isControls = g.id === "controls";
  const col = isControls ? controlsBarEl : document.createElement("div");
  if(!isControls) col.className = "col g-" + g.id;

  g.items.forEach(def => {
    /* a header is inert unless it carries an action of its own */
    const inert = (def.t === "hdr" && !def.act);
    const cell = document.createElement(inert ? "div" : "button");
    cell.className = "cell" + (inert ? " hdr" : "");
    if(!inert){ cell.type = "button"; }

    const obj = {def, group:g, el:cell, hand:null};

    if(def.t === "knob" || def.t === "sel"){
      cell.appendChild(img("knob-base-red.png", "tint"));
      const hand = img("knob-hand-red.png", "tint hand");
      cell.appendChild(hand);
      obj.hand = hand;
      cell.setAttribute("aria-label", def.label);
    } else {
      cell.appendChild(img("blank-circle-red.png", "tint"));
      const glyph = img(def.icon, "glyph");
      cell.appendChild(glyph);
      obj.glyph = glyph;
      cell.setAttribute("aria-label", def.aria || def.label);
      if(inert) cell.setAttribute("role", "img");
    }

    col.appendChild(cell);
    cells.push(obj);
    wire(obj);
  });

  if(!isControls) knobPanelEl.appendChild(col);
});

function refreshKnobs(){
  /* Called on EVERY value change, which during a drag is every pointermove.
     Writing a transform into all twenty-nine hands each time dirtied all
     twenty-nine compositor layers (each one is a will-change:transform inside
     a drop-shadowed cell, so each invalidation is a filter surface to
     re-render) to move exactly one of them. Compare the string that would be
     written — floats out of angleFor() differ in noise the rendered value
     doesn't. */
  cells.forEach(c => {
    if(!c.hand) return;
    const deg = angleFor(c).toFixed(2);
    if(deg === c.deg) return;
    c.deg = deg;
    c.hand.style.transform = "rotate(" + deg + "deg)";
  });
  dirty = true;                       // a display knob may have moved the frame
  if(legendTarget()) drawLegend(legendTarget());
}

/* ------------------------------------------------------------------ */
/*  Legend                                                             */
/* ------------------------------------------------------------------ */
const legend  = document.getElementById("legend");
const lgGroup = document.getElementById("lgGroup");
const lgTitle = document.getElementById("lgTitle");
const lgValue = document.getElementById("lgValue");
const lgOpts  = document.getElementById("lgOpts");
const lgLock  = document.getElementById("lgLock");
const lgClose = document.getElementById("lgClose");

lgClose.addEventListener("click", e => { e.stopPropagation(); select(null); });

/* Touch has no passive hover, so PRESSING a control is what previews it: hold
   a knob and it appears in the legend, keep holding and drag up/down to move
   its value, let go and the legend follows whatever is selected again (see
   wire()). Header icons — inert, with no tap action of their own — get the
   same press-to-read, which is what makes them discoverable at all on a phone.
   Every cell's own pointerenter/leave does the work; touch fires those either
   side of the press, and pointer capture suppresses the leave for the duration
   of a drag, which is exactly the behaviour wanted.
 
   This used to be a roaming preview instead: a pointermove listener here that
   elementFromPoint'ed whatever the finger was over. It was NOT inert during a
   knob drag the way its comment claimed — pointer capture RETARGETS move
   events to the knob, it does not stop them bubbling on up to this element —
   so dragging a knob upwards handed the legend to whichever cell the finger
   had crossed onto, or blanked it once the finger left the sheet. The value
   being changed was the one thing you could not read while changing it. */

function legendTarget(){ return hovered || selected; }

function drawLegend(c){
  if(editingCell && editingCell !== c) cancelEditValue(); // switched target mid-edit: discard, don't guess at a commit
  legend.style.setProperty("--accent", c.group.accent);
  lgGroup.textContent = c.def.t === "hdr" ? "Section" : c.group.name;
  lgTitle.textContent = c.def.label;
  lgOpts.textContent = "";
  const locked = (selected === c);

  if(c.def.t === "knob"){
    if(editingCell !== c) lgValue.textContent = c.def.fmt(P[c.def.k]);
    lgValue.style.display = "";
    lgValue.classList.toggle("editable", locked);
  } else if(c.def.t === "sel"){
    lgValue.style.display = "none";
    optionsOf(c).forEach((name, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = name;
      b.setAttribute("aria-pressed", String(i === P[c.def.k]));
      if(i === P[c.def.k]) b.className = "on";
      b.addEventListener("click", ev => {
        ev.stopPropagation();
        setValue(c, i);
        select(c);                    // stay locked so you can keep picking
      });
      lgOpts.appendChild(b);
    });
  } else {
    /* buttons carry no value modifier */
    lgValue.style.display = "none";
  }
  lgLock.textContent = locked
    ? (c.def.t === "sel" ? "locked — click an option"
       : c.def.t === "knob" ? "locked — drag, or tap the value to type one"
       : "")
    : "";
  lgClose.hidden = !locked;           // only offer it when there is a lock to release
  legend.classList.add("show");
}
function hideLegend(){ cancelEditValue(); legend.classList.remove("show"); lgClose.hidden = true; }

function updateLegend(){
  const t = legendTarget();
  if(t) drawLegend(t); else hideLegend();
}

function select(c){
  if(selected) selected.el.classList.remove("sel");
  selected = c;
  if(c) c.el.classList.add("sel");
  updateLegend();
}

/* ------------------------------------------------------------------ */
/*  Type an exact value — click/tap lg-value while a knob is locked.   */
/*  Works identically on mouse and touch: a tap both focuses the input */
/*  (bringing up the on-screen keyboard) and is a user gesture, which  */
/*  is all focus()-to-open-keyboard needs on every mobile browser.     */
/* ------------------------------------------------------------------ */
let editingCell = null;
const lgValueInput = document.createElement("input");
lgValueInput.type = "text";
lgValueInput.className = "lg-value lg-value-edit";
lgValueInput.autocomplete = "off";
lgValueInput.spellcheck = false;

function cancelEditValue(){
  if(!editingCell) return;
  editingCell = null;
  if(lgValueInput.isConnected) lgValueInput.replaceWith(lgValue);
}
function commitEditValue(){
  if(!editingCell) return;
  const c = editingCell;
  const n = parseFloat(lgValueInput.value);
  cancelEditValue();
  if(!Number.isNaN(n)){
    setValue(c, n);                 // already clamps to [min,max] and rounds to step
    select(c);                      // stays locked, same as picking a sel option does
  } else if(selected === c){
    drawLegend(c);                  // bad input: put the real value back on screen
  }
}
lgValueInput.addEventListener("keydown", e => {
  e.stopPropagation();              // arrow keys etc. must not reach the knob underneath
  if(e.key === "Enter"){ e.preventDefault(); lgValueInput.blur(); }
  else if(e.key === "Escape"){ e.preventDefault(); cancelEditValue(); updateLegend(); }
});
lgValueInput.addEventListener("blur", commitEditValue);
lgValueInput.addEventListener("pointerdown", e => e.stopPropagation());
lgValueInput.addEventListener("click", e => e.stopPropagation());
// Bookend the edit with the idle timer: focus clears any countdown already
// scheduled (wake() won't set a new one while editingCell is set), and the
// blur below runs AFTER commitEditValue has cleared editingCell, so it
// starts the countdown again from the moment the box is done with.
lgValueInput.addEventListener("focus", () => wake());
lgValueInput.addEventListener("blur", () => wake());

lgValue.addEventListener("click", e => {
  const c = selected;
  if(!c || c.def.t !== "knob") return;   // only a locked knob has a min/max to type into
  e.stopPropagation();
  editingCell = c;
  lgValueInput.value = String(P[c.def.k]);
  // iOS's decimal keypad has no minus key at all — anything with a negative
  // range needs the full keyboard instead, or a negative value is unreachable.
  lgValueInput.inputMode = c.def.min < 0 ? "text" : "decimal";
  lgValue.replaceWith(lgValueInput);
  lgValueInput.focus();
  lgValueInput.select();
});

/* ------------------------------------------------------------------ */
/*  Control wiring                                                     */
/* ------------------------------------------------------------------ */
function setValue(c, val){
  const d = c.def;
  if(d.t === "sel"){
    const n = optionsOf(c).length;
    P[d.k] = Math.max(0, Math.min(n-1, Math.round(val)));
  } else {
    let v = Math.max(d.min, Math.min(d.max, val));
    v = Math.round(v / d.step) * d.step;
    v = Math.max(d.min, Math.min(d.max, v));
    P[d.k] = parseFloat(v.toPrecision(10));
    /* Both of these change what has to be allocated: res the size of every
       target, delayFrames how many of them there are. Debounced through
       scheduleAlloc so dragging a knob across its range rebuilds once at the
       end rather than at every value on the way. */
    if(d.k === "res" || d.k === "delayFrames") scheduleAlloc();
    /* Moving Resolution is the user saying what they want — let the adaptive
       multiplier start again from full, relative to the value they just set. */
    if(d.k === "res") resetAdaptive();
  }
  refreshKnobs();
}

function wire(c){
  const el = c.el, d = c.def;

  el.addEventListener("pointerenter", () => { hovered = c; updateLegend(); });
  el.addEventListener("pointerleave", () => { if(hovered === c) hovered = null; updateLegend(); });

  if(d.t === "hdr"){                     // section label: legend on hover
    if(d.act) el.addEventListener("click", () => doAction(d.act, c));
    return;
  }

  if(d.t === "btn"){
    el.addEventListener("click", () => doAction(d.act, c));
    return;
  }

  /* knob / selector: vertical drag, click to lock, double-click to default */
  let dragging = false, startY = 0, startVal = 0, moved = 0;

  el.addEventListener("pointerdown", e => {
    dragging = true; moved = 0;
    startY = e.clientY;
    startVal = P[d.k];
    /* Touch has no passive hover: the press IS the hover, so the knob goes
       into the legend now and stays there for as long as the finger is down —
       which is the whole drag. (A mouse already got here through pointerenter;
       setting it again is a no-op.) */
    hovered = c; updateLegend();
    dragCount++; wake();                // hold the hud open while adjusting
    // Guarded like the release below: capture is a nicety (it's what keeps the
    // drag — and the legend — attached to this knob once the finger leaves it),
    // and a throw here would take the preventDefault below down with it.
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
    e.preventDefault();
  });

  el.addEventListener("pointermove", e => {
    if(!dragging) return;
    const dy = startY - e.clientY;
    moved = Math.max(moved, Math.abs(dy));
    const fine = e.shiftKey ? 0.2 : 1;
    if(d.t === "sel"){
      const n = optionsOf(c).length;
      setValue(c, startVal + (dy / 150) * (n - 1) * fine);
    } else {
      setValue(c, startVal + (dy / 190) * (d.max - d.min) * fine);
    }
  });

  const end = e => {
    if(!dragging) return;
    dragging = false;
    dragCount = Math.max(0, dragCount - 1);
    /* Releasing a touch ends the "hover" it stood in for. Only refreshed here
       for a real DRAG: a tap is followed by a click that calls select(), which
       redraws the legend anyway, and hiding it in between would flash it. */
    if(e.pointerType === "touch" && hovered === c){
      hovered = null;
      if(moved > 3) updateLegend();
    }
    wake();                             // restart the idle countdown
    try{ el.releasePointerCapture(e.pointerId); }catch(_){}
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);

  el.addEventListener("click", e => {
    if(moved > 3) return;                 // that was a drag, not a click
    select(selected === c ? null : c);
  });

  el.addEventListener("dblclick", e => {
    e.preventDefault();
    setValue(c, DEFAULTS[d.k]);
    select(c);                            // stays selected after a reset
  });

  el.addEventListener("wheel", e => {
    if(selected !== c && hovered !== c) return;
    e.preventDefault();
    const dir = e.deltaY < 0 ? 1 : -1;
    if(d.t === "sel") setValue(c, P[d.k] + dir);
    else setValue(c, P[d.k] + dir * d.step * (e.shiftKey ? 1 : 5));
  }, {passive:false});

  el.addEventListener("keydown", e => {
    let dir = 0;
    if(e.key === "ArrowUp" || e.key === "ArrowRight") dir = 1;
    else if(e.key === "ArrowDown" || e.key === "ArrowLeft") dir = -1;
    else return;
    e.preventDefault();
    if(d.t === "sel") setValue(c, P[d.k] + dir);
    else setValue(c, P[d.k] + dir * d.step * (e.shiftKey ? 1 : 5));
  });
}

/* ------------------------------------------------------------------ */
/*  Actions                                                            */
/* ------------------------------------------------------------------ */
const fileIn = document.getElementById("fileIn");
let playGlyph = null;
cells.forEach(c => { if(c.def.act === "play") playGlyph = c.glyph; });

function setPlaying(v){
  playing = v;
  dirty = true;
  if(playGlyph) playGlyph.src = "/fractalcrack/assets/" + (v ? "pause.png" : "play.png");
}

/* Drop an uploaded shape and fall back to a built-in one. Deliberately not
   inside seedAll(), which also runs on resize — that must not bin the upload. */
function clearCustom(){
  if(!hasCustom) return;
  hasCustom = 0;
  if(customTex){ gl.deleteTexture(customTex); customTex = null; }
  if(P.seedShape === CUSTOM_INDEX) P.seedShape = DEFAULTS.seedShape;
  refreshKnobs();
}

function doAction(act, c){
  if(act === "play")   setPlaying(!playing);
  else if(act === "reset"){ clearCustom(); seedAll(); }
  else if(act === "inject") pulse = 0.5;
  else if(act === "random") randomize();
  else if(act === "upload") fileIn.click();
  else if(act === "fullscreen") toggleFullscreen();
  else if(act === "photo") enterPhoto();
}

function toggleFullscreen(){
  const root = document.documentElement;
  if(!document.fullscreenElement){
    if(root.requestFullscreen) root.requestFullscreen();
  } else if(document.exitFullscreen){
    document.exitFullscreen();
  }
}

function randomize(){
  const rr = (a, b) => a + Math.random()*(b - a);
  clearCustom();
  const outward = Math.random() < 0.65;
  P.zoom = outward ? rr(1.003, 1.020) : rr(0.978, 0.996);
  P.edge = outward ? (Math.random() < 0.7 ? 3 : 1) : (Math.random() < 0.7 ? 0 : 2);
  P.rot = rr(-4, 4);
  P.panX = rr(-0.02, 0.02);
  P.panY = rr(-0.02, 0.02);
  P.warp = rr(-0.2, 0.2);
  P.contrast = rr(0.9995, 1.0030);
  P.sharp = rr(0.15, 0.65);
  P.sat = rr(0.9990, 1.0040);
  P.hue = rr(-4, 4);
  P.decay = rr(0.9975, 1.0008);
  P.bright = rr(-0.0006, 0.0006);
  P.bleed = rr(0.001, 0.010);
  P.delayFrames = Math.random() < 0.5 ? 0 : Math.floor(rr(2, 13));
  P.delayMix = rr(0.15, 0.55);
  P.kaleido = Math.random() < 0.6 ? 0 : Math.floor(rr(2, 12));
  P.seedShape = 1 + Math.floor(Math.random()*4);
  P.seedAmt = rr(0.10, 0.45);
  P.seedSize = rr(0.02, 0.12);
  /* Seed motion is left alone on purpose: randomising it sets the injection
     wandering, and where it sits is the user's call, not the dice. */
  refreshKnobs();
  scheduleAlloc();                   // delayFrames moved: the ring is resized
}

/* uploaded png becomes an injectable shape */
fileIn.addEventListener("change", () => {
  const f = fileIn.files && fileIn.files[0];
  if(!f) return;
  const url = URL.createObjectURL(f);
  const im = new Image();
  im.onload = () => {
    if(!customTex) customTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, customTex);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, im);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    hasCustom = 1;
    P.seedShape = CUSTOM_INDEX;          // custom appears and is selected
    URL.revokeObjectURL(url);
    refreshKnobs();
  };
  im.onerror = () => URL.revokeObjectURL(url);
  im.src = url;
  fileIn.value = "";
});

/* ------------------------------------------------------------------ */
/*  Canvas pointer                                                     */
/*  left held    — move the injection                                  */
/*  right click  — put the injection here and fire it                  */
/*  right dragged— keep firing along the path, drawing with it         */
/*  double click — send the injection back to the centre               */
/*  The two buttons are tracked separately so a right click still      */
/*  fires while the left button is being held.                         */
/* ------------------------------------------------------------------ */
let leftDown = false, rightDown = false;
const anyDown = () => leftDown || rightDown;

function placeSeed(e){
  seedAnchor.x = Math.min(1, Math.max(0, e.clientX / window.innerWidth));
  seedAnchor.y = Math.min(1, Math.max(0, e.clientY / window.innerHeight));
}
function duckHud(){
  // The knob sheet is something you are working IN, not a label glanced at —
  // taking it away because a finger also touched the canvas behind it would
  // close the menu out from under the hand holding it open.
  if(sheetOpen()) return;
  hud.classList.add("idle");        // out of the way while working on the canvas
  clearTimeout(idleTimer);
}
cvs.addEventListener("contextmenu", e => e.preventDefault());

cvs.addEventListener("pointerdown", e => {
  try{ cvs.setPointerCapture(e.pointerId); }catch(_){}
  if(e.button === 2){
    rightDown = true;
    placeSeed(e);                   // lands wherever the right click hits
    pulse = 0.35;                   // visible even for an instant click
    drawHold = 0.5;                 // held down, so a drag keeps drawing
    duckHud();
    return;
  }
  if(e.button !== 0) return;
  leftDown = true;
  placeSeed(e);
  duckHud();
});

cvs.addEventListener("pointermove", e => { if(anyDown()) placeSeed(e); });

cvs.addEventListener("pointerup", e => {
  if(e.button === 2){ rightDown = false; drawHold = 0; }
  else if(e.button === 0){ leftDown = false; }
  if(anyDown()) return;             // the other button is still down
  try{ cvs.releasePointerCapture(e.pointerId); }catch(_){}
  wake();                           // released: bring the hud back
});
cvs.addEventListener("pointercancel", () => {
  leftDown = rightDown = false; drawHold = 0; wake();
});

cvs.addEventListener("dblclick", () => {
  // A phone has no Escape key, so a double-tap is photo mode's way out there.
  // It takes priority: recentring the seed is not what someone staring at a
  // hidden hud is trying to do.
  if(photoMode){ exitPhoto(); return; }
  seedAnchor.x = 0.5; seedAnchor.y = 0.5;
});

/* Touch has no right button, so a SECOND simultaneous touch stands in for it
   — a common two-finger-for-secondary-action convention. Every touch already
   drives the block above too (it reports button 0 same as a left click, so
   one finger alone already moves the injection point); this only ADDS the
   "fire + keep drawing" behaviour once a second finger joins, and clears it
   as soon as the touch count drops back below two. Tracked independently of
   leftDown/rightDown above so neither block has to know about the other. */
const touchIds = new Set();
cvs.addEventListener("pointerdown", e => {
  if(e.pointerType !== "touch") return;
  touchIds.add(e.pointerId);
  if(touchIds.size === 2){
    rightDown = true;
    placeSeed(e);
    pulse = 0.35;
    drawHold = 0.5;
    duckHud();
  }
});
function releaseTouch(e){
  if(e.pointerType !== "touch") return;
  touchIds.delete(e.pointerId);
  if(touchIds.size < 2){
    rightDown = false; drawHold = 0;
    if(!anyDown()) wake();
  }
}
cvs.addEventListener("pointerup", releaseTouch);
cvs.addEventListener("pointercancel", releaseTouch);

/* ------------------------------------------------------------------ */
/*  Idle auto-hide                                                     */
/* ------------------------------------------------------------------ */
const hud = document.getElementById("hud");
let idleTimer = null;
/* The hud hides after two idle seconds whatever is selected. Two things hold
   it open: an adjustment actually in progress, and a value being typed into
   the legend. That second one matters on every platform — the legend lives
   INSIDE .hud, so letting the countdown run mid-edit fades the very box being
   typed into (and .hud.idle also kills pointer-events on it). On desktop it
   took a two-second pause mid-number to hit; on mobile it fired almost every
   time, because an on-screen keyboard generates no window keydown/pointer
   events to keep resetting the timer. */
const IDLE_MS = 2000;

/* ------------------------------------------------------------------ */
/*  Photo mode — the camera button                                     */
/*                                                                     */
/*  Puts the whole hud away for good and says so once, quietly, then    */
/*  fades that away too. Unlike the idle auto-hide, NOTHING brings the  */
/*  console back except leaving photo mode: moving the mouse, touching  */
/*  the canvas and turning the wheel are all things you want to be able */
/*  to do while the frame is clean, so wake() simply declines to run.   */
/* ------------------------------------------------------------------ */
const photoHint = document.getElementById("photoHint");
const PHOTO_HINT_MS = 1000;
let photoMode = false;
let photoHintTimer = null;

function showPhotoHint(){
  /* Escape is the way out. A phone has no Escape key, so a coarse pointer is
     told about the fallback instead — both are wired either way. */
  photoHint.textContent = COARSE ? "double-tap to exit" : "press escape to exit";
  photoHint.classList.add("show");
  clearTimeout(photoHintTimer);
  photoHintTimer = setTimeout(() => photoHint.classList.remove("show"), PHOTO_HINT_MS);
}
function enterPhoto(){
  if(photoMode) return;
  photoMode = true;
  select(null);                       // nothing left locked behind the curtain
  /* The camera button still holds focus from the click that got here, and the
     key handler below reads off document.body — without this the first Escape
     is spent on the button instead of on photo mode. */
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  hud.classList.add("idle");
  clearTimeout(idleTimer);
  showPhotoHint();
}
function exitPhoto(){
  if(!photoMode) return;
  photoMode = false;
  clearTimeout(photoHintTimer);
  photoHint.classList.remove("show");
  wake();
}

/* The knob sheet's class is toggled on every viewport, but it only MEANS
   anything where the sheet exists — this is the same query its CSS uses, so
   clicking the logo on a desktop can't quietly pin the hud open forever. */
const SHEET_MQ = window.matchMedia("(max-width: 900px) and (orientation: portrait)");
function sheetOpen(){ return SHEET_MQ.matches && hud.classList.contains("knobs-open"); }

function wake(){
  if(photoMode) return;               // stays down until photo mode is left
  /* An OPEN knob sheet holds the hud up the same way an adjustment in progress
     does. It is a surface the user is working in — on a phone it is the only
     way to reach the knobs at all — and fading it out from under them two
     seconds after the last touch made it unusable. */
  const held = sheetOpen();
  if(anyDown() && !held){ hud.classList.add("idle"); return; } // stays hidden until release
  hud.classList.remove("idle");
  clearTimeout(idleTimer);
  if(dragCount > 0 || editingCell || held) return;
  idleTimer = setTimeout(() => hud.classList.add("idle"), IDLE_MS);
}
["pointermove","pointerdown","wheel","keydown","touchstart"].forEach(ev =>
  window.addEventListener(ev, wake, {passive:true}));
wake();

/* ------------------------------------------------------------------ */
/*  Logo tap — mobile-portrait knob sheet toggle                       */
/*  Inert on desktop/landscape: #knobPanel only becomes a slide-up      */
/*  sheet under the portrait media query, so toggling this class there  */
/*  has nothing to move. See the CSS for the actual sheet mechanics.    */
/* ------------------------------------------------------------------ */
const logo = document.getElementById("logo");
function setKnobsOpen(open){
  hud.classList.toggle("knobs-open", open);
  logo.setAttribute("aria-expanded", String(open));
  // Opening cancels any idle countdown already scheduled (wake() won't set a
  // new one while the sheet is up); closing starts one again from here.
  wake();
}
logo.addEventListener("click", () => setKnobsOpen(!hud.classList.contains("knobs-open")));
/* ------------------------------------------------------------------ */
/*  Back to Corruption Corp — a two-step, same contract as Pinballa's  */
/*                                                                     */
/*  Following the link is a one-way trip out of the app, and the plate  */
/*  sits right beside the logo (which on a phone is the knob sheet's    */
/*  toggle), so the first press only ARMS it — the mark becomes EXIT? — */
/*  and the second one navigates.                                      */
/* ------------------------------------------------------------------ */
const ccExit = document.getElementById("ccExit");
if(ccExit){
  const ARM_MS = 3000;      // armed this long, then it forgets
  const MIN_MS = 350;       // ...but not answerable sooner than this
  let armedAt = 0;
  let armTimer = null;
  const disarm = () => {
    armedAt = 0;
    ccExit.classList.remove("confirming");
    ccExit.setAttribute("aria-label", "Back to Corruption Corp");
    clearTimeout(armTimer);
  };
  ccExit.addEventListener("click", e => {
    // A modified click is "open it over there", not "leave" — hand it straight
    // to the browser without arming anything.
    if(e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
    /* MIN_MS is what stops a DOUBLE-CLICK walking straight through the confirm
       — two presses inside the same gesture are one mis-hit, not a decision. */
    if(armedAt && Date.now() - armedAt >= MIN_MS) return;   // second press: navigate
    e.preventDefault();
    armedAt = Date.now();
    ccExit.classList.add("confirming");
    // The label has to move with it, or a screen reader still announces "Back
    // to Corruption Corp" while the button is asking a question.
    ccExit.setAttribute("aria-label", "Press again to leave Fractal Crack");
    clearTimeout(armTimer);
    armTimer = setTimeout(disarm, ARM_MS);
  });
}

/* ------------------------------------------------------------------ */
/*  Double-click defences                                              */
/*                                                                     */
/*  The stylesheet already opts the hud out of selection; these cover   */
/*  what CSS cannot — a dblclick's own default action, which is what    */
/*  drags an <img> into a "selected" state on some engines, and any     */
/*  selection the browser starts anyway. Bubble phase, so a control's   */
/*  own dblclick handler (a knob's reset-to-default) still runs first.  */
/*  The legend's type-a-value box is the one piece of real text in      */
/*  here, so it is exempt from both.                                   */
/* ------------------------------------------------------------------ */
const notTypingIn = e => e.target !== lgValueInput;
hud.addEventListener("dblclick", e => { if(notTypingIn(e)) e.preventDefault(); });
hud.addEventListener("selectstart", e => { if(notTypingIn(e)) e.preventDefault(); });
logo.addEventListener("keydown", e => {
  if(e.key !== "Enter" && e.key !== " ") return;
  e.preventDefault();
  setKnobsOpen(!hud.classList.contains("knobs-open"));
});

/* ------------------------------------------------------------------ */
/*  Keys & resize                                                      */
/* ------------------------------------------------------------------ */
window.addEventListener("keydown", e => {
  // Checked before the focus guard below: photo mode has no visible control to
  // put focus on, so it must answer Escape wherever focus happens to be.
  if(photoMode && e.key === "Escape"){ e.preventDefault(); exitPhoto(); return; }
  if(e.target !== document.body) return;
  if(e.code === "Space"){ e.preventDefault(); setPlaying(!playing); }
  else if(e.key === "r" || e.key === "R") doAction("reset");
  else if(e.key === "Escape") select(null);
});

let allocTimer = null;
function scheduleAlloc(){ clearTimeout(allocTimer); allocTimer = setTimeout(allocate, 120); }
window.addEventListener("resize", scheduleAlloc);

/* ------------------------------------------------------------------ */
/*  Boot splash — same shape as the Corruption Corp site's own splash and    */
/*  Pinballa's take on it, but this one waits for EVERY asset rather than    */
/*  racing them against a cutoff. Pinballa's version drops its splash after  */
/*  SPLASH_MAX_WAIT whether or not the art is in, which on a slow connection */
/*  is exactly the pop-and-reflow the splash exists to hide; here the fade   */
/*  waits on all of it — every <img> in the document (splash logo, hud logo, */
/*  every console icon, knob base and pointer) plus CRENZO itself.           */
/*                                                                          */
/*  Two deliberate exceptions to "everything":                              */
/*  - Broken assets resolve rather than reject (error counts as settled), so */
/*    one 404 can't strand the boot.                                        */
/*  - It does NOT wait on document.fonts.ready, which settles only once     */
/*    EVERY requested font has — including any the page never renders in.   */
/*    (That used to be a Google-hosted IBM Plex Mono fallback, which is no   */
/*    longer requested at all; see the head. Waiting on the one face that    */
/*    IS used, by name, is what the fonts.load below does instead.)         */
/*                                                                          */
/*  The 8s timer in the inline script after <body> is the only ceiling left, */
/*  and it's a true last resort: a request that never settles at all.        */
/* ------------------------------------------------------------------ */
function hideSplashWhenDressed(){
  const splash = document.getElementById("fc-splash");
  if(!splash) return;

  const waits = [];
  for(const im of document.querySelectorAll("img[src]")){
    if(im.complete) continue;               // decoded already (or already failed)
    waits.push(new Promise(res => {
      im.addEventListener("load", res, {once:true});
      im.addEventListener("error", res, {once:true});
    }));
  }
  if(document.fonts) waits.push(document.fonts.load('1em CRENZO').catch(() => {}));

  Promise.all(waits).then(() => {
    // One painted frame with everything in place, so the fade reveals the
    // finished console instead of the frame it was assembled on. rAF is
    // dead in a background tab, so skip the wait there.
    const reveal = () => {
      splash.classList.add("splash-hide");
      setTimeout(() => splash.remove(), 800);
    };
    if(document.hidden) reveal();
    else requestAnimationFrame(() => requestAnimationFrame(reveal));
  });
}

/* ------------------------------------------------------------------ */
/*  Boot                                                               */
/* ------------------------------------------------------------------ */
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
allocate();
refreshKnobs();
setPlaying(!reduce);
requestAnimationFrame(frame);
hideSplashWhenDressed();

})();
</script>
</body>
</html>
