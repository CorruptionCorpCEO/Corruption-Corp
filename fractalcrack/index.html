<script>
(function(){
"use strict";

const cvs = document.getElementById("gl");
/* Context attributes are a real part of the frame budget here, not boilerplate:
   - powerPreference: on a laptop with two GPUs the browser picks the INTEGRATED
     one unless asked otherwise, and this is a full-screen fragment-bound toy —
     that choice alone is the difference between 60 fps and half of it.
   - alpha:false — the canvas is opaque (every shader writes a=1). Without this
     the compositor blends the whole thing over the page on every frame.
   - depth/stencil: never used. They are per-pixel attachments on the default
     framebuffer; not asking for them saves the memory and the bandwidth. */
const GL_ATTRS = {
  antialias:false,
  preserveDrawingBuffer:false,
  alpha:false,
  depth:false,
  stencil:false,
  powerPreference:"high-performance"
};
/* WebGL2 when there is one, WebGL1 when there isn't. This used to be WebGL2 or
   nothing, and "nothing" was exactly the older devices: every iPhone below
   iOS 15, and Android phones whose GPU only does OpenGL ES 2 — they got a
   sentence instead of the toy. Nothing here needs WebGL2: the loop is RGBA8
   render targets, full-screen triangles and one texture fetch or a few, all
   of which WebGL1 has. The one real difference is the shading language, and
   the shaders are translated on the way in (see glsl()). `?webgl=1` forces the
   fallback, which is the only way to see it on a machine that has WebGL2. */
const FORCE_GL1 = new URLSearchParams(location.search).get("webgl") === "1";
let gl = FORCE_GL1 ? null : cvs.getContext("webgl2", GL_ATTRS);
const GL2 = !!gl;
if(!gl) gl = cvs.getContext("webgl", GL_ATTRS) || cvs.getContext("experimental-webgl", GL_ATTRS);
if(!gl){
  document.body.insertAdjacentHTML("beforeend",
    '<div class="nogl">This needs WebGL, which this browser did not provide.</div>');
  // Nothing below this line runs, so hideSplashWhenDressed() never gets
  // defined — drop the splash right here instead of leaving it to the 8s
  // safety net, which would sit on top of the message above for no reason.
  const splash = document.getElementById("fc-splash");
  if(splash) splash.classList.add("splash-hide");
  return;
}

/* ------------------------------------------------------------------ */
/*  Parameters                                                          */
/* ------------------------------------------------------------------ */
/* Defaults are the instrument at rest: every optional effect sits at zero, and
   only the knobs the feedback loop cannot run without carry a working value.
   Those three exceptions are zoom (at 1.000 nothing recurses, so there is no
   fractal at all), gain (an analog loop needs sub-unity gain, or anything
   feeding it runs the frame up to white), and the seed (with nothing injected
   the loop starves and fades to black). Sharpness used to be a fourth; it
   opens at zero now, so the picture starts soft and regenerating detail is
   something you turn on. */
const P = {
  // camera — zoom drives the recursion; the rest are offsets, off at 0
  zoom:1.012, rot:0, panX:0, panY:0, warp:0,
  // signal — trims rest at neutral (1.000 / 0), gain the only exception
  bright:0, contrast:1.0, sat:1.0, hue:0, decay:0.9985, sharp:0,
  // feedback — all character, none of it on until asked for
  bleed:0, delayFrames:0, delayMix:0, edge:3,
  kaleido:0, mirrorX:0, invert:0,
  // seed — shape/amount/size keep the loop alive; drift is an effect, off.
  // seedShape 1 is "dot" (see SHAPES) — the plainest thing to feed in.
  seedShape:1, seedAmt:0.15, seedSize:0.045, seedDrift:0,
  // display — post effects off; iters and res are quality, not effects
  bloom:0, scan:0, iters:1, res:0.70
};
const DEFAULTS = Object.assign({}, P);
const EDGES  = ["mirror","wrap","clamp","black"];
const SHAPES = ["none","dot","ring","bar","noise"];
const CUSTOM_INDEX = 5;

/* One place decides "this is a touch device". Read once: a pointer does not
   become fine because the window was resized, and the two things that key off
   it — the render target's memory budget and which way out of photo mode is
   advertised — are both chosen once. Anything that must follow the live
   viewport is a media query instead (the knob sheet, the hit pads). */
const COARSE = window.matchMedia("(pointer: coarse)").matches;

/* ------------------------------------------------------------------ */
/*  Shaders                                                            */
/* ------------------------------------------------------------------ */
const VERT = `#version 300 es
in vec2 a; out vec2 v;
void main(){ v = a*0.5+0.5; gl_Position = vec4(a,0.0,1.0); }`;

const COMMON = `
vec2 mirrorRepeat(vec2 p){
  p = mod(p, 2.0);
  p = mix(p, 2.0 - p, step(1.0, p));
  return p;
}
float hash(vec2 p){
  p = fract(p*vec2(123.34,456.21));
  p += dot(p, p+45.32);
  return fract(p.x*p.y);
}
vec3 hueRotate(vec3 c, float a){
  const mat3 toYIQ = mat3(0.299,0.596,0.211, 0.587,-0.274,-0.523, 0.114,-0.322,0.312);
  const mat3 toRGB = mat3(1.0,1.0,1.0, 0.956,-0.272,-1.106, 0.621,-0.647,1.703);
  vec3 yiq = toYIQ*c;
  float cs=cos(a), sn=sin(a);
  yiq.yz = mat2(cs,-sn,sn,cs)*yiq.yz;
  return toRGB*yiq;
}`;

const FRAG_SEED = `#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform float uTime; uniform float uAspect;
${COMMON}
void main(){
  vec2 p = v - 0.5; p.x *= uAspect;
  float r = length(p);
  vec3 c = 0.5 + 0.5*cos(vec3(0.0,2.1,4.2) + r*11.0 - uTime*0.6);
  c *= smoothstep(0.62, 0.0, r);
  c += 0.04*hash(v*57.0 + uTime);
  o = vec4(c, 1.0);
}`;

const FRAG_FEEDBACK = `#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform sampler2D uPrev, uDelay, uCustom;
uniform vec2 uCenter, uPx;
uniform float uTime, uAspect;
uniform float uZoom, uRot, uWarp;
uniform vec2 uPan;
uniform float uBright, uContrast, uSat, uHue, uGain, uSharp;
uniform float uBleed, uDelayMix;
uniform int uEdge, uKaleido, uMirrorX, uInvert;
uniform int uSeedShape, uHasCustom;
uniform float uSeedAmt, uSeedSize;
uniform vec2 uSeedPos;
${COMMON}
vec2 fold(vec2 p){
  if(uEdge==0) return mirrorRepeat(p);
  if(uEdge==1) return fract(p);
  if(uEdge==2) return clamp(p, 0.0, 1.0);
  return p;
}
vec3 samp(sampler2D t, vec2 p){
  if(uEdge==3 && (p.x<0.0||p.x>1.0||p.y<0.0||p.y>1.0)) return vec3(0.0);
  return texture(t, fold(p)).rgb;
}
/* analog gear compresses as it approaches white instead of clipping flat */
vec3 softClip(vec3 x){
  const float k = 0.72;
  vec3 over = k + (1.0-k)*tanh(max(x-k, 0.0)/(1.0-k));
  return clamp(mix(x, over, step(k, x)), 0.0, 1.0);
}
void main(){
  vec2 p = v - uCenter;
  p.x *= uAspect;

  /* Rotational repeat only — no mirror fold. Mirroring with
     abs(ang - seg*0.5) is not idempotent: anything already inside the wedge
     comes back as seg*0.5 - ang, so re-applying it every pass flips the frame
     between two mirrored states and flickers at half the frame rate.
     mod() on its own is idempotent, so the loop settles. */
  if(uKaleido > 0){
    float ang = atan(p.y, p.x);
    float rad = length(p);
    float seg = 6.2831853 / float(uKaleido);
    ang = mod(ang, seg);
    p = vec2(cos(ang), sin(ang)) * rad;
  }
  if(uMirrorX == 1) p.x = abs(p.x);

  float c = cos(uRot), s = sin(uRot);
  p = mat2(c,-s,s,c) * p;

  float r2 = dot(p,p);
  p *= 1.0 + uWarp*r2;

  p /= uZoom;
  p.x /= uAspect;
  p += uCenter + uPan;

  /* Chroma bleed samples the three channels at three different offsets — but
     at bleed 0 (the default, and most of the time) those are the same point,
     so this was paying for three dependent texture fetches to fetch one thing.
     uBleed is a uniform, so the branch is the same for every pixel in the draw
     and costs nothing to take. */
  vec3 col;
  if(uBleed > 0.00002){
    vec2 dir = p - (uCenter + uPan);
    col.r = samp(uPrev, p + dir*uBleed).r;
    col.g = samp(uPrev, p).g;
    col.b = samp(uPrev, p - dir*uBleed).b;
  } else {
    col = samp(uPrev, p);
  }

  /* the screen's sharpness control: an unsharp mask, re-applied every loop.
     This is what keeps regenerating fine detail instead of blurring away. */
  if(uSharp > 0.001){
    vec3 blur = samp(uPrev, p + vec2(uPx.x,0.0)*2.5)
              + samp(uPrev, p - vec2(uPx.x,0.0)*2.5)
              + samp(uPrev, p + vec2(0.0,uPx.y)*2.5)
              + samp(uPrev, p - vec2(0.0,uPx.y)*2.5);
    /* limit the boosted detail, or it compounds into a full-scale checkerboard */
    vec3 hf = tanh((col - blur*0.25) * 6.0) / 6.0;
    col += hf * uSharp * 0.9;
  }

  /* Video delay line. Crossfade with the older frame — a screen blend here
     would add energy on every pass and run the whole loop up to white. */
  if(uDelayMix > 0.0001){
    col = mix(col, samp(uDelay, v), uDelayMix);
  }

  col *= uGain;
  col = (col - 0.5) * uContrast + 0.5 + uBright;
  float l = dot(col, vec3(0.299,0.587,0.114));
  col = mix(vec3(l), col, uSat);
  col = hueRotate(col, uHue);
  if(uInvert == 1) col = 1.0 - col;

  if(uSeedShape > 0 && uSeedAmt > 0.0001){
    vec2 sp = v - uSeedPos; sp.x *= uAspect;
    float sz = max(uSeedSize, 0.002);
    float m = 0.0;
    vec3 sc = 0.5 + 0.5*cos(uTime*vec3(1.0,1.3,1.7) + vec3(0.0,2.1,4.2));
    if(uSeedShape == 1) m = smoothstep(sz, 0.0, length(sp));
    else if(uSeedShape == 2){ float d = abs(length(sp) - sz*2.0); m = smoothstep(sz*0.25, 0.0, d); }
    else if(uSeedShape == 3) m = smoothstep(sz, 0.0, abs(sp.y)) * step(abs(sp.x), sz*5.0);
    else if(uSeedShape == 4) m = step(0.985, hash(floor(v*260.0) + floor(uTime*20.0)));
    else if(uSeedShape == 5 && uHasCustom == 1){
      /* uploaded png, mapped into a box of the seed size */
      vec2 q = sp/(sz*5.0)*0.5 + 0.5;
      if(q.x >= 0.0 && q.x <= 1.0 && q.y >= 0.0 && q.y <= 1.0){
        vec4 tx = texture(uCustom, vec2(q.x, 1.0 - q.y));
        m = tx.a;
        sc = tx.rgb;
      }
    }
    /* Crossfade rather than add: an added seed would drive the loop to
       seedAmt/(1-gain) and pin the frame at white. */
    col = mix(col, sc, clamp(m * uSeedAmt, 0.0, 1.0));
  }

  o = vec4(softClip(max(col, 0.0)), 1.0);
}`;

/* Straight passthrough, used only when the ring is rebuilt: it carries the
   picture from the old buffers into the new ones (scaled by the sampler's own
   LINEAR filter) so that resizing the window, moving Resolution or Delay, or
   the adaptive quality below does not throw the frame away and start again
   from noise. */
const FRAG_COPY = `#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform sampler2D uTex;
void main(){ o = vec4(texture(uTex, v).rgb, 1.0); }`;

const FRAG_DISPLAY = `#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform sampler2D uTex;
uniform vec2 uPx;
uniform float uBloom, uScan, uLines;
void main(){
  vec3 c = texture(uTex, v).rgb;
  if(uBloom > 0.001){
    vec3 b = vec3(0.0);
    b += texture(uTex, v + vec2( 1.5, 0.0)*uPx).rgb;
    b += texture(uTex, v + vec2(-1.5, 0.0)*uPx).rgb;
    b += texture(uTex, v + vec2( 0.0, 1.5)*uPx).rgb;
    b += texture(uTex, v + vec2( 0.0,-1.5)*uPx).rgb;
    b += texture(uTex, v + vec2( 1.2, 1.2)*uPx).rgb;
    b += texture(uTex, v + vec2(-1.2, 1.2)*uPx).rgb;
    b += texture(uTex, v + vec2( 1.2,-1.2)*uPx).rgb;
    b += texture(uTex, v + vec2(-1.2,-1.2)*uPx).rgb;
    vec3 hi = max(b/8.0 - 0.45, 0.0);
    c += hi * uBloom * 1.7;
  }
  float sl = 0.5 + 0.5*sin(v.y * uLines * 3.14159265);
  c *= mix(1.0, 0.82 + 0.18*sl, uScan);
  float vg = smoothstep(1.15, 0.35, length(v - 0.5));
  c *= mix(1.0, vg, 0.45);
  c = pow(max(c, 0.0), vec3(0.92));
  o = vec4(c, 1.0);
}`;

/* ------------------------------------------------------------------ */
/*  GL helpers                                                         */
/* ------------------------------------------------------------------ */
/* GLSL ES 3.00 -> 1.00, for a WebGL1 context. The shaders above are written
   once, in 3.00, and rewritten here on the way to the compiler — the
   differences they actually touch are few enough to name:
   - in/out become attribute/varying, and the fragment output is gl_FragColor;
   - texture() is texture2D();
   - tanh() does not exist in 1.00. softClip and the sharpness limiter both use
     it; the stand-in clamps its argument to +-4.5 first, because a GPU without
     highp does this in half floats, where exp(2x) past that overflows to
     infinity and the ratio comes back NaN (tanh(4.5) is already 0.9998);
   - highp is OPTIONAL in a 1.00 fragment shader, and asking for it on a GPU
     that lacks it (the Mali-400 family, still in a lot of cheap phones) is a
     compile error — so it falls back to mediump there. The render targets
     are 8-bit anyway; what mediump costs is precision in the seed's clock,
     which only shows after a long session. */
const GLSL100_FRAG_HEAD = [
  "#ifdef GL_FRAGMENT_PRECISION_HIGH",
  "precision highp float;",
  "#else",
  "precision mediump float;",
  "#endif",
  "#define texture texture2D",
  "#define o gl_FragColor",
  "#define tanh fcTanh",
  "float fcTanh(float x){ float e = exp(2.0*clamp(x, -4.5, 4.5)); return (e - 1.0)/(e + 1.0); }",
  "vec3 fcTanh(vec3 x){ vec3 e = exp(2.0*clamp(x, -4.5, 4.5)); return (e - 1.0)/(e + 1.0); }"
].join("\n");
function glsl(src, frag){
  if(GL2) return src;
  src = src.replace("#version 300 es", "");
  if(frag){
    return src
      .replace("precision highp float;", GLSL100_FRAG_HEAD)
      .replace(/\bin vec2 v;/, "varying vec2 v;")
      .replace(/\bout vec4 o;/, "");
  }
  return src
    .replace(/\bin vec2 a;/, "attribute vec2 a;")
    .replace(/\bout vec2 v;/, "varying vec2 v;");
}
function compile(type, src){
  const sh = gl.createShader(type);
  gl.shaderSource(sh, glsl(src, type === gl.FRAGMENT_SHADER));
  gl.compileShader(sh);
  if(!gl.getShaderParameter(sh, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(sh));
  return sh;
}
function program(fsrc){
  const pr = gl.createProgram();
  gl.attachShader(pr, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(pr, compile(gl.FRAGMENT_SHADER, fsrc));
  gl.bindAttribLocation(pr, 0, "a");
  gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr, gl.LINK_STATUS))
    throw new Error(gl.getProgramInfoLog(pr));
  return pr;
}

/* Every GL object that does not depend on the canvas size: the programs, their
   uniforms, the triangle, the stand-in texture. Built once at start-up — and
   again if the context is LOST and restored (see the handlers after the main
   loop), because a restored context has none of the old objects in it. */
let progSeed, progFb, progDisp, progCopy, emptyTex;
const U = { seed:{}, fb:{}, disp:{}, copy:{} };
function uni(pr, name){ return gl.getUniformLocation(pr, name); }
function initGL(){
  progSeed = program(FRAG_SEED);
  progFb   = program(FRAG_FEEDBACK);
  progDisp = program(FRAG_DISPLAY);
  progCopy = program(FRAG_COPY);

  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  U.seed = { time:uni(progSeed,"uTime"), aspect:uni(progSeed,"uAspect") };
  U.disp = { tex:uni(progDisp,"uTex"), px:uni(progDisp,"uPx"), bloom:uni(progDisp,"uBloom"), scan:uni(progDisp,"uScan"), lines:uni(progDisp,"uLines") };
  U.copy = { tex:uni(progCopy,"uTex") };
  U.fb = {};
  ["uPrev","uDelay","uCustom","uCenter","uPx","uTime","uAspect","uZoom","uRot","uWarp","uPan",
   "uBright","uContrast","uSat","uHue","uGain","uSharp","uBleed","uDelayMix","uEdge","uKaleido",
   "uMirrorX","uInvert","uSeedShape","uHasCustom","uSeedAmt","uSeedSize","uSeedPos"]
    .forEach(n => U.fb[n] = uni(progFb, n));

  /* Stand-in for the custom-shape sampler while nothing has been uploaded.
     It must not be a ring texture: sampling the framebuffer we are drawing
     into is a feedback loop, and that draw comes back as garbage. */
  emptyTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, emptyTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE,
                new Uint8Array([0,0,0,0]));
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}
initGL();

/* ---------- ring of framebuffers (ping-pong + delay history) ---------- */
/* RING_MAX is what the Delay knob's ceiling needs: fourteen frames of history
   plus the one being read and the one being written. The ring is only ever
   allocated as deep as the CURRENT delay setting needs, though — every slot is
   a full render target, so sixteen of them at 1280 is ~47 MB of GPU memory,
   while at rest (delay off, which is the default) two of them is ~6 MB. On a
   phone that difference is the difference between running and having the
   driver evict something mid-frame. */
const RING_MAX = 16;
let ring = [];
let W = 0, H = 0, head = 0;
function ringNeed(){ return Math.max(2, Math.min(RING_MAX, (P.delayFrames|0) + 2)); }

function makeTarget(w, h){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  // WebGL1 has no sized formats; its RGBA/UNSIGNED_BYTE is the same RGBA8.
  gl.texImage2D(gl.TEXTURE_2D, 0, GL2 ? gl.RGBA8 : gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  return {tex, fbo};
}

/* Straight blit of one ring texture into another, at whatever size the
   destination is — the sampler's own LINEAR filter does the scaling. */
function copyInto(dst, srcTex, w, h){
  gl.useProgram(progCopy);
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fbo);
  gl.viewport(0, 0, w, h);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, srcTex);
  gl.uniform1i(U.copy.tex, 0);
  drawQuad();
}

/* ------------------------------------------------------------------ */
/*  Adaptive quality                                                   */
/*                                                                     */
/*  The feedback loop is pinned to 60 Hz, so "smooth" means one step    */
/*  landing per display frame. A device that cannot manage that at full */
/*  resolution has only two ways to fail — fall behind wall clock, or   */
/*  stutter — and neither is acceptable, so it takes the third: ask the */
/*  GPU for fewer pixels until it keeps up, and hand them back once     */
/*  there is headroom again. The picture survives the change (see       */
/*  allocate below), so this is invisible apart from the softening.     */
/*                                                                     */
/*  It is a MULTIPLIER on the Resolution knob, not a replacement for    */
/*  it: turning that knob is the user saying what they want, so doing   */
/*  so resets this back to full and lets it re-measure from there.      */
/* ------------------------------------------------------------------ */
const QUALITY = [1, 0.85, 0.72, 0.6, 0.5];
let qi = 0;                        // index into QUALITY; 0 is "all of it"
const SAMPLE_FRAMES = 60;          // one measurement window, about a second
const SLOW_MS = 20;                // worse than ~50 fps: not keeping up
const FAST_MS = 17.2;              // better than ~58 fps: room to give back
const RECOVER_WINDOWS = 8;         // ...sustained this long before giving it
const SETTLE_MS = 1500;            // a rebuild is itself a hitch; don't read it
const STALL_MS = 100;              // longer than this is a stall, not a frame
let samples = 0, sampleSum = 0, goodWindows = 0;
let lastDownAvg = 0;
let adaptOff = false;
let settleUntil = 0;

function resetAdaptive(){
  qi = 0; samples = 0; sampleSum = 0; goodWindows = 0;
  lastDownAvg = 0; adaptOff = false;
}

function tune(avg){
  if(avg > SLOW_MS && qi < QUALITY.length - 1){
    /* Did the last reduction actually buy anything? If it did not, this is not
       a GPU short of time — it is a display that simply does not run at 60 Hz
       (a 50 Hz panel, a power-saving mode, a throttled background window).
       Fewer pixels cannot fix that, so put them back and stop trying, rather
       than grinding all the way down to the floor for nothing. */
    if(lastDownAvg && avg > lastDownAvg * 0.95){
      qi = Math.max(0, qi - 1);
      adaptOff = true;
      allocate();
      return;
    }
    lastDownAvg = avg;
    qi++;
    goodWindows = 0;
    allocate();
  } else if(avg < FAST_MS){
    lastDownAvg = 0;
    if(qi > 0 && ++goodWindows >= RECOVER_WINDOWS){
      goodWindows = 0;
      qi--;
      allocate();
    }
  } else {
    goodWindows = 0;                // in the dead band: leave it where it is
  }
}

function allocate(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const scale = P.res * QUALITY[qi];
  let w = Math.max(2, Math.round(window.innerWidth  * dpr * scale));
  let h = Math.max(2, Math.round(window.innerHeight * dpr * scale));
  /* A phone cannot show 1280 of anything and is holding the browser and the
     rest of the page in the same GPU budget, so a coarse pointer caps lower. */
  const cap = COARSE ? 960 : 1280;
  const m = Math.max(w, h);
  if(m > cap){ w = Math.max(2, Math.round(w * cap/m)); h = Math.max(2, Math.round(h * cap/m)); }
  const n = ringNeed();
  if(w === W && h === H && n === ring.length) return;

  const old = ring, oldN = old.length, oldHead = head;
  const next = [];
  for(let i = 0; i < n; i++) next.push(makeTarget(w, h));
  /* Drop every binding before drawing into the new targets — and before the
     old ones are deleted out from under a live one. */
  for(let u = 0; u < 3; u++){
    gl.activeTexture(gl.TEXTURE0 + u);
    gl.bindTexture(gl.TEXTURE_2D, null);
  }

  ring = next; W = w; H = h;
  cvs.width = w; cvs.height = h;

  if(oldN){
    /* Carry the picture across instead of reseeding it. Resizing the window,
       or moving Resolution or Delay, used to throw the frame away and start
       again from noise — and adaptive quality would have done that on its own,
       unasked, mid-session. Slot n-1 gets the newest frame, n-2 the one before
       it and so on, because that is what step() and present() read relative to
       head, which restarts at 0. Where the new ring is DEEPER than the old
       one the oldest frame is repeated into the rest, so a delay line that has
       just been lengthened reads a held frame rather than noise. */
    for(let k = 0; k < n; k++){
      const j = Math.min(k, oldN - 1);
      copyInto(next[n - 1 - k], old[(oldHead + oldN - 1 - j) % oldN].tex, w, h);
    }
    head = 0;
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, null);
  } else {
    head = 0;
    seedAll();
  }

  old.forEach(t => { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fbo); });
  dirty = true;
  settleUntil = performance.now() + SETTLE_MS;
}

/* ---------- state ---------- */
let playing = true;
/* Paused, the loop computes nothing — so the only things that can change what
   is ON SCREEN are the display shader's own knobs (bloom, scanlines) and the
   canvas being resized. Without this, pausing to look at a frame still cost a
   full-screen fragment pass sixty times a second, bloom's nine texture fetches
   per pixel included: real battery, for an image that is not moving. Set
   generously — the cost of a redundant present is one frame, the cost of a
   missed one is a stale picture. */
let dirty = true;
let gen = 0;
const center = {x:0.5, y:0.5};      // vanishing point, fixed at frame centre
const seedPos = {x:0.5, y:0.5};     // where the seed lands this frame
const seedAnchor = {x:0.5, y:0.5};  // where the user put it
let pulse = 0;                      // decaying one shot
let drawHold = 0;                   // sustained while the right button is down
let customTex = null, hasCustom = 0;
const startT = performance.now();

/* Keyframe timeline state — declared up here, not with the rest of it (see
   "Keyframe timeline" further down), because wake() and the legend read it,
   and wake() first runs before that section has. */
let tlOpen = false;                 // the editor panel is showing
let tlRunning = true;               // the playhead moves (while the loop plays)
let tlTime = 0, tlLen = 600;        // FRAMES — ticks of the loop, 60 a second
let tlPointerIn = false;            // a mouse is resting on the open panel
let tlTyping = false;               // the length box has focus
let tlActiveK = null;               // the knob last pressed (its lane glows, or is the draft)
let tracks = {};                    // knob key -> [{t, v}], sorted by t, never empty;
                                    // key order IS lane order (the order they were automated)
const TL_KEYABLE = {};              // knob key -> its cell, for every knob it can key

function drawQuad(){ gl.drawArrays(gl.TRIANGLES, 0, 3); }

function seedInto(idx){
  gl.useProgram(progSeed);
  gl.bindFramebuffer(gl.FRAMEBUFFER, ring[idx].fbo);
  gl.viewport(0, 0, W, H);
  gl.uniform1f(U.seed.time, (performance.now()-startT)/1000);
  gl.uniform1f(U.seed.aspect, W/H);
  drawQuad();
}
function seedAll(){
  /* Drop any ring textures still bound from the last step. Seeding draws into
     those same framebuffers, and leaving them bound reads as a feedback loop. */
  for(let u = 0; u < 3; u++){
    gl.activeTexture(gl.TEXTURE0 + u);
    gl.bindTexture(gl.TEXTURE_2D, null);
  }
  for(let i=0;i<ring.length;i++) seedInto(i);
  gen = 0;
  dirty = true;
}

/* ---------- feedback step ---------- */
function step(t){
  const N = ring.length;            // the ring is sized to the delay in use
  const prevIdx  = (head + N - 1) % N;
  const dF = Math.min(P.delayFrames|0, N - 2);
  const delayIdx = (head + N - 1 - dF) % N;

  gl.useProgram(progFb);
  gl.bindFramebuffer(gl.FRAMEBUFFER, ring[head].fbo);
  gl.viewport(0, 0, W, H);

  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, ring[prevIdx].tex);
  gl.uniform1i(U.fb.uPrev, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, ring[delayIdx].tex);
  gl.uniform1i(U.fb.uDelay, 1);
  gl.activeTexture(gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_2D, customTex || emptyTex);
  gl.uniform1i(U.fb.uCustom, 2);

  /* The seed stays where it was placed. Seed motion orbits it from there,
     so at zero drift it does not move at all. */
  const d = P.seedDrift;
  seedPos.x = seedAnchor.x + Math.sin(t*0.7) * 0.30 * d;
  seedPos.y = seedAnchor.y + Math.cos(t*0.53) * 0.30 * d;

  gl.uniform2f(U.fb.uCenter, center.x, 1.0 - center.y);
  gl.uniform2f(U.fb.uPx, 1/W, 1/H);
  gl.uniform1f(U.fb.uTime, t);
  gl.uniform1f(U.fb.uAspect, W/H);
  gl.uniform1f(U.fb.uZoom, P.zoom);
  gl.uniform1f(U.fb.uRot, P.rot * Math.PI/180);
  gl.uniform1f(U.fb.uWarp, P.warp);
  gl.uniform2f(U.fb.uPan, P.panX, -P.panY);
  gl.uniform1f(U.fb.uBright, P.bright);
  gl.uniform1f(U.fb.uContrast, P.contrast);
  gl.uniform1f(U.fb.uSat, P.sat);
  gl.uniform1f(U.fb.uHue, P.hue * Math.PI/180);
  gl.uniform1f(U.fb.uGain, P.decay);
  gl.uniform1f(U.fb.uSharp, P.sharp);
  gl.uniform1f(U.fb.uBleed, P.bleed);
  gl.uniform1f(U.fb.uDelayMix, dF > 0 ? P.delayMix : 0.0);
  gl.uniform1i(U.fb.uEdge, P.edge|0);
  gl.uniform1i(U.fb.uKaleido, P.kaleido|0);
  gl.uniform1i(U.fb.uMirrorX, P.mirrorX|0);
  gl.uniform1i(U.fb.uInvert, P.invert|0);
  gl.uniform1i(U.fb.uSeedShape, P.seedShape|0);
  gl.uniform1i(U.fb.uHasCustom, hasCustom);
  gl.uniform1f(U.fb.uSeedAmt, P.seedAmt + pulse + drawHold);
  gl.uniform1f(U.fb.uSeedSize, P.seedSize);
  gl.uniform2f(U.fb.uSeedPos, seedPos.x, 1.0 - seedPos.y);

  drawQuad();

  head = (head + 1) % N;
  gen++;
  pulse *= 0.80;
}

function present(){
  const outIdx = (head + ring.length - 1) % ring.length;
  gl.useProgram(progDisp);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, cvs.width, cvs.height);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, ring[outIdx].tex);
  gl.uniform1i(U.disp.tex, 0);
  gl.uniform2f(U.disp.px, 1/W, 1/H);
  gl.uniform1f(U.disp.bloom, P.bloom);
  gl.uniform1f(U.disp.scan, P.scan);
  gl.uniform1f(U.disp.lines, H);
  drawQuad();
}

/* ---------- main loop ---------- */
/* The real rig runs at video rate, so the loop is pinned to 60 Hz —
   otherwise a 144 Hz display would burn through generations 2.4x faster. */
const STEP_MS = 1000/60;
let last = performance.now(), acc = 0;
function frame(now){
  requestAnimationFrame(frame);
  if(glLost){ last = now; return; }   // nothing to draw into until it's restored
  const raw = now - last; last = now;
  let dt = Math.min(raw, 250);
  /* Snap a near-60 Hz frame to exactly one step. A display that calls itself
     60 Hz actually delivers 16.60-16.75 ms, and rAF adds its own jitter on top
     — a bare accumulator turns that into a 1,1,0,1,1,0 step pattern. The
     average rate is right and the picture still advances unevenly, and uneven
     is exactly what reads as dropped frames. Only JITTER is absorbed (+-12%),
     never a real difference in refresh rate: a 50 Hz display still goes
     through the accumulator and still runs at wall-clock speed. */
  if(dt > STEP_MS * 0.88 && dt < STEP_MS * 1.12) dt = STEP_MS;
  const t = (now - startT) / 1000;
  let stepped = 0;
  if(playing){
    acc += dt;
    const n = Math.max(1, P.iters|0);
    /* Two caps, not one. Ticks bound how far the loop will chase a late frame;
       PASSES bounds the GPU work it can spend doing so, because Loops/frame
       multiplies every tick — under the old tick-only guard, iters 3 could
       fire twelve full-screen passes inside one frame, which guaranteed the
       next frame was late as well. That is the spiral this stops; sustained
       slowness is answered by dropping quality instead (see tune). */
    let ticks = 0, passes = 0;
    while(acc >= STEP_MS && ticks < 4 && passes + n <= 8){
      /* The timeline runs on the loop's own clock, one tick at a time, so an
         animation stays in step with the picture it is animating — a device
         that falls behind falls behind in both together. */
      tlTick();
      for(let i = 0; i < n; i++) step(t);
      passes += n; ticks++; stepped++;
      acc -= STEP_MS;
    }
    if(acc > STEP_MS*4) acc = 0;
    /* Measure only while the loop is actually working, only once a rebuild has
       settled, and never across a stall — a tab coming back to the front is
       not a frame rate. */
    if(!adaptOff && now >= settleUntil && raw < STALL_MS){
      sampleSum += raw; samples++;
      if(samples >= SAMPLE_FRAMES){
        const avg = sampleSum / samples;
        samples = 0; sampleSum = 0;
        tune(avg);
      }
    }
  }
  /* Draw only when there is something new to draw: a step ran, or something
     outside the loop marked the frame dirty (a display knob, a resize, a tab
     coming back to the front). The loop is deliberately pinned to 60 Hz, so on
     a 144 Hz display more than half of these frames used to re-present an
     image identical to the one already on screen — and while PAUSED, all of
     them did. */
  if(stepped || dirty){ present(); dirty = false; }
  if(tlOpen) tlDrawHead();
}
/* A tab coming back to the front has been composited by someone else in the
   meantime; redraw once rather than trusting what is left on the canvas. */
document.addEventListener("visibilitychange", () => { if(!document.hidden) dirty = true; });

/* ---------- losing the GPU ----------
   A browser takes a WebGL context away when the GPU resets, when memory runs
   short, or — on a phone — when the app goes to the background for a while,
   and older devices do all three far more often. Every texture, program and
   framebuffer goes with it. Unhandled, the canvas simply stayed black for the
   rest of the visit: the loop kept issuing draws into a context that no
   longer existed, and nothing ever said so.
   preventDefault() on the loss is what asks for it back; when it comes back,
   everything is built again from scratch — the programs (initGL), a fresh
   ring, reseeded since there is no picture left to carry across, and the
   uploaded shape from the copy kept for exactly this (customSrc). The knobs
   are JavaScript state and never went anywhere. */
let glLost = false;
cvs.addEventListener("webglcontextlost", e => {
  e.preventDefault();
  glLost = true;
});
cvs.addEventListener("webglcontextrestored", () => {
  initGL();
  ring = [];                      // the old targets died with the context
  W = 0; H = 0; head = 0;
  customTex = null;
  if(customSrc) uploadCustom(customSrc);
  glLost = false;
  allocate();                     // an empty ring, so this reseeds
  dirty = true;
});

/* ------------------------------------------------------------------ */

/*  Columns are the groups, top-to-bottom then left-to-right.          */

    {t:"knob", k:"seedSize",  label:"Injection size", min:0.005, max:0.30, step:0.001, fmt:f3},
    {t:"knob", k:"seedDrift", label:"Seed motion",    min:0, max:1, step:0.01, fmt:f2},
    {t:"sel",  k:"seedShape", label:"Injected shape", options:SHAPES}
  ]},
  { id:"display", name:"Display", accent:"#a72fdd", items:[
    {t:"hdr", icon:"display.png", label:"Display", act:"fullscreen", aria:"Toggle fullscreen"},
    {t:"knob", k:"bloom", label:"Bloom",         min:0, max:1, step:0.01, fmt:f2},
    {t:"knob", k:"scan",  label:"Scanlines",     min:0, max:1, step:0.01, fmt:f2},
    {t:"knob", k:"iters", label:"Loops / frame", min:1, max:3, step:1, fmt:v=>v+"×"},
    {t:"knob", k:"res",   label:"Resolution",    min:0.4, max:1.0, step:0.05, fmt:v=>Math.round(v*100)+"%"}
  ]}
];

/* ------------------------------------------------------------------ */
/*  Console build                                                      */
/* ------------------------------------------------------------------ */
const controlsBarEl = document.getElementById("controlsBar"); // the Controls group itself (it's a .col already, in the markup)
const knobPanelEl = document.getElementById("knobPanel");     // everything else: Camera/Signal/Feedback/Seed/Display
const cells = [];               // every interactive control
let selected = null;            // cell object, or null
let hovered  = null;
let dragCount = 0;              // knobs mid-adjustment; holds the hud open

const SWEEP = 270;              // -135deg .. +135deg

function angleFor(c){
  let t;
  if(c.def.t === "sel"){
    const n = optionsOf(c).length;
    t = n > 1 ? P[c.def.k] / (n - 1) : 0.5;
  } else {
    const d = c.def;
    t = (P[d.k] - d.min) / (d.max - d.min);
  }
  return -SWEEP/2 + Math.max(0, Math.min(1, t)) * SWEEP;
}
function optionsOf(c){
  const o = c.def.options;
  return (c.def.k === "seedShape" && hasCustom) ? o.concat(["custom"]) : o;
}

function img(src, cls){
  const e = document.createElement("img");
  e.src = "/fractalcrack/assets/" + src;
  e.alt = "";
  if(cls) e.className = cls;
  return e;
}

GROUPS.forEach(g => {
  // Controls IS #controlsBar (see the markup) — everyone else gets a fresh
  // .col appended into #knobPanel, same as every group used to get appended
  // straight into #console.
  const isControls = g.id === "controls";
  const col = isControls ? controlsBarEl : document.createElement("div");
  if(!isControls) col.className = "col g-" + g.id;

  g.items.forEach(def => {
    /* a header is inert unless it carries an action of its own */
    const inert = (def.t === "hdr" && !def.act);
    const cell = document.createElement(inert ? "div" : "button");
    cell.className = "cell" + (inert ? " hdr" : "");
    if(!inert){ cell.type = "button"; }

    const obj = {def, group:g, el:cell, hand:null};

    if(def.t === "knob" || def.t === "sel"){
      cell.appendChild(img("knob-base-red.png", "tint"));
      const hand = img("knob-hand-red.png", "tint hand");
      cell.appendChild(hand);
      obj.hand = hand;
      cell.setAttribute("aria-label", def.label);
    } else {
      cell.appendChild(img("blank-circle-red.png", "tint"));
      const glyph = img(def.icon, "glyph");
      cell.appendChild(glyph);
      obj.glyph = glyph;
      cell.setAttribute("aria-label", def.aria || def.label);
      if(inert) cell.setAttribute("role", "img");
    }

    col.appendChild(cell);
    cells.push(obj);
    wire(obj);
  });

  if(!isControls) knobPanelEl.appendChild(col);
});

function refreshHands(){
  /* Called on EVERY value change, which during a drag is every pointermove.
     Writing a transform into all twenty-nine hands each time repainted all
     twenty-nine drop-shadowed cells to move exactly one of them. Compare the
     string that would be written — floats out of angleFor() differ in noise
     the rendered value doesn't. */
  cells.forEach(c => {
    if(!c.hand) return;
    const deg = angleFor(c).toFixed(2);
    if(deg === c.deg) return;
    c.deg = deg;
    c.hand.style.transform = "rotate(" + deg + "deg)";
  });
  dirty = true;                       // a display knob may have moved the frame
}
function refreshKnobs(){
  refreshHands();
  if(legendTarget()) drawLegend(legendTarget());
}

/* ------------------------------------------------------------------ */
/*  Legend                                                             */
/* ------------------------------------------------------------------ */
const legend  = document.getElementById("legend");
const lgGroup = document.getElementById("lgGroup");
const lgTitle = document.getElementById("lgTitle");
const lgValue = document.getElementById("lgValue");
const lgOpts  = document.getElementById("lgOpts");
const lgLock  = document.getElementById("lgLock");
const lgTl    = document.getElementById("lgTl");
const lgClose = document.getElementById("lgClose");

lgClose.addEventListener("click", e => { e.stopPropagation(); select(null); });

/* Touch has no passive hover, so PRESSING a control is what previews it: hold
   a knob and it appears in the legend, keep holding and drag up/down to move
   its value, let go and the legend follows whatever is selected again (see
   wire()). Header icons — inert, with no tap action of their own — get the
   same press-to-read, which is what makes them discoverable at all on a phone.
   Every cell's own pointerenter/leave does the work; touch fires those either
   side of the press, and pointer capture suppresses the leave for the duration
   of a drag, which is exactly the behaviour wanted.
 
   This used to be a roaming preview instead: a pointermove listener here that
   elementFromPoint'ed whatever the finger was over. It was NOT inert during a
   knob drag the way its comment claimed — pointer capture RETARGETS move
   events to the knob, it does not stop them bubbling on up to this element —
   so dragging a knob upwards handed the legend to whichever cell the finger
   had crossed onto, or blanked it once the finger left the sheet. The value
   being changed was the one thing you could not read while changing it. */

function legendTarget(){ return hovered || selected; }

function drawLegend(c){
  if(editingCell && editingCell !== c) cancelEditValue(); // switched target mid-edit: discard, don't guess at a commit
  legend.style.setProperty("--accent", c.group.accent);
  lgGroup.textContent = c.def.t === "hdr" ? "Section" : c.group.name;
  lgTitle.textContent = c.def.label;
  lgOpts.textContent = "";
  const locked = (selected === c);

  if(c.def.t === "knob"){
    if(editingCell !== c) lgValue.textContent = c.def.fmt(P[c.def.k]);
    lgValue.style.display = "";
    lgValue.classList.toggle("editable", locked);
  } else if(c.def.t === "sel"){
    lgValue.style.display = "none";
    optionsOf(c).forEach((name, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = name;
      b.setAttribute("aria-pressed", String(i === P[c.def.k]));
      if(i === P[c.def.k]) b.className = "on";
      b.addEventListener("click", ev => {
        ev.stopPropagation();
        setValue(c, i);
        select(c);                    // stay locked so you can keep picking
      });
      lgOpts.appendChild(b);
    });
  } else {
    /* buttons carry no value modifier */
    lgValue.style.display = "none";
  }
  lgLock.textContent = locked
    ? (c.def.t === "sel" ? "locked — click an option"
       : c.def.t === "knob" ? "locked — drag, or tap the value to type one"
       : "")
    : "";
  lgTl.textContent = tlHint(c);
  lgClose.hidden = !locked;           // only offer it when there is a lock to release
  legend.classList.add("show");
  tlSyncFocus();
}
function hideLegend(){
  cancelEditValue(); legend.classList.remove("show"); lgClose.hidden = true;
  tlSyncFocus();
}

function updateLegend(){
  const t = legendTarget();
  if(t) drawLegend(t); else hideLegend();
}

function select(c){
  if(selected) selected.el.classList.remove("sel");
  selected = c;
  if(c){ c.el.classList.add("sel"); tlActivate(c); }
  updateLegend();
}

/* ------------------------------------------------------------------ */
/*  Type an exact value — click/tap lg-value while a knob is locked.   */
/*  Works identically on mouse and touch: a tap both focuses the input */
/*  (bringing up the on-screen keyboard) and is a user gesture, which  */
/*  is all focus()-to-open-keyboard needs on every mobile browser.     */
/* ------------------------------------------------------------------ */
let editingCell = null;
const lgValueInput = document.createElement("input");
lgValueInput.type = "text";
lgValueInput.className = "lg-value lg-value-edit";
lgValueInput.autocomplete = "off";
lgValueInput.spellcheck = false;

function cancelEditValue(){
  if(!editingCell) return;
  editingCell = null;
  if(lgValueInput.isConnected) lgValueInput.replaceWith(lgValue);
}
function commitEditValue(){
  if(!editingCell) return;
  const c = editingCell;
  const n = parseFloat(lgValueInput.value);
  cancelEditValue();
  if(!Number.isNaN(n)){
    setValue(c, n);                 // already clamps to [min,max] and rounds to step
    select(c);                      // stays locked, same as picking a sel option does
  } else if(selected === c){
    drawLegend(c);                  // bad input: put the real value back on screen
  }
}
lgValueInput.addEventListener("keydown", e => {
  e.stopPropagation();              // arrow keys etc. must not reach the knob underneath
  if(e.key === "Enter"){ e.preventDefault(); lgValueInput.blur(); }
  else if(e.key === "Escape"){ e.preventDefault(); cancelEditValue(); updateLegend(); }
});
lgValueInput.addEventListener("blur", commitEditValue);
lgValueInput.addEventListener("pointerdown", e => e.stopPropagation());
lgValueInput.addEventListener("click", e => e.stopPropagation());
// Bookend the edit with the idle timer: focus clears any countdown already
// scheduled (wake() won't set a new one while editingCell is set), and the
// blur below runs AFTER commitEditValue has cleared editingCell, so it
// starts the countdown again from the moment the box is done with.
lgValueInput.addEventListener("focus", () => wake());
lgValueInput.addEventListener("blur", () => wake());

lgValue.addEventListener("click", e => {
  const c = selected;
  if(!c || c.def.t !== "knob") return;   // only a locked knob has a min/max to type into
  e.stopPropagation();
  editingCell = c;
  lgValueInput.value = String(P[c.def.k]);
  // iOS's decimal keypad has no minus key at all — anything with a negative
  // range needs the full keyboard instead, or a negative value is unreachable.
  lgValueInput.inputMode = c.def.min < 0 ? "text" : "decimal";
  lgValue.replaceWith(lgValueInput);
  lgValueInput.focus();
  lgValueInput.select();
});

/* ------------------------------------------------------------------ */
/*  Control wiring                                                     */
/* ------------------------------------------------------------------ */
function setValue(c, val){
  const d = c.def;
  const before = P[d.k];
  if(d.t === "sel"){
    const n = optionsOf(c).length;
    P[d.k] = Math.max(0, Math.min(n-1, Math.round(val)));
  } else {
    let v = Math.max(d.min, Math.min(d.max, val));
    v = Math.round(v / d.step) * d.step;
    v = Math.max(d.min, Math.min(d.max, v));
    P[d.k] = parseFloat(v.toPrecision(10));
    /* Both of these change what has to be allocated: res the size of every
       target, delayFrames how many of them there are. Debounced through
       scheduleAlloc so dragging a knob across its range rebuilds once at the
       end rather than at every value on the way. */
    if(d.k === "res" || d.k === "delayFrames") scheduleAlloc();
    /* Moving Resolution is the user saying what they want — let the adaptive
       multiplier start again from full, relative to the value they just set. */
    if(d.k === "res") resetAdaptive();
  }
  refreshKnobs();
  /* Every hand on a knob comes through here — drag, wheel, arrow keys, a
     typed value, a picked option, a double-click home — so this is the one
     place the timeline needs to hear about it. Only a real CHANGE keys: a
     click that merely selects a knob jitters a pixel or two on the way. */
  if(P[d.k] !== before) tlOnKnob(c, before);
}

function wire(c){
  const el = c.el, d = c.def;

  el.addEventListener("pointerenter", () => { hovered = c; updateLegend(); });
  el.addEventListener("pointerleave", () => { if(hovered === c) hovered = null; updateLegend(); });

  if(d.t === "hdr"){                     // section label: legend on hover
    if(d.act) el.addEventListener("click", () => doAction(d.act, c));
    return;
  }

  if(d.t === "btn"){
    el.addEventListener("click", () => doAction(d.act, c));
    return;
  }

  /* knob / selector: vertical drag, click to lock, double-click to default */
  let dragging = false, startY = 0, startVal = 0, moved = 0;

  el.addEventListener("pointerdown", e => {
    dragging = true; moved = 0;
    startY = e.clientY;
    startVal = P[d.k];
    /* Touch has no passive hover: the press IS the hover, so the knob goes
       into the legend now and stays there for as long as the finger is down —
       which is the whole drag. (A mouse already got here through pointerenter;
       setting it again is a no-op.) */
    hovered = c; updateLegend();
    tlActivate(c);                      // pressing a knob points the timeline at it
    dragCount++; wake();                // hold the hud open while adjusting
    // Guarded like the release below: capture is a nicety (it's what keeps the
    // drag — and the legend — attached to this knob once the finger leaves it),
    // and a throw here would take the preventDefault below down with it.
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
    e.preventDefault();
  });

  el.addEventListener("pointermove", e => {
    if(!dragging) return;
    const dy = startY - e.clientY;
    moved = Math.max(moved, Math.abs(dy));
    const fine = e.shiftKey ? 0.2 : 1;
    if(d.t === "sel"){
      const n = optionsOf(c).length;
      setValue(c, startVal + (dy / 150) * (n - 1) * fine);
    } else {
      setValue(c, startVal + (dy / 190) * (d.max - d.min) * fine);
    }
  });

  const end = e => {
    if(!dragging) return;
    dragging = false;
    dragCount = Math.max(0, dragCount - 1);
    /* Releasing a touch ends the "hover" it stood in for. Only refreshed here
       for a real DRAG: a tap is followed by a click that calls select(), which
       redraws the legend anyway, and hiding it in between would flash it. */
    if(e.pointerType === "touch" && hovered === c){
      hovered = null;
      if(moved > 3) updateLegend();
    }
    wake();                             // restart the idle countdown
    try{ el.releasePointerCapture(e.pointerId); }catch(_){}
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);

  el.addEventListener("click", e => {
    if(moved > 3) return;                 // that was a drag, not a click
    select(selected === c ? null : c);
  });

  el.addEventListener("dblclick", e => {
    e.preventDefault();
    setValue(c, DEFAULTS[d.k]);
    select(c);                            // stays selected after a reset
  });

  el.addEventListener("wheel", e => {
    if(selected !== c && hovered !== c) return;
    e.preventDefault();
    const dir = e.deltaY < 0 ? 1 : -1;
    if(d.t === "sel") setValue(c, P[d.k] + dir);
    else setValue(c, P[d.k] + dir * d.step * (e.shiftKey ? 1 : 5));
  }, {passive:false});

  el.addEventListener("keydown", e => {
    let dir = 0;
    if(e.key === "ArrowUp" || e.key === "ArrowRight") dir = 1;
    else if(e.key === "ArrowDown" || e.key === "ArrowLeft") dir = -1;
    else return;
    e.preventDefault();
    if(d.t === "sel") setValue(c, P[d.k] + dir);
    else setValue(c, P[d.k] + dir * d.step * (e.shiftKey ? 1 : 5));
  });
}

/* ------------------------------------------------------------------ */
/*  Actions                                                            */
/* ------------------------------------------------------------------ */
const fileIn = document.getElementById("fileIn");
let playGlyph = null;
cells.forEach(c => { if(c.def.act === "play") playGlyph = c.glyph; });

function setPlaying(v){
  playing = v;
  dirty = true;
  if(playGlyph) playGlyph.src = "/fractalcrack/assets/" + (v ? "pause.png" : "play.png");
}

/* Drop an uploaded shape and fall back to a built-in one. Deliberately not
   inside seedAll(), which also runs on resize — that must not bin the upload. */
function clearCustom(){
  if(!hasCustom) return;
  hasCustom = 0;
  customSrc = null;
  if(customTex){ gl.deleteTexture(customTex); customTex = null; }
  if(P.seedShape === CUSTOM_INDEX) P.seedShape = DEFAULTS.seedShape;
  refreshKnobs();
}

function doAction(act, c){
  if(act === "play")   setPlaying(!playing);
  else if(act === "reset"){ clearCustom(); seedAll(); tlRestart(); }
  else if(act === "inject") pulse = 0.5;
  else if(act === "random") randomize();
  else if(act === "upload") fileIn.click();
  else if(act === "fullscreen") toggleFullscreen();
  else if(act === "photo") enterPhoto();
}

function toggleFullscreen(){
  const root = document.documentElement;
  if(!document.fullscreenElement){
    if(root.requestFullscreen) root.requestFullscreen();
  } else if(document.exitFullscreen){
    document.exitFullscreen();
  }
}

function randomize(){
  const rr = (a, b) => a + Math.random()*(b - a);
  clearCustom();
  const outward = Math.random() < 0.65;
  P.zoom = outward ? rr(1.003, 1.020) : rr(0.978, 0.996);
  P.edge = outward ? (Math.random() < 0.7 ? 3 : 1) : (Math.random() < 0.7 ? 0 : 2);
  P.rot = rr(-4, 4);
  P.panX = rr(-0.02, 0.02);
  P.panY = rr(-0.02, 0.02);
  P.warp = rr(-0.2, 0.2);
  P.contrast = rr(0.9995, 1.0030);
  P.sharp = rr(0.15, 0.65);
  P.sat = rr(0.9990, 1.0040);
  P.hue = rr(-4, 4);
  P.decay = rr(0.9975, 1.0008);
  P.bright = rr(-0.0006, 0.0006);
  P.bleed = rr(0.001, 0.010);
  P.delayFrames = Math.random() < 0.5 ? 0 : Math.floor(rr(2, 13));
  P.delayMix = rr(0.15, 0.55);
  P.kaleido = Math.random() < 0.6 ? 0 : Math.floor(rr(2, 12));
  P.seedShape = 1 + Math.floor(Math.random()*4);
  P.seedAmt = rr(0.10, 0.45);
  P.seedSize = rr(0.02, 0.12);
  /* Seed motion is left alone on purpose: randomising it sets the injection
     wandering, and where it sits is the user's call, not the dice. */
  refreshKnobs();
  scheduleAlloc();                   // delayFrames moved: the ring is resized
}

/* The uploaded shape as a texture. Kept as `customSrc` too, so a lost-and-
   restored context can put it back (see "losing the GPU"). */
let customSrc = null;
function uploadCustom(src){
  if(!customTex) customTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, customTex);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}
/* A shape this big covers three screen-heights at the largest Injection
   size, so there is nothing to see past it — and a phone photo is 12
   megapixels: a 48 MB texture, over an older GPU's size limit outright (it
   then fails silently and samples black) or enough to push the ring out of
   its memory. Anything larger is scaled down on the way in. */
const CUSTOM_MAX = Math.min(2048, gl.getParameter(gl.MAX_TEXTURE_SIZE) || 2048);

/* uploaded png becomes an injectable shape */
fileIn.addEventListener("change", () => {
  const f = fileIn.files && fileIn.files[0];
  if(!f) return;
  const url = URL.createObjectURL(f);
  const im = new Image();
  im.onload = () => {
    let src = im;
    const k = CUSTOM_MAX / Math.max(im.naturalWidth, im.naturalHeight);
    if(k < 1){
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(im.naturalWidth * k));
      c.height = Math.max(1, Math.round(im.naturalHeight * k));
      const cx = c.getContext("2d");
      cx.imageSmoothingQuality = "high";
      cx.drawImage(im, 0, 0, c.width, c.height);
      src = c;
    }
    customSrc = src;
    uploadCustom(src);
    hasCustom = 1;
    P.seedShape = CUSTOM_INDEX;          // custom appears and is selected
    URL.revokeObjectURL(url);
    refreshKnobs();
  };
  im.onerror = () => URL.revokeObjectURL(url);
  im.src = url;
  fileIn.value = "";
});

/* ------------------------------------------------------------------ */
/*  Canvas pointer                                                     */
/*  left held    — move the injection                                  */
/*  right click  — put the injection here and fire it                  */
/*  right dragged— keep firing along the path, drawing with it         */
/*  double click — send the injection back to the centre               */
/*  The two buttons are tracked separately so a right click still      */
/*  fires while the left button is being held.                         */
/* ------------------------------------------------------------------ */
let leftDown = false, rightDown = false;
const anyDown = () => leftDown || rightDown;

function placeSeed(e){
  seedAnchor.x = Math.min(1, Math.max(0, e.clientX / window.innerWidth));
  seedAnchor.y = Math.min(1, Math.max(0, e.clientY / window.innerHeight));
}
function duckHud(){
  // The knob sheet is something you are working IN, not a label glanced at —
  // taking it away because a finger also touched the canvas behind it would
  // close the menu out from under the hand holding it open.
  if(sheetOpen()) return;
  hud.classList.add("idle");        // out of the way while working on the canvas
  clearTimeout(idleTimer);
}
cvs.addEventListener("contextmenu", e => e.preventDefault());

cvs.addEventListener("pointerdown", e => {
  try{ cvs.setPointerCapture(e.pointerId); }catch(_){}
  if(e.button === 2){
    rightDown = true;
    placeSeed(e);                   // lands wherever the right click hits
    pulse = 0.35;                   // visible even for an instant click
    drawHold = 0.5;                 // held down, so a drag keeps drawing
    duckHud();
    return;
  }
  if(e.button !== 0) return;
  leftDown = true;
  placeSeed(e);
  duckHud();
});

cvs.addEventListener("pointermove", e => { if(anyDown()) placeSeed(e); });

cvs.addEventListener("pointerup", e => {
  if(e.button === 2){ rightDown = false; drawHold = 0; }
  else if(e.button === 0){ leftDown = false; }
  if(anyDown()) return;             // the other button is still down
  try{ cvs.releasePointerCapture(e.pointerId); }catch(_){}
  wake();                           // released: bring the hud back
});
cvs.addEventListener("pointercancel", () => {
  leftDown = rightDown = false; drawHold = 0; wake();
});

cvs.addEventListener("dblclick", () => {
  // A phone has no Escape key, so a double-tap is photo mode's way out there.
  // It takes priority: recentring the seed is not what someone staring at a
  // hidden hud is trying to do.
  if(photoMode){ exitPhoto(); return; }
  seedAnchor.x = 0.5; seedAnchor.y = 0.5;
});

/* Touch has no right button, so a SECOND simultaneous touch stands in for it
   — a common two-finger-for-secondary-action convention. Every touch already
   drives the block above too (it reports button 0 same as a left click, so
   one finger alone already moves the injection point); this only ADDS the
   "fire + keep drawing" behaviour once a second finger joins, and clears it
   as soon as the touch count drops back below two. Tracked independently of
   leftDown/rightDown above so neither block has to know about the other. */
const touchIds = new Set();
cvs.addEventListener("pointerdown", e => {
  if(e.pointerType !== "touch") return;
  touchIds.add(e.pointerId);
  if(touchIds.size === 2){
    rightDown = true;
    placeSeed(e);
    pulse = 0.35;
    drawHold = 0.5;
    duckHud();
  }
});
function releaseTouch(e){
  if(e.pointerType !== "touch") return;
  touchIds.delete(e.pointerId);
  if(touchIds.size < 2){
    rightDown = false; drawHold = 0;
    if(!anyDown()) wake();
  }
}
cvs.addEventListener("pointerup", releaseTouch);
cvs.addEventListener("pointercancel", releaseTouch);

/* ------------------------------------------------------------------ */
/*  Idle auto-hide                                                     */
/* ------------------------------------------------------------------ */
const hud = document.getElementById("hud");
let idleTimer = null;
/* The hud hides after two idle seconds whatever is selected. Two things hold
   it open: an adjustment actually in progress, and a value being typed into
   the legend. That second one matters on every platform — the legend lives
   INSIDE .hud, so letting the countdown run mid-edit fades the very box being
   typed into (and .hud.idle also kills pointer-events on it). On desktop it
   took a two-second pause mid-number to hit; on mobile it fired almost every
   time, because an on-screen keyboard generates no window keydown/pointer
   events to keep resetting the timer. */
const IDLE_MS = 2000;

/* ------------------------------------------------------------------ */
/*  Photo mode — the camera button                                     */
/*                                                                     */
/*  Puts the whole hud away for good and says so once, quietly, then    */
/*  fades that away too. Unlike the idle auto-hide, NOTHING brings the  */
/*  console back except leaving photo mode: moving the mouse, touching  */
/*  the canvas and turning the wheel are all things you want to be able */
/*  to do while the frame is clean, so wake() simply declines to run.   */
/* ------------------------------------------------------------------ */
const photoHint = document.getElementById("photoHint");
const PHOTO_HINT_MS = 1000;
let photoMode = false;
let photoHintTimer = null;

function showPhotoHint(){
  /* BACKSPACE, not Escape. Escape is spoken for: the Display header toggles
     real fullscreen, and there the browser takes Escape for itself before any
     page sees it — so the one key photo mode most needs is the one it cannot
     have. A phone has no Backspace key either, so a coarse pointer is told
     about the fallback instead; both are wired whatever the device. */
  photoHint.textContent = COARSE ? "double-tap to exit" : "press backspace to exit";
  photoHint.classList.add("show");
  clearTimeout(photoHintTimer);
  photoHintTimer = setTimeout(() => photoHint.classList.remove("show"), PHOTO_HINT_MS);
}
function enterPhoto(){
  if(photoMode) return;
  photoMode = true;
  select(null);                       // nothing left locked behind the curtain
  /* The camera button still holds focus from the click that got here, and the
     key handler below reads off document.body — without this the first press
     is spent on the button instead of on photo mode. */
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  hud.classList.add("idle");
  clearTimeout(idleTimer);
  showPhotoHint();
}
function exitPhoto(){
  if(!photoMode) return;
  photoMode = false;
  clearTimeout(photoHintTimer);
  photoHint.classList.remove("show");
  wake();
}

/* The knob sheet's class is toggled on every viewport, but it only MEANS
   anything where the sheet exists — this is the same query its CSS uses, so
   clicking the logo on a desktop can't quietly pin the hud open forever. */
const SHEET_MQ = window.matchMedia("(max-width: 900px) and (orientation: portrait)");
function sheetOpen(){ return SHEET_MQ.matches && hud.classList.contains("knobs-open"); }

function wake(){
  if(photoMode) return;               // stays down until photo mode is left
  /* An OPEN knob sheet holds the hud up the same way an adjustment in progress
     does. It is a surface the user is working in — on a phone it is the only
     way to reach the knobs at all — and fading it out from under them two
     seconds after the last touch made it unusable. */
  const held = sheetOpen();
  if(anyDown() && !held){ hud.classList.add("idle"); return; } // stays hidden until release
  hud.classList.remove("idle");
  clearTimeout(idleTimer);
  /* A mouse resting on the open timeline holds it too, for the sheet's
     reason: it is somewhere you work, and a still pointer over it is someone
     deciding where the next key goes, not someone who has walked away. */
  const tlHeld = tlOpen && (tlPointerIn || tlTyping);
  if(dragCount > 0 || editingCell || held || tlHeld) return;
  idleTimer = setTimeout(() => hud.classList.add("idle"), IDLE_MS);
}
["pointermove","pointerdown","wheel","keydown","touchstart"].forEach(ev =>
  window.addEventListener(ev, wake, {passive:true}));
wake();

/* ------------------------------------------------------------------ */
/*  Pull bar — mobile-portrait knob sheet                              */
/*  Only shown under the portrait media query (see the CSS). Hold and   */
/*  drag it up to open the sheet, down to close; the sheet follows the  */
/*  finger 1:1 and settles open or shut on release by position, or by   */
/*  direction on a flick. A plain tap toggles.                          */
/* ------------------------------------------------------------------ */
const knobHandle = document.getElementById("knobHandle");
const FLICK_PX_MS = 0.4;     // release faster than this settles by direction
const TAP_SLOP_PX = 6;       // moved less than this: it was a tap
// How far the bar travels: from the screen's bottom edge to the sheet's top.
function sheetTravel(){ return Math.max(0, knobPanelEl.offsetHeight - knobHandle.offsetHeight); }
// f = 0 shut, 1 open. The sheet is only written inline mid-drag; at rest its
// class-driven CSS owns it (so the 105% hide still clears its shadow).
function placeSheet(f, dragging){
  const travel = sheetTravel();
  knobHandle.style.transform = `translateY(${-f * travel}px)`;
  knobPanelEl.style.transform = dragging ? `translateY(${(1 - f) * knobPanelEl.offsetHeight}px)` : "";
  tlRide(f * travel);                  // the timeline dock rides the sheet's edge too
}
function setKnobsOpen(open){
  hud.classList.toggle("knobs-open", open);
  knobHandle.setAttribute("aria-expanded", String(open));
  knobHandle.setAttribute("aria-label", open ? "Drag down to hide controls" : "Drag up for controls");
  placeSheet(open ? 1 : 0, false);
  // Opening cancels any idle countdown already scheduled (wake() won't set a
  // new one while the sheet is up); closing starts one again from here.
  wake();
}
{
  let drag = null;             // { id, y0, f0, f, lastY, lastT, v, moved }
  knobHandle.addEventListener("pointerdown", e => {
    if(drag) return;
    drag = { id: e.pointerId, y0: e.clientY, f0: hud.classList.contains("knobs-open") ? 1 : 0,
             lastY: e.clientY, lastT: e.timeStamp, v: 0, moved: false };
    drag.f = drag.f0;
    knobHandle.setPointerCapture(e.pointerId);
    hud.classList.add("knobs-dragging");
    wake();
  });
  knobHandle.addEventListener("pointermove", e => {
    if(!drag || e.pointerId !== drag.id) return;
    const dy = e.clientY - drag.y0;
    if(Math.abs(dy) > TAP_SLOP_PX) drag.moved = true;
    const travel = sheetTravel() || 1;
    drag.f = Math.min(1, Math.max(0, drag.f0 - dy / travel));
    const dt = e.timeStamp - drag.lastT;
    if(dt > 0) drag.v = (e.clientY - drag.lastY) / dt;   // px/ms, +ve = downward
    drag.lastY = e.clientY; drag.lastT = e.timeStamp;
    placeSheet(drag.f, true);
  });
  const end = cancelled => e => {
    if(!drag || e.pointerId !== drag.id) return;
    const d = drag; drag = null;
    // Measure the release BEFORE the transitions come back, so the settle animates.
    void knobPanelEl.offsetHeight;
    hud.classList.remove("knobs-dragging");
    let open;
    if(cancelled)                             open = d.f0 === 1;
    else if(!d.moved)                         open = d.f0 !== 1;           // tap toggles
    else if(e.timeStamp - d.lastT > 120)      open = d.f > 0.5;            // parked, then let go
    else if(Math.abs(d.v) > FLICK_PX_MS)      open = d.v < 0;              // flick
    else                                      open = d.f > 0.5;
    setKnobsOpen(open);
  };
  knobHandle.addEventListener("pointerup", end(false));
  knobHandle.addEventListener("pointercancel", end(true));
  knobHandle.addEventListener("keydown", e => {
    if(e.key !== "Enter" && e.key !== " ") return;
    e.preventDefault();
    setKnobsOpen(!hud.classList.contains("knobs-open"));
  });
  // The sheet's height follows the viewport; keep an open bar on its edge.
  window.addEventListener("resize", () => placeSheet(hud.classList.contains("knobs-open") ? 1 : 0, false));
}
/* ------------------------------------------------------------------ */
/*  Back to Corruption Corp — a two-step, same contract as Pinballa's  */
/*                                                                     */
/*  Following the link is a one-way trip out of the app, and the plate  */
/*  sits right beside the logo (which on a phone is the knob sheet's    */
/*  toggle), so the first press only ARMS it — the mark becomes EXIT? — */
/*  and the second one navigates.                                      */
/* ------------------------------------------------------------------ */
const ccExit = document.getElementById("ccExit");
if(ccExit){
  const ARM_MS = 3000;      // armed this long, then it forgets
  const MIN_MS = 350;       // ...but not answerable sooner than this
  let armedAt = 0;
  let armTimer = null;
  const disarm = () => {
    armedAt = 0;
    ccExit.classList.remove("confirming");
    ccExit.setAttribute("aria-label", "Back to Corruption Corp");
    clearTimeout(armTimer);
  };
  ccExit.addEventListener("click", e => {
    // A modified click is "open it over there", not "leave" — hand it straight
    // to the browser without arming anything.
    if(e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
    /* MIN_MS is what stops a DOUBLE-CLICK walking straight through the confirm
       — two presses inside the same gesture are one mis-hit, not a decision. */
    if(armedAt && Date.now() - armedAt >= MIN_MS) return;   // second press: navigate
    e.preventDefault();
    armedAt = Date.now();
    ccExit.classList.add("confirming");
    // The label has to move with it, or a screen reader still announces "Back
    // to Corruption Corp" while the button is asking a question.
    ccExit.setAttribute("aria-label", "Press again to leave Fractal Crack");
    clearTimeout(armTimer);
    armTimer = setTimeout(disarm, ARM_MS);
  });
}

/* ------------------------------------------------------------------ */
/*  Keyframe timeline                                                  */
/*                                                                     */
/*  A loop tlLen FRAMES long — frames of the feedback loop itself, 60   */
/*  a second — and a playhead that walks it one frame per tick (tlTick, */
/*  called from frame()). Every automated knob is set from its keys on  */
/*  every tick: straight lines between keys, held steps for the two     */
/*  pickers, the first key's value before it and the last one's after.  */
/*                                                                     */
/*  EDITING is a parked playhead. Clicking a lane puts the playhead     */
/*  there and stops it; with the editor open and the playhead stopped,  */
/*  any knob that changes is keyed at that frame (setValue ->           */
/*  tlOnKnob). The feedback loop keeps running, so the change can be    */
/*  watched while it is made. The header's play button sets the         */
/*  playhead walking again, Reset starts it over from 0, and closing    */
/*  the editor lets it play.                                            */
/*                                                                     */
/*  LANES: one per automated knob, in the order they were automated,    */
/*  plus a DRAFT lane for the knob last pressed while it has no keys —  */
/*  so pressing knob after knob recolours that one lane rather than     */
/*  stacking up empty ones, and its first key makes it a lane of its    */
/*  own. With nothing automated and no knob pressed yet, one grey lane  */
/*  stands in, so there is always a line to click.                      */
/* ------------------------------------------------------------------ */
const tlDock      = document.getElementById("tlDock");
const tlToggle    = document.getElementById("tlToggle");
const tlPanel     = document.getElementById("tlPanel");
const tlPlay      = document.getElementById("tlPlay");
const tlClock     = document.getElementById("tlClock");
const tlMsg       = document.getElementById("tlMsg");
const tlLenIn     = document.getElementById("tlLen");
const tlClear     = document.getElementById("tlClear");
const tlTrack     = document.getElementById("tlTrack");      // the lanes' scroller
const tlTicks     = document.getElementById("tlTicks");
const tlCap       = document.getElementById("tlCap");
const tlRows      = document.getElementById("tlRows");
const tlHeadLayer = document.getElementById("tlHeadLayer");  // the lines' shared column
const tlHead      = document.getElementById("tlHead");
const tlImport    = document.getElementById("tlImport");
const tlExport    = document.getElementById("tlExport");
const tlFile      = document.getElementById("tlFile");

const TL_FPS = Math.round(1000 / STEP_MS); // 60: a frame of the timeline is a tick of the loop
const TL_MIN_LEN = 2, TL_MAX_LEN = 36000;  // frames; the top is ten minutes
const TL_EPS = 1e-4;                      // two keys this close together are the same key
const TL_HIT = COARSE ? 13 : 7;           // px either side of a key that grabs it
const TL_SNAP_S = COARSE ? 8 : 5;         // px either side of a whole second that snaps to it
const TL_DOOM = 26;                       // px a grabbed key is pulled off its line to delete it
const TL_SLOP = COARSE ? 6 : 3;           // px a press may wander and still be a press
const TL_ARM_MS = 4000, TL_ARM_MIN_MS = 350;

/* Every knob and picker can be keyed except Resolution. That one is quality,
   not look: moving it rebuilds every render target, and a preset has no
   business setting someone else's GPU budget. */
const TL_NAMES = {};                      // id or label, lowercased -> knob key (for import)
cells.forEach(c => {
  const d = c.def;
  if((d.t !== "knob" && d.t !== "sel") || d.k === "res") return;
  TL_KEYABLE[d.k] = c;
  TL_NAMES[d.k.toLowerCase()] = d.k;
  TL_NAMES[d.label.toLowerCase()] = d.k;
});
const TL_ORDER = Object.keys(TL_KEYABLE);  // console order

const byT = (a, b) => a.t - b.t;
const tlClampT = t => Math.max(0, Math.min(tlLen, t));
const tlFmtT = t => String(Math.round(t));      // the header adds the unit once, after the length
function tlHasKeys(){ for(const k in tracks) return true; return false; }
function tlLastKey(){
  let m = 0;
  for(const k in tracks){ const ks = tracks[k]; m = Math.max(m, ks[ks.length - 1].t); }
  return m;
}

/* A value the way its knob would hold it: in range, whole where the knob only
   stops on whole numbers, a real option for a picker. An uploaded shape that
   is not there any more falls back to the default one. Continuous knobs are
   NOT rounded to their step — the step is the knob's feel under a hand, and
   a zoom stepping 0.001 at a time between keys would visibly lurch. */
function tlCoerce(c, v){
  const d = c.def;
  if(d.t === "sel"){
    v = Math.round(v);
    return (v >= 0 && v < optionsOf(c).length) ? v : DEFAULTS[d.k];
  }
  v = Math.max(d.min, Math.min(d.max, v));
  return d.step >= 1 ? Math.round(v / d.step) * d.step : v;
}

function tlValueAt(keys, t, hold){
  const n = keys.length;
  if(t <= keys[0].t) return keys[0].v;
  if(t >= keys[n - 1].t) return keys[n - 1].v;
  let i = 1;
  while(keys[i].t <= t) i++;              // keys[i-1].t <= t < keys[i].t
  const a = keys[i - 1], b = keys[i];
  return hold ? a.v : a.v + (b.v - a.v) * (t - a.t) / (b.t - a.t);
}

/* Set every keyed knob from its keys at the playhead. The knob under a hand
   is skipped for as long as it is held, so an animated knob can be ridden
   live while the timeline plays and rejoins its keys when let go — rather
   than being snapped back out from under the drag sixty times a second. */
function tlApply(){
  const held = (dragCount > 0 && hovered && !tlGesture) ? hovered.def.k : null;
  let changed = null;
  for(const k in tracks){
    if(k === held) continue;
    const c = TL_KEYABLE[k];
    const v = tlCoerce(c, tlValueAt(tracks[k], tlTime, c.def.t === "sel"));
    if(v === P[k]) continue;
    P[k] = v;
    if(k === "delayFrames") scheduleAlloc();   // the ring's depth follows it
    (changed || (changed = {}))[k] = true;
  }
  if(!changed) return;
  refreshHands();
  /* The legend only when it is showing a knob that moved: redrawing a PICKER
     rebuilds its option buttons, and doing that every tick would pull them out
     from under a click. */
  const lt = legendTarget();
  if(lt && changed[lt.def.k]) drawLegend(lt);
}

function tlTick(){
  if(tlRunning){
    tlTime += 1;
    if(tlTime >= tlLen) tlTime -= tlLen;     // it loops
  }
  tlApply();
}

function tlSeek(t){
  tlTime = tlClampT(t);
  tlApply();
  tlDrawHead();
  tlRefreshHint();
}
function tlSetRunning(v){
  tlRunning = v;
  hud.classList.toggle("tl-parked", !v);
  tlPlay.setAttribute("aria-label", v ? "Pause the timeline" : "Play the timeline");
  tlRefreshHint();
}
/* Reset's half: back to the start, and walking. */
function tlRestart(){
  tlSetRunning(true);
  tlSeek(0);
}

/* The knob last pressed (a knob's pointerdown, select(), any change through
   setValue). It is what the draft lane shows, and its lane glows. Hover does
   NOT move it: crossing the console on the way to a knob would otherwise
   recolour, add and drop the draft lane at every knob the pointer passed. */
function tlActivate(c){
  if(!c || TL_KEYABLE[c.def.k] !== c) return;
  // Pressed again, it only needs finding: its lane may be scrolled away.
  if(c.def.k !== tlActiveK){ tlActiveK = c.def.k; tlRender(); }
  tlReveal(tlActiveK);
}

/* A knob changed (see setValue). With the editor open and the playhead
   parked, that is a key at the playhead — the one already there updated, or
   a new one put in.
   A knob's FIRST key also pins where it came from, at frame 0. Without that a
   lone key is a constant: the knob just jumps to the new value across the
   whole loop, and where on the line it was placed would not matter at all —
   which is the one thing placing it is for. With it, the loop starts on the
   look you had and arrives at the new one at the frame you picked. */
function tlOnKnob(c, before){
  if(TL_KEYABLE[c.def.k] !== c) return;
  tlActivate(c);
  if(!tlOpen || tlRunning) return;
  const k = c.def.k;
  let keys = tracks[k], added = false;
  if(!keys){
    keys = tracks[k] = [];
    if(tlTime > TL_EPS) keys.push({t:0, v:before});
  }
  const at = keys.find(q => Math.abs(q.t - tlTime) < TL_EPS);
  if(at) at.v = P[k];
  else { keys.push({t:tlTime, v:P[k]}); keys.sort(byT); added = true; }
  if(added){ tlRender(); tlSyncClear(); }
}

/* The legend's timeline line (see #legend .lg-tl). */
function tlHint(c){
  if(TL_KEYABLE[c.def.k] !== c) return "";
  if(tlOpen && !tlRunning) return "keying at frame " + Math.round(tlTime);
  if(tracks[c.def.k]) return tlOpen ? "animated — click the timeline to key it" : "animated on the timeline";
  return "";
}
function tlRefreshHint(){
  const c = legendTarget();
  if(c) lgTl.textContent = tlHint(c);
}

/* Which lane glows: the knob the legend is showing (a hover, a lock), else
   the one last pressed. Only classes change — hovering must never rebuild. */
let tlLaneEls = {};                       // knob key -> its lane element
let tlHotK = null;
function tlSyncFocus(){
  const c = legendTarget();
  const k = (c && TL_KEYABLE[c.def.k] === c) ? c.def.k : tlActiveK;
  if(k === tlHotK) return;
  tlHotK = k;
  for(const lk in tlLaneEls) tlLaneEls[lk].classList.toggle("hot", lk === k);
}
function tlRgba(hex, a){
  const n = parseInt(hex.slice(1), 16);
  return "rgba(" + (n >> 16 & 255) + "," + (n >> 8 & 255) + "," + (n & 255) + "," + a + ")";
}

/* ---------- drawing ---------- */
let tlGesture = null;                     // the pointer in the lanes, if one is down
let tlTrackW = 0;                         // the lines' width, in px
let tlHeadPx = -1, tlClockTxt = "";

/* Top to bottom: every automated knob in the order it was automated (the
   key order of `tracks`), then the draft — the knob last pressed, if it has
   no keys yet. */
function tlLaneKeys(){
  const ks = Object.keys(tracks);
  if(tlActiveK && !tracks[tlActiveK]) ks.push(tlActiveK);
  return ks;
}
function tlLaneEl(k){
  const lane = document.createElement("div");
  const lab  = document.createElement("button");
  const line = document.createElement("div");
  const del  = document.createElement("button");
  lab.type = del.type = "button";
  lab.className = "tl-lab";
  line.className = "tl-line";
  del.className = "tl-del";
  del.textContent = "×";
  if(!k){
    lane.className = "tl-lane neutral";
    lane.style.setProperty("--k", "#505050");
    lab.appendChild(document.createElement("span")).textContent = "—";
    lab.tabIndex = del.tabIndex = -1;
    lab.title = "Press a knob to put it on the timeline";
  } else {
    const c = TL_KEYABLE[k], accent = c.group.accent, draft = !tracks[k];
    lane.className = "tl-lane" + (draft ? " draft" : "");
    lane.dataset.k = k;
    lane.style.setProperty("--k", accent);
    lane.style.setProperty("--kg", tlRgba(accent, .55));
    lab.appendChild(document.createElement("span")).textContent = c.def.label;   // the span is what clamps
    lab.title = c.group.name + " · " + c.def.label + (draft ? " — turn it to key it" : " — select this knob");
    if(draft){ del.tabIndex = -1; del.setAttribute("aria-hidden", "true"); }
    else {
      del.title = "Clear " + c.def.label + "'s keyframes";
      del.setAttribute("aria-label", del.title);
      const doomed = (tlGesture && tlGesture.doomed) ? tlGesture.q : null;
      tracks[k].forEach(q => {
        const d = document.createElement("div");
        d.className = "tl-key" + (q === doomed ? " doomed" : "");
        d.style.left = (Math.min(1, q.t / tlLen) * 100) + "%";
        line.appendChild(d);
      });
    }
  }
  lane.appendChild(lab); lane.appendChild(line); lane.appendChild(del);
  return lane;
}
/* Every lane, rebuilt. They are a handful of elements, and every gesture in
